paths:
  /ci/api/daemon:
    get:
      summary: The daemon binary this instance is configured to launch
      responses:
        "200":
          description: "The pinned daemon binary. daemonVersion is the version of\
            \ the protocol dependency this service is built against, with source \"\
            pinned\"; source is \"override\" when a deployment has set qits.ci.daemon-version-override.\
            \ previousDaemonVersion is always blank: a pin has no fallback rung."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonPinDto"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Daemon Controller
      security:
      - SecurityScheme:
        - qits:system
        - qits:agent
  /ci/api/events/trigger:
    post:
      summary: Run every event pipeline that selects a caller-supplied domain event
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerEventRequest"
        required: true
      responses:
        "200":
          description: "Evaluated, with the runs it recorded and which repositories\
            \ it could ask"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerEventResult"
        "400":
          description: "Blank name, missing payload, or an unparseable timestamp or\
            \ id"
        "403":
          description: The token covers no repository here — its project claim names
            a project this instance can place no repository in
        "503":
          description: Not evaluated — no candidate repository could be read. Retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggerEventResult"
        "401":
          description: Not Authorized
      tags:
      - Ci Event Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
  /ci/api/repositories:
    get:
      summary: The repository ids qits-ci has recorded runs for
      responses:
        "200":
          description: "Distinct repository ids, ascending"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRepositoryIdsResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Repository Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
        - qits:agent
  /ci/api/repositories/summary:
    get:
      summary: Each repository with its newest run and its newest run on main
      responses:
        "200":
          description: "One entry per repository, ascending by id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRepositorySummariesResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Repository Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
        - qits:agent
  /ci/api/repositories/{repoId}/release-phase:
    get:
      summary: Whether a rev's composed release cycle declares a release phase
      parameters:
      - name: repoId
        in: path
        required: true
        schema:
          type: string
      - description: "A git rev the host can resolve, in practice refs/tags/<version>"
        required: true
        name: rev
        in: query
        schema:
          type: string
      responses:
        "200":
          description: "Answered — declared true or false, with the reason"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleasePhaseResponse"
        "400":
          description: Missing or blank rev
        "503":
          description: "Not answered — the repository is in no catalogue here, or\
            \ the slot file or its archetype could not be read. Retry."
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Repository Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
        - qits:agent
  /ci/api/runners:
    get:
      summary: "Every runner, with whether it is connected and how many runs it holds"
      responses:
        "200":
          description: "Every runner, by name"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRunnersResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Runner Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
        - qits:agent
    post:
      summary: "Declare a runner; answers its install line, once"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunnerRequest"
        required: true
      responses:
        "201":
          description: The runner and the install line carrying its registration token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiRunnerCreated"
        "400":
          description: "A malformed name, slots, description or stepMemoryLimit, or\
            \ UNKNOWN_PLANE: a plane other than EDGE — INTERNAL included, which no\
            \ longer exists"
        "409":
          description: The name is taken
        "502":
          description: qits-idp refused the registration token
        "503":
          description: "This deployment commissions nothing, or cannot render an install\
            \ script — which includes knowing no public domain to address a runner\
            \ by"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Runner Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
  /ci/api/runners/install.sh:
    get:
      summary: "The generic runner install script, which the install line pipes into\
        \ sh"
      responses:
        "200":
          description: "A POSIX sh script, carrying no secret"
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: This deployment cannot render an install script
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Runner Controller
      security:
      - SecurityScheme:
        - qits:ci-runner-registration
        - qits:admin
        - qits:system
        - qits:agent
  /ci/api/runners/{id}:
    patch:
      summary: "Change a runner's slots, description or step memory limit"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchRunnerRequest"
        required: true
      responses:
        "200":
          description: The runner as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiRunnerDto"
        "400":
          description: "Negative slots, an overlong description, a malformed stepMemoryLimit,\
            \ or UNKNOWN_PLANE: a plane other than EDGE"
        "404":
          description: No such runner
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Runner Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
    get:
      summary: One runner
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The runner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiRunnerDto"
        "404":
          description: No such runner
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Runner Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
        - qits:agent
    delete:
      summary: Decommission a runner and give its credentials back
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Gone
        "404":
          description: No such runner
        "409":
          description: "The runner holds a running run, or LAST_RUNNER: it is localhost\
            \ and no other runner exists"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Runner Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
  /ci/api/runners/{id}/greenlight:
    post:
      summary: Lift a runner's quarantine
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The runner as it now is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiRunnerDto"
        "404":
          description: No such runner
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Runner Controller
      security:
      - SecurityScheme:
        - qits:admin
  /ci/api/runners/{id}/healthcheck:
    post:
      summary: Queue a health check for a runner
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "202":
          description: The health check's run id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckQueued"
        "404":
          description: No such runner
        "409":
          description: One is already queued or running for it
        "503":
          description: "The health check's repository, its head or its image could\
            \ not be resolved; ask again"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Runner Controller
      security:
      - SecurityScheme:
        - qits:admin
  /ci/api/runners/{id}/register:
    post:
      summary: "Register a runner with its registration token; answers its client,\
        \ once"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRunnerRequest"
        required: true
      responses:
        "200":
          description: The runner's own client and where to use it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredRunner"
        "400":
          description: Capabilities that are not a JSON object
        "403":
          description: The token is not this runner's
        "404":
          description: No such runner
        "409":
          description: The runner is already registered
        "502":
          description: qits-idp refused the runner's client
        "503":
          description: "This deployment commissions nothing, or knows no public domain\
            \ to tell the runner its addresses by"
        "401":
          description: Not Authorized
      tags:
      - Ci Runner Controller
      security:
      - SecurityScheme:
        - qits:ci-runner-registration
  /ci/api/runners/{id}/registration-token:
    post:
      summary: "Replace a runner's registration token; answers a new install line,\
        \ once"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The runner and the install line carrying its new registration
            token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiRunnerCreated"
        "404":
          description: No such runner
        "409":
          description: The runner is already registered
        "502":
          description: qits-idp refused the registration token
        "503":
          description: "This deployment commissions nothing, or cannot render an install\
            \ script"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Runner Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
  /ci/api/runs:
    get:
      summary: "List a repository's CI runs, newest first"
      parameters:
      - description: Return only the newest n runs; omit for all of them
        schema:
          type: integer
          minimum: 1
        name: limit
        in: query
      - description: The repository whose runs to list — required
        required: true
        name: repositoryId
        in: query
        schema:
          type: string
      responses:
        "200":
          description: "The repository's runs with their step boundaries, without\
            \ step output"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRunsResponse"
        "400":
          description: "The repository id is missing or invalid, or the limit is not\
            \ a positive integer"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Run Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
        - qits:agent
  /ci/api/runs/active:
    get:
      summary: "Every queued or running CI run, all repositories, newest first"
      responses:
        "200":
          description: "The active runs with their step boundaries and queue position,\
            \ without step output"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRunsResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Run Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
        - qits:agent
  /ci/api/runs/cancellations:
    post:
      summary: Cancel every unfinished run a repository has for one release request
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelReleaseRequestRunsRequest"
        required: true
      responses:
        "202":
          description: The request's runs have been stopped or asked to stop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelReleaseRequestRunsResponse"
        "400":
          description: The repository id or the release request id is missing or invalid
        "403":
          description: "The token covers this repository for nobody — no project claim\
            \ and no platform-wide role, or a project claim this instance cannot place\
            \ the repository in"
        "401":
          description: Not Authorized
      tags:
      - Ci Run Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
  /ci/api/runs/finished:
    get:
      summary: "The newest finished CI runs, all repositories, newest first"
      parameters:
      - description: "Return the newest n finished runs; omit for 5, capped at 100"
        schema:
          type: integer
          maximum: 100
          minimum: 1
        name: limit
        in: query
      responses:
        "200":
          description: "The finished runs with their step boundaries, without step\
            \ output"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListRunsResponse"
        "400":
          description: The limit is not a positive integer
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Run Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
        - qits:agent
  /ci/api/runs/queue:
    get:
      summary: "The run queue in claim order, with each run's expected start and finish"
      responses:
        "200":
          description: The queue at one instant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Run Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
        - qits:agent
  /ci/api/runs/rerun:
    post:
      summary: Run one phase of a release request's CI again
      description: "A release is one pipeline of three phases and a PHASE is a unit\
        \ of work with a state and a rerun. Two of them are runs here — RELEASE_REQUEST\
        \ is phase one, the QA run at release/<id>@mergedSha, and RELEASE is phase\
        \ two, the publish run at <version>@commitSha. Phase three is the deploy and\
        \ is qits-deployments' own release request, so it is not a word this door\
        \ takes. A step inside a run is not a phase, so it cannot be re-fired separately.\
        \ Which phase a run is was decided by the event that triggered it and never\
        \ by which config file produced it, so this addresses a run the same way whatever\
        \ the repository's release.yml composed for it — and the same way for a run\
        \ from a bespoke ci-event-*.yml, which is the escape hatch the grammar still\
        \ has. This decides nothing about the release: the pipeline is the release\
        \ request in qits-projects, the new run announces its verdict on the bus exactly\
        \ as the first one did, and the gate between the two phases goes on holding\
        \ the release where it is until that verdict arrives — a gate delays, it does\
        \ not fail."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RerunReleaseRequestPhaseRequest"
        required: true
      responses:
        "202":
          description: A new run has been accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryRunResponse"
        "400":
          description: "The repository id, the release request id or the phase is\
            \ missing or invalid"
        "403":
          description: "The token covers this repository for nobody — no project claim\
            \ and no platform-wide role, or a project claim this instance cannot place\
            \ the repository in"
        "404":
          description: No such repository
        "409":
          description: "That phase has no run yet, its newest run is still going,\
            \ or it succeeded — a succeeded phase has nothing to ask again"
        "401":
          description: Not Authorized
      tags:
      - Ci Run Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
  /ci/api/runs/{runId}:
    get:
      summary: "One CI run with its steps, output and — while it runs — its live step"
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiRunDto"
        "404":
          description: No such run
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Run Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:system
        - qits:agent
  /ci/api/runs/{runId}/cancel:
    post:
      summary: Cancel a queued or running CI run
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Optional human-readable cancellation reason
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CancelRunRequest"
        required: false
      responses:
        "202":
          description: The run has been stopped or asked to stop
        "404":
          description: No such run
        "409":
          description: "The run has already finished, so there is nothing to stop"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      tags:
      - Ci Run Controller
      security:
      - SecurityScheme:
        - qits:admin
  /ci/api/runs/{runId}/retry:
    post:
      summary: "Run a finished CI run's pipeline again, at the same commit"
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      responses:
        "202":
          description: A new run has been accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryRunResponse"
        "403":
          description: "The token covers this run's repository for nobody — no project\
            \ claim and no platform-wide role, or a project claim this instance cannot\
            \ place the repository in"
        "404":
          description: No such run
        "409":
          description: "The run has not finished, so there is nothing to retry yet"
        "401":
          description: Not Authorized
      tags:
      - Ci Run Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:agent
info:
  title: qits-ci API
  version: 2026.929.121335
