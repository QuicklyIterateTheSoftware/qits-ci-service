        - qits:system
        - qits:agent
  /ci/api/runs/rerun:
    post:
      summary: Run one phase of a release request's CI again
      description: "A release is one pipeline of three phases and a PHASE is a unit\
        \ of work with a state and a rerun. Two of them are runs here — RELEASE_REQUEST\
        \ is phase one, the QA run at backingBranch@mergedSha, and RELEASE is phase\
        \ two, the publish run at <version>@commitSha. Phase three is the deploy and\
        \ is qits-deployments' own release request, so it is not a word this door\
        \ takes. A step inside a run is not a phase, so it cannot be re-fired separately.\
        \ Which phase a run is was decided by the event that triggered it and never\
        \ by which config file produced it, so this addresses a run the same way whatever\
        \ the repository's release.yml composed for it — and the same way for a run\
        \ from a bespoke ci-event-*.yml, which is the escape hatch the grammar still\
        \ has. This decides nothing about the release: the pipeline is the release\
        \ request in qits-projects, the new run announces its verdict on the bus exactly\
        \ as the first one did, and the gate between the two phases goes on holding\
        \ the release where it is until that verdict arrives — a gate delays, it does\
        \ not fail."
      operationId: rerunReleaseRequestPhase
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RerunReleaseRequestPhaseRequest"
        required: true
      responses:
        "202":
          description: A new run has been accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryRunResponse"
        "400":
          description: "The repository id, the release request id or the phase is\
            \ missing or invalid"
        "403":
          description: "The token covers this repository for nobody — no project claim\
            \ and no platform-wide role, or a project claim this instance cannot place\
            \ the repository in"
        "404":
          description: No such repository
        "409":
          description: "That phase has no run yet, its newest run is still going,\
            \ or it succeeded — a succeeded phase has nothing to ask again"
        "401":
          description: Not Authorized
      tags:
      - Ci Run Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:desk
        - qits:system
  /ci/api/runs/{runId}:
    get:
      summary: "One CI run with its steps, output and — while it runs — its live step"
      operationId: getRun
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiRunDto"
        "404":
          description: No such run
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Run Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:desk
        - qits:system
        - qits:agent
  /ci/api/runs/{runId}/baseline:
    get:
      summary: "A run's baseline: the gating run of its repository's newest released\
        \ version, or null"
      operationId: getRunBaseline
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The baseline, or {\"baseline\":null}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiBaselineAnswer"
        "404":
          description: No such run
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Report Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:desk
        - qits:system
        - qits:agent
        - qits:ci-run
  /ci/api/runs/{runId}/baseline/reports/{kind}:
    get:
      summary: "The baseline run's release reports of one kind, with payloads"
      operationId: listRunBaselineReports
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
      - name: runId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The reports; [] when there is no baseline or none"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CiReportDto"
        "400":
          description: A bad kind name
        "404":
          description: No such run
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Report Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:desk
        - qits:system
        - qits:agent
        - qits:ci-run
  /ci/api/runs/{runId}/cancel:
    post:
      summary: Cancel a queued or running CI run
      operationId: cancelRun
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        description: Optional human-readable cancellation reason
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CancelRunRequest"
        required: false
      responses:
        "202":
          description: The run has been stopped or asked to stop
        "404":
          description: No such run
        "409":
          description: "The run has already finished, so there is nothing to stop"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      tags:
      - Ci Run Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:desk
  /ci/api/runs/{runId}/gate/reports:
    get:
      summary: "The release reports of the green QA run that gated this run's release\
        \ request, without payloads"
      operationId: listRunGateReports
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "The gate run's reports; runId null and [] when no green QA\
            \ run gated the request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiRunReportsDto"
        "404":
          description: No such run
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Report Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:desk
        - qits:system
        - qits:agent
        - qits:ci-run
  /ci/api/runs/{runId}/reports:
    get:
      summary: "A run's release reports, without payloads, and its baseline"
      operationId: listRunReports
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The run's reports; an empty list when it has none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiRunReportsDto"
        "404":
          description: No such run
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Report Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:desk
        - qits:system
        - qits:agent
        - qits:ci-run
  /ci/api/runs/{runId}/reports/{reportId}:
    get:
      summary: "One release report of a run, with its payload"
      operationId: getRunReport
      parameters:
      - name: reportId
        in: path
        required: true
        schema:
          type: string
      - name: runId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CiReportDto"
        "404":
          description: "No such run, or no such report on it"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      tags:
      - Ci Report Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:desk
        - qits:system
        - qits:agent
        - qits:ci-run
  /ci/api/runs/{runId}/retry:
    post:
      summary: "Run a finished CI run's pipeline again, at the same commit"
      operationId: retryRun
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      responses:
        "202":
          description: A new run has been accepted and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryRunResponse"
        "403":
          description: "The token covers this run's repository for nobody — no project\
            \ claim and no platform-wide role, or a project claim this instance cannot\
            \ place the repository in"
        "404":
          description: No such run
        "409":
          description: "The run has not finished, so there is nothing to retry yet"
        "503":
          description: A step image's digest could not be resolved; ask again
        "401":
          description: Not Authorized
      tags:
      - Ci Run Controller
      security:
      - SecurityScheme:
        - qits:admin
        - qits:admin-agent
        - qits:desk-admin
        - qits:desk
        - qits:agent
  /ci/api/runs/{runId}/steps/{stepIndex}/reports/{kind}:
    put:
      summary: Submit a step's release report of one kind (a run's own ci-run token
        only)
      operationId: putRunStepReport
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
      - name: runId
        in: path
        required: true
        schema:
          type: string
      - name: stepIndex
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/CiReportSubmission"
        required: true
      responses:
        "204":
          description: "Stored, replacing any earlier report of the kind"
        "400":
          description: "A bad kind name, body, or more than 10 highlights"
        "403":
          description: The token is not this run's
        "404":
          description: No such run
        "409":
          description: The run is not RUNNING
        "413":
          description: The body is larger than 1 MiB
        "401":
          description: Not Authorized
      tags:
      - Ci Report Controller
      security:
      - SecurityScheme:
        - qits:ci-run
info:
  title: qits-ci API
  version: 2026.1010.142433
