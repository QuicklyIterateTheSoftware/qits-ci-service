# CI config defaults, shipped from this library jar (docs/epics/qits-ci/). Library jars ship
# defaults as META-INF/microprofile-config.properties (ordinal 100) — a jar's application.properties
# is ignored — read by whichever app pulls the jar in (the `artifacts`/`epics`/`auth/*` modules ship
# their config the same way). The consuming app / env overrides any of these.
#
# ci owns its OWN named datasource + persistence unit + Flyway lineage: its own postgres database,
# never sharing another context's DB or its migration history, so the split into a standalone
# service moved files, not data (the artifacts precedent). Because it is a separate physical DB,
# ci_run.repo_id is a plain String column with NO cross-boundary FK — a deleted repository simply
# leaves runs behind as dangling history. The suites point the same three keys at an embedded
# postgres (EmbeddedPgConfigSource, in this module's and the service module's test sources).
#
# THE THREE KEYS BELOW ARE THE PLATFORM'S GENERIC RESOURCE CONTRACT, read back by the jar that needs
# it. This repository declares `resources: postgresql:db` in .config/qits/deployments.yml;
# qits-platform-deployments creates the role and the database before the cutover and injects
# QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD into the container it starts. Nothing in the deployer
# is ci-specific — an application maps the generic variables in its own shipped defaults, and this
# file is where this context does it. The variable names follow the resource NAME, so renaming the
# resource in the spec stops matching this file: the name is `db`.
#
# THE TRIPLE HAS NO DEFAULTS AND THAT IS THE REFUSE-TO-BOOT STANCE. An unset variable leaves these
# expressions unresolvable, so the process dies at Flyway's migrate-at-start naming what is missing,
# rather than opening some fallback store nobody meant.
#
# That stance is what finally closes this context's oldest failure family, and both halves of it were
# the ${user.home} H2 file. AUTO_SERVER on that URL broke the native binary alone — org.h2.server.
# TcpServer is not in the image — with every JVM test green; and UID 1001 in the runtime image has no
# passwd entry, so ${user.home} resolved to `?` and the container refused to boot on a path. A
# default with no feature in it cannot lose one. What replaced it is a value a deployment supplies or
# does not, and CiPackagedSurfaceIT still puts the SHIPPED expression itself under test by handing
# the launched artifact the variables rather than the datasource keys.
quarkus.datasource.ci.db-kind=postgresql
quarkus.datasource.ci.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.ci.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.ci.password=${QITS_RESOURCE_DB_PASSWORD}

# THE POOL SURVIVES A POSTGRES CUTOVER, WHICH STOCK AGROAL DOES NOT. Replacing the tier's postgres
# severs every pooled connection; without validation the pool hands a dead one to the next caller
# long after the database is back, and 5s of acquisition is not enough for the successor to take the
# alias. Validate at borrow, and wait 15s before giving up.
#
# THREE LINES, AND ALL THREE OR NONE — the platform's datasource baseline, asserted by
# DatasourceBaselineTest and written down in docs/project-setup-quinoa-angular.md with the
# measurements behind it. PatientPgDriver (qits-db-core) delegates to org.postgresql.Driver and,
# when the database is not there, keeps asking for up to 14s rather than failing at once — SQLState
# 08* and 57P03 only, so a wrong password still fails on the first attempt. Its deadline sits UNDER
# the acquisition timeout, so a caller that outlasts it gets the database's real refusal instead of
# a generic pool message; and validate-on-borrow is what turns a dead pooled connection into the
# fresh creation attempt the driver makes patient. Each line does less than it reads as without the
# other two. The url stays a plain jdbc:postgresql: one, so the QITS_RESOURCE_DB_* contract above is
# untouched.
quarkus.datasource.ci.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.ci.jdbc.acquisition-timeout=15S
quarkus.datasource.ci.jdbc.validate-on-borrow=true

# A dedicated persistence unit bound to the ci datasource, owning only this module's entities
# (the default PU keeps qits' domain entities). packages assigns entity→PU unambiguously.
quarkus.hibernate-orm.ci.datasource=ci
quarkus.hibernate-orm.ci.packages=eu.wohlben.qits.ci.entity

# Own Flyway lineage at a distinct classpath location so it never mixes with the other lineage this
# application boots (the eventstream outbox's). ONE location and ONE V1: the move to postgres is a
# clean start, so the nine H2 migrations are history in this repository's log rather than a prefix of
# this lineage — see V1__init.sql's header.
#
# The SECOND location is gone with them. It named the java package holding
# V9__drop_generated_check_constraints, a migration that existed only to remove constraints H2 had
# named itself; a fresh schema simply does not create them. Nothing restates this list in a test
# resources file — a second copy is a copy that drifts.
#
# baseline-on-migrate is GONE with that lineage. It told Flyway to adopt a non-empty schema it had
# no history table for, which the H2 file needed while it was being adopted; every database this code
# now meets is empty or was created by this very lineage, and the flag would only mask the one case
# worth failing on — a schema somebody else put there.
quarkus.flyway.ci.migrate-at-start=true
quarkus.flyway.ci.locations=classpath:db/ci/migration

# Where the git host answers. ci reads a repository's pipeline config off this host's content
# endpoints — <base>/git/<repoId>/blob/<rev>/<path> and .../tree/<rev>[/<path>] — so it needs no
# clone, no local mirror and no git binary. ci appends /git/<repoId> itself, so this value stops at
# the SERVICE: `git` is the codebase's second-level segment for the git host and belongs in ci's
# code, whereas WHICH service hosts it is a deployment fact and belongs here. Do NOT include /git.
#
# THE HOST IS qits-githost NOW, and the value lost a path segment with the move. The git host used
# to live inside qits-artifacts and answer under that service's gateway segment, so the base was
# `http://<host>:<port>/artifacts` and a read landed on /artifacts/git/<repoId>. Standing alone it
# serves /git/** at the ROOT — GitHostRoutes' BASE is the literal `/git` and no config key moves it
# — so the base is scheme+host+port and nothing else, and a read lands on /git/<repoId>. A value
# that keeps the old segment 404s every read, which surfaces as "no pipeline" on every push rather
# than as an error: this is a cutover both services make in one step.
qits.ci.git-host-url=http://qits-githost:8080

# The same base, same shape, as reachable FROM a step container on the shared network. Deployments
# on qits-net use the alias as it stands; a host-run docker daemon wants
# http://host.docker.internal:8080 with --add-host=host.docker.internal:host-gateway.
# Git in an untrusted step container goes through the platform edge, which turns oauth2:JWT Basic
# into the bearer the githost verifies.  Do not point this at githost directly: it intentionally
# accepts Bearer only and must never grow a second credential parser for containers.
qits.ci.container-git-url=http://qits-platform-edge:8080

# WHERE qits-projects ANSWERS, and there is DELIBERATELY NO DEFAULT — the key is a kill switch.
# It is the platform's repository catalogue: GET <base>/projects/api/repositories answers
# {"repositories":[{"id","projectId","name","mainBranch"}]}, which is the candidate list the trigger
# engine evaluates an arriving event against, and the only place the public (projectId, name) pair a
# clone URL is built from can be read. Unset, ci falls back to the git host's own GET /git listing of
# storage ids, which is exactly what it did before this key existed — so a pre-cutover platform keeps
# triggering and a clone-alone build of this repository needs no qits-projects at all. After the
# identity cutover that fallback answers nothing (the id-addressed scheme is qits-projects' own), so
# a deployment that wants event triggers sets this:
#
#   qits.ci.projects-url=http://qits-projects:8080
#
# It cannot be derived from qits.ci.git-host-url the way the listing url used to be: that is a
# different service at a different address, not a second path under one ci already holds.

# The token audience the in-container Git helper asks for is NOT a key any more. It is the constant
# qits-platform (CiDaemonLauncher.CONTAINER_GIT_AUDIENCE), one audience for every service
# (service-client-identity-plan.md, C4); the git host accepts it because C1 (qits-auth-core)
# widened its inbound audience check fleet-wide. The key it replaced, qits.ci.container-git-audience,
# is read by nothing: a leftover QITS_CI_CONTAINER_GIT_AUDIENCE deployment entry changes nothing and
# shows as orphaned in qits-configuration.

# Step containers: the network they join, the number of builds admitted in parallel, the default
# per-step timeout, and the bounded tail-truncated combined output kept per step. Deployments that
# run several stacks
# on one host MUST override the network together with qits.workspace.network (see
# docker-compose.prod.yml) — the alias in container-git-url only resolves on the network qits itself
# is on.
#
# THERE IS NO qits.ci.container-runtime ANY MORE. It named the docker-compatible CLI this process
# shelled out to, and this process shells out to nothing: qits-containers owns the daemon, and a
# step container is one PUT away. The network is still named here because it is still qits-ci's to
# choose — it travels in the spec, and the orchestrator puts the container on it.
#
# step-timeout-seconds is the DEFAULT deadline, not the only one: 30 minutes, which is what a step
# that declares none gets. A per-step `timeout-seconds:` in a `.config/qits/ci-*.yml` overrides it.
# It is enforced INSIDE the container by the step's own daemon, which signals its child and reports
# the timeout as a timeout rather than as a suspicious exit code. A step that hits the deadline is
# aborted and recorded TIMED_OUT, and so is its run — a deadline is not a pipeline verdict.
#
# The grace is how much longer the host waits before concluding the daemon is not going to answer at
# all. It sits behind the in-container deadline on purpose — the daemon enforcing its own child is
# the normal path and this backstop should never fire — and it has to cover the daemon's SIGTERM,
# its 5s grace, the SIGKILL, and one frame's flight. When it does fire the host sends a Cancel and
# then removes the container, and the step is recorded timed out.
#
# output-max-chars bounds BOTH the live relay and the persisted tail — one budget, applied as text
# arrives rather than to an assembled string. A step's output is repo-controlled and unbounded, so
# this is a security property, not a display preference.
#
# concurrent-builds is an instance-wide bound on RUNNING pipelines. Each pipeline still executes
# its own steps sequentially, but independent runs no longer wait behind one slow build. It must be
# at least 1; size it together with the host resources and the per-container caps below. It is also
# how many CLAIM LOOPS this process runs: there is no executor queue any more, so a worker is a
# thread that reads the QUEUED rows, asks CiRunOrdering which one to take, and takes it.
#
# queue-poll-interval is how long an idle claim loop waits for a wake before scanning anyway. Every
# accept, retry and boot sweep releases one, so this is a NET rather than the mechanism: it covers a
# row nobody woke anybody for — one accepted by a process that died before it could, one written by
# an operator, one whose permit another worker consumed and then lost the race to claim. Ten seconds
# is short enough that such a row is never stranded and long enough that an idle instance is not
# polling its database for a living. Both test suites set an hour, so a staged QUEUED row is claimed
# only when a test says so.
qits.ci.network=qits-net
qits.ci.concurrent-builds=4
qits.ci.queue-poll-interval=PT10S
qits.ci.step-timeout-seconds=1800
qits.ci.step-timeout-grace-seconds=60
qits.ci.output-max-chars=65536

# How long POST /ci/api/events/trigger keeps asking repositories. That call evaluates on the request
# thread — a caller-supplied event is redeliverable by nobody, so it may not be handed to a queue —
# and each candidate costs one read of the git host. The deadline is what stops an unanswering host
# from holding the caller for candidates times that read timeout; the repositories not asked come
# back in the answer as skipped, so the caller sees a partial answer as partial.
qits.ci.trigger-deadline-seconds=60

# THE OWED-EVENT LEDGER'S TWO KEYS. An event accepted off the bus is recorded in ci_owed_event before
# the acceptance is reported, and the row is deleted when the evaluation returns — so the table is
# empty in a healthy process and a row in it is an event some process accepted and never evaluated.
# Two sweeps clear it: one at boot, which takes everything (the deployment is stop-first, so a row at
# boot belongs to a process that is gone), and this schedule, which takes what has been sitting for
# longer than the grace. See V13__owed_trigger_event.sql for the cutover it was measured on.
#
# The grace is generous because picking up an evaluation that is still running costs a duplicate
# git-host fan-out and nothing else — ci_run's unique (trigger_event_id, repo_id, config_path)
# refuses the second run — while a value below a slow fan-out would make that the normal case.
qits.ci.trigger-owed-sweep-interval=1m
qits.ci.trigger-owed-grace=5m

# Which repository holds the PLATFORM pipelines: the `.config/qits/ci-platform-event-*.yml` files
# that are evaluated for every arriving event and record their run against the repository the event's
# payload names. The wrapper is the default because it is the one repository the whole catalogue is
# described in, and because a pipeline that acts on every repository belongs where no single
# repository owns it.
#
# It costs one listing of that repository per arriving event and nothing per candidate. BLANK TURNS
# IT OFF and reads nothing at all — a deployment that has decided not to have platform pipelines must
# not pay for a file it does not carry.
qits.ci.platform-pipelines-repository=qits-qits

# A step's script is REPO-CONTROLLED code, so the container is a hostile-code sandbox: privileges
# are dropped (capDropAll, noNewPrivileges), no docker socket is mounted unless the step declared
# `docker: true`, and these caps bound what one step can consume. They travel in the workload spec
# qits-ci sends and qits-containers applies them; the values are still qits-ci's to choose, because
# what a BUILD may consume is this service's policy. See
# docs/issues/2026-07-26_ci-executes-repo-controlled-code-from-unauthenticated-pushes.md.
qits.ci.memory-limit=4g
# 4096, raised from 2048 on 2026-08-29: qits-workspaces' full `mvn verify` — maven + a Quarkus
# surefire JVM's several hundred threads + zonky postgres backends per database + a git subprocess
# per TestOrigin push — hit the ceiling reproducibly (`cannot fork() for pack-objects: Resource
# temporarily unavailable`, twice, same tests). Threads count against --pids-limit like processes
# do. Still a bound, and deliberately not more: a fork bomb from repo-controlled code stays
# contained, which is this line's whole reason to exist (see the doc above).
qits.ci.pids-limit=4096
qits.ci.cpus=2

# THERE IS NO qits.ci.docker-socket-path ANY MORE. It named where the host's docker daemon listens,
# for the ONE thing a pipeline can ask for: a step declaring `docker: true`. That step still gets the
# socket and it is still opt-in per step and visible in the repository's config diff — the spec
# carries a `hostDockerSocket` flag and qits-containers, which is the process that actually holds a
# socket, knows where the daemon listens. A rootless daemon under $XDG_RUNTIME_DIR or a
# socket-activated proxy is a deployment fact of the ORCHESTRATOR's now, configured once there
# instead of once per consumer.
#
# Such a step is still ROOT-EQUIVALENT ON THE HOST: the socket is the daemon and the daemon is root,
# so the step can mount host paths and start privileged containers regardless of the cap-drop flags,
# which fence its own process tree and not what the daemon does on its behalf. Accepted for the POC
# under the standing posture (sources are trusted). Every step that does not declare the flag keeps
# exactly the sandbox above — and qits-ci itself now holds no socket at all.

# --- talking to qits-containers -------------------------------------------------------------------
# WHO THIS PROCESS IS to the orchestrator. The registry addresses a place as owner/workload/ref, and
# `owner` is compared against the machine token's `sub` once qits.auth.machine.required is on — so
# this value and the oidc-client's client id ARE THE SAME STRING, and the default says so rather
# than repeating it. qits-idp mints one client per environment (dev-qits-ci, prod-qits-ci), and that
# prefix is exactly what keeps two environments sharing one docker daemon from reaching each other's
# containers.
#
# THE COUPLING IS DOCUMENTED HERE AND NOWHERE ELSE. A deployment sets the `qits` client's id
# (QITS_RESOURCE_IDP_CLIENT_ID, or the old QUARKUS_OIDC_CLIENT_CLIENT_ID it falls back to) to
# <env>-qits-ci and this key follows it; a deployment that wants them apart sets this one too and
# owns the consequence, which is a 403 from every route the moment the gate goes on. With the gate
# off the owner is trusted as it arrives, which is why the fallback is the bare literal and why a dev
# build needs no idp.
qits.ci.containers.owner=${quarkus.oidc-client.qits.client-id:qits-ci}

# How long the boot reap keeps asking an orchestrator that is not answering yet. Both services come
# up in one compose and either order is legal, so a refused connection at boot is ordinary and this
# window is what turns it into a delay rather than a failure. Past it, boot PROCEEDS with a WARN —
# the same stance the old docker-briefly-down sweep took, and for the same reason: a process that
# refused to start because a teardown could not run is a process that cannot recover the runs it is
# holding. What covers the orphans then is the registry's own maxAge GC.
qits.ci.containers.boot-reap-patience=PT60S

# How long a step launch holds through an orchestrator that cannot AUTHORIZE it yet, or cannot be
# reached at all. MEASURED: on the 2026-08-12 rebootstrap the deploy train replaced
# qits-platform-idp, and the next three push builds died at step launch with
# `orchestrator refused: refused 401` while every later one passed — a trailing-edge window of tens
# of seconds in which this service's token, or the orchestrator's copy of the signing keys, belonged
# to the idp that had just been replaced. Three builds failed for a reason that had nothing to do
# with their commits.
#
# RETRYING IS SAFE HERE, which is what changed and why the old "a create is never retried" rule does
# not cover this. `ensure` is a PUT per (owner, workload, ref) and the ref is the step container's
# own name, so every attempt addresses the SAME place: a container an unanswered attempt created is
# adopted by the next one rather than duplicated. That was not true of the bare `docker run` this
# replaced, which is where the rule came from.
#
# ONLY the answers that are about the moment are held through — 401, 403, and nothing answering.
# A refusal that is about the request (SPEC_CONFLICT, IMAGE_MISSING, a 400 on a value) is still one
# attempt and one recorded LAUNCH_FAILED, because no window fixes it.
#
# The window bounds when a FRESH attempt may start; the attempt already running keeps its own
# deadline (qits.ci.daemon-register-timeout-seconds), so the worst case is this value plus one of
# those. 90s + 180s is far inside the 15 minutes of slop under the registry's maxAge, so the GC stays
# a backstop rather than a second timeout even when the first attempt did create the container.
qits.ci.containers.launch-patience=PT90S

# qits-platform-artifacts' registry coordinates, injected into EVERY step container as
# $QITS_REGISTRY and $QITS_IMAGE_REPOSITORY so a publish script names no deployment fact of its own.
# With $QITS_CI_SHA they spell the whole tag convention qits-cd pulls by:
#   <registry>/<repository>/<application>:<sha>
# where <application> is the environment's application name, by convention the repository's name.
#
# RECEIVER-NAMED, not qits.ci.*: these are qits-platform-artifacts' own coordinates, and there is
# ONE spelling of them in the platform — qits-cd ships the same two keys and derives its pull
# references from them. A deployment that moves the registry edits one pair of values in both
# services, not two differently-named pairs.
#
# The address is dialled by the HOST'S DOCKER DAEMON, not by this process and not even by the step's
# CLI: the CLI on the far side of the mounted socket is a client, and the daemon is what performs the
# build and the push and therefore what resolves the name and negotiates TLS. So a deployment must
# make this address resolvable FROM THE DOCKER HOST and add it to the daemon's insecure-registries
# while the registry speaks plain HTTP — the same class of fact as the socket mount above, now served
# by the same socket.
qits.artifacts.registry-host=qits-platform-artifacts:8080
qits.artifacts.image-repository=qits

# Registry hosts the run's credential is written into a publishing step's docker config.json for,
# ON TOP OF the two this service already knows. THE DOCKER CLIENT PICKS A LOGIN BY HOSTNAME, and so
# does buildctl, so one entry is one host's worth of auth: a document naming only the push registry
# leaves a PULL from anywhere else unauthenticated, and a step image coming
# `FROM mirror.dev.localhost:8080/...` then dies on a 401 no pipeline mentions.
#
# THE DEFAULT IS registry-host AND THE DOCUMENT ALSO NAMES buildkit.registry-host, which is not the
# same address and is not a widening a deployment should have to ask for. The two are separate keys
# for an unchanged reason — one registry, two network positions: registry-host is the HOST DAEMON's
# view and buildkit.registry-host is the qits-net alias buildkitd resolves — but the auth document
# has to name BOTH, because one is where a push GOES and the other is where a pull COMES FROM. A
# converted recipe composes its push reference from $QITS_BUILD_REGISTRY; a document without that
# host leaves buildctl holding no login for the only address it addresses, which costs nothing for
# exactly as long as the store lets an anonymous /v2 publish through and fails every image push on
# the estate the moment it answers one with a Bearer challenge.
#
# The union is made in CiDaemonLauncher.authHosts rather than in this expression, so that it follows
# qits.ci.buildkit.enabled: off, $QITS_BUILD_REGISTRY is sent empty and a login for that alias would
# be an entry for an address nothing addresses. Duplicates collapse, so a deployment whose two keys
# hold one value gets one entry rather than a duplicate JSON key.
#
# What this key is therefore FOR is the hosts only a deployment knows: behind the edge it names both
# vhosts — registry.dev.localhost:8080,mirror.dev.localhost:8080 — and every entry carries the SAME
# commissioned pair, because it is one identity at one idp whatever hostname fronts it.
qits.ci.docker-auth-hosts=${qits.artifacts.registry-host}

# --- the platform builder, from this side ---------------------------------------------------------
# THE FLEET-FACING KILL SWITCH for building through the platform-owned buildkitd. qits-containers
# owns the builder container and injects $BUILDKIT_HOST into every socket-holding step container;
# what this service owns is the decision whether that happens, per the shipped-ON rule
# (resolve-platform-step-images' argument): the recoverable state is the default and one variable
# reverses it, QITS_CI_BUILDKIT_ENABLED=false. Off, the docker-step environment carries BOTH
# $BUILDKIT_HOST and $QITS_BUILD_REGISTRY as EMPTY — empty-never-absent, the mirror pair's off
# value — and qits-containers defers to a present key, so a converted recipe fails loudly at its
# first buildctl call instead of silently building through the socket it still holds. Unconverted
# recipes read neither variable and are untouched.
qits.ci.buildkit.enabled=true

# The registry as the PLATFORM BUILDER resolves it — $QITS_BUILD_REGISTRY, what a converted recipe
# composes its push reference from. Deliberately its own key beside qits.artifacts.registry-host:
# that one is the HOST DAEMON's view of the same registry and deployments override it accordingly,
# while this is the qits-net alias buildkitd pushes through. One registry, two network positions,
# two keys — collapsing them is what made $QITS_REGISTRY useless to curl in the first place.
#
# Separate keys, ONE auth document: this value is in the config.json a publishing step gets, because
# it is the host a push goes to and a Bearer challenge from the store is answered per hostname. See
# qits.ci.docker-auth-hosts above; nothing about the separation changes.
#
# dev-qits-artifacts, MEASURED, not the qits-platform-artifacts this line first guessed:
# qits-artifacts is a dev-TIER application and carries the tier alias every environment service
# does; the guessed spelling resolves nowhere on qits-net, and the first converted release run
# (2026-09-05) failed on exactly that DNS lookup. The value must match what qits-containers'
# buildkitd.toml grants plain HTTP to — the two move together.
qits.ci.buildkit.registry-host=dev-qits-artifacts:8080

# --- the credential a step pushes with ------------------------------------------------------------
# IT IS COMMISSIONED PER RUN NOW, and there is no key naming it. qits.ci.registry-auth.client-id and
# qits.ci.registry-auth.client-secret are GONE: they were one static pair, shared by every run of
# every repository, living in a deployment's environment for as long as the deployment did. A
# deployment still setting them is setting nothing.
#
# What replaced them: at the first step of a run that declared `docker: true`, qits-ci POSTs
# {"contextKind":"ci-run","contextId":"<runId>"} to
# <quarkus.oidc-client.qits.auth-server-url>/api/clients with HTTP Basic of its OWN oidc client
# (`qits`, service-client-identity-plan.md C4), and qits-idp answers a fresh client id and secret.
# Every later docker step of that run reuses the pair; the run's close deletes it. So the ADDRESS and
# the CALLER are both derived from the oidc-client block and there is nothing to configure here — a
# second key would be a second thing to keep in step with the first.
#
# THE FALLBACK ARM IS THE OLD UNSET-KEYS BEHAVIOUR, EXACTLY. With
# quarkus.oidc-client.qits.client-enabled off (the shipped posture, and every test's) there is
# nothing to commission with, so nothing is commissioned, nothing is injected, and a step container's
# environment is byte-identical to what it was — which is what a deployment on a registry that
# answers an anonymous push stays on.
#
# WHAT IT REACHES, AND ONLY IT: a step that declared `docker: true`, which is the only step that
# holds the socket and so the only one that can push. Such a step gets $DOCKER_CONFIG pointing at a
# directory the bootstrap writes {"auths":{"<registry-host>":{"auth":"<base64 id:secret>"}}} into —
# under /tmp, never in the checkout, so it can never land in a `docker build` context — plus
# $QITS_COMMISSIONED_CLIENT_ID and $QITS_COMMISSIONED_CLIENT_SECRET, which a BuildKit secret mount
# (--secret id=…,env=QITS_COMMISSIONED_CLIENT_SECRET) consumes without writing a layer. The registry
# the document names is qits.artifacts.registry-host above, the same address the step reads as
# $QITS_REGISTRY.
#
# The base64 is the docker CLI's own encoding and is not encryption: the credential is as protected
# as the environment of a container running repo-authored code, which is to say it is readable by
# the step. That is inherent to a push from a step — what the per-run credential changes is the
# BLAST RADIUS, from every future run to this one.

# How long a commission holds through an idp that cannot answer yet. The classification is the launch
# patience's: nothing answered, a 5xx and a 401 are about the moment (an idp cutover answers 401 to a
# credential that was valid a minute ago), a 403 and a 400 are about the request and stand at once.
# Thirty seconds, ~5s between attempts. Past it the STEP fails naming the commission call, which is
# deliberate: launching credential-less would turn an idp blip into a push 401 minutes later, inside
# somebody's build, with nothing in the record naming the cause.
qits.ci.commission.patience=PT30S

# How often the leftovers are swept. A credential is deleted when its run closes, so what this
# collects is the run this process died holding — one per process death — plus any DELETE that did
# not land. It lists this owner's live commissions at qits-idp and deletes every ci-run row whose
# contextId is not a QUEUED or RUNNING run. Hourly because nothing changes faster than that; the
# boot pass is what makes a restart's leftovers a minute's problem rather than an hour's.
qits.ci.commission.reconcile-interval=1h

# qits-platform-artifacts' npm registry roots, injected into EVERY step container as
# $QITS_NPM_REGISTRY_URL (the hosted repository, where @qits/* packages are published) and
# $QITS_NPM_PROXY_URL (the pull-through cache of npmjs, which every install resolves through). A
# step writes its own ~/.npmrc from the two — see the preamble in README.md — so no repository ever
# spells a registry address.
#
# RECEIVER-NAMED and one spelling, for the same reason as the two keys above: they are the artifacts
# service's own addresses, not ci's opinion about them.
#
# THE CAVEAT IS THE OPPOSITE OF registry-host'S. These are dialled by the STEP CONTAINER ITSELF over
# qits-net — plain HTTP from the npm CLI to a service alias, no socket, no host daemon in the path.
# So the defaults are the in-network alias and they are RIGHT for a deployment on qits-net, and a
# host-published mapping (the local stack's registry.dev.localhost:8080) must NOT be substituted
# here the way it must for registry-host: a step container has no such address. Only a deployment
# that moves qits-platform-artifacts off the alias overrides these.
qits.artifacts.npm.hosted-url=http://qits-platform-artifacts:8080/artifacts/npm/npm/
qits.artifacts.npm.proxy-url=http://qits-platform-artifacts:8080/artifacts/npm/npmjs/

# qits-artifacts' hosted Maven repository, injected into EVERY step container as
# $QITS_MAVEN_REGISTRY_URL. Like the npm roots above, it is dialled by the step container itself
# over qits-net, so the in-network service alias is correct and a host-published localhost mapping
# is not. A release pipeline passes this value to Maven as its deployment repository; consumers use
# the same root to resolve the SoftwareRelease coordinate they were told about.
#
# ALSO qits.artifacts.url's DERIVATION SOURCE when that key is blank — see its own comment and
# CiDaemonLauncher.resolvedArtifactsUrl(). This key IS set on every live deployment (the bootstrap's
# qits-ci extras), which is why it is safe to derive from.
qits.artifacts.maven.registry-url=http://qits-platform-artifacts:8080/artifacts/maven/maven

# qits-artifacts' ROOT — scheme and authority, no path — injected into EVERY step container as
# $QITS_ARTIFACTS_URL. It exists to end three separate string-chopping derivations in the estate:
# every pipeline that publishes an SBOM, a daemon binary or a docs bundle took one of the roots
# above and cut the path off with its own sed expression. There is one origin, so saying so is one
# variable rather than one regex per pipeline.
#
# BLANK IS THE DEFAULT, and an explicit value here still wins. qits-platform-artifacts is a
# retired alias — the store is one alias per tier now (dev-qits-artifacts and so on) — and no
# platform deployment sets this key. Setting it here to any one alias would be wrong for every
# other tier, so CiDaemonLauncher.resolvedArtifactsUrl() derives the value it actually sends
# instead: the scheme and authority of qits.artifacts.maven.registry-url below, which IS set for
# every live deployment (see its own comment). That is the ONE place the derivation happens; every
# other reader of $QITS_ARTIFACTS_URL goes through it.
qits.artifacts.url=

# qits-platform-mirror's Maven Central pull-through, injected into every step container in BOTH
# planes, each addressing the mirror by the route its network can reach — both on /mirror/maven,
# the mirror's OWN route.
#
#   $QITS_MAVEN_PROXY_URL (step-url) — dialled by the STEP CONTAINER over qits-net (a userflows
#     run's mvnw), so the in-network alias is right, exactly as for the npm proxy above.
#   $QITS_MAVEN_CENTRAL_MIRROR_URL (build-url) — consumed as a docker-build arg. A `docker build
#     --network host` RUN resolves mirror.dev.localhost the way the FROM lines do (dockerd/host
#     config), so it reaches the EDGE — proven, an early /artifacts build-url got a 401 there, not a
#     DNS failure. The route is /mirror, NOT /artifacts: the edge routes /artifacts to the hosted
#     registry (its primary route travels to every vhost), so the mirror is unreachable there and a
#     build 404s; /mirror is the mirror's own route. The edge's 401 is answered by the commissioned
#     client the build already holds, presented as HTTP Basic by the <server id="qits-central-proxy">
#     in every service's .qits-maven-settings.xml — the edge brokers Basic to an idp token. Do NOT
#     point this at /artifacts or at a qits-net alias a --network host RUN cannot resolve.
#
# The settings profile activates only on a NON-EMPTY QITS_MAVEN_CENTRAL_URL (measured Maven 3.9: an
# empty value does not activate a property-presence profile), so enabled=false injects both empty
# and every build resolves Central directly — the bootstrap lever, and the state before this shipped.
qits.mirror.maven-central.enabled=true
qits.mirror.maven-central.build-url=http://mirror.dev.localhost:8080/mirror/maven/central
qits.mirror.maven-central.step-url=http://qits-platform-mirror:8080/mirror/maven/central

# qits-platform-artifacts' docs repository root, injected into EVERY step container as
# $QITS_DOCS_URL. The npm and maven reading again — dialled by the step container itself over
# qits-net, so the in-network alias is right and a host-published localhost mapping is not.
#
# It includes the `docs` repository segment, unlike registry-host and like the npm and maven roots,
# because there is exactly one docs namespace and a pipeline choosing one would be a pipeline able
# to publish into a namespace nobody seeded. A step appends `/<site>/-/<version>` and nothing else.
qits.artifacts.docs.url=http://qits-platform-artifacts:8080/artifacts/docs/docs

# qits-workspaces' root, injected into EVERY step container as $QITS_WORKSPACES_URL. A step that
# releases its own repository after green tests — the release train's maintenance leg — POSTs to it,
# and must spell no deployment fact of its own.
#
# Dialled by the STEP CONTAINER ITSELF over qits-net, so the caveat is the npm pair's and not
# registry-host's: the in-network alias is the value that is RIGHT here, and a host-published
# mapping must not be substituted for it. The scheme+host+port shape is the platform's; the path
# belongs to the caller, which spells /workspaces/api/... itself.
#
# qits.ci.* rather than receiver-named because ci is the only service that ships it: the two
# receiver-named pairs above are spelled identically by qits-cd, and a key with one reader is a key
# with one name.
qits.ci.workspaces-url=http://qits-workspaces:8080

# --- the ci-daemon (eu.wohlben.qits.ci.daemonhost, in the service module) ------------------------
# A step container no longer runs a script under `docker run`: it runs qits-ci-daemon, which dials
# BACK to qits-ci over a websocket and receives the step as the reply to its own "initialized". The
# keys below are that arrangement's whole configuration. They are shipped from this jar with the
# other qits.ci.* defaults even though the code reading them lives in `service` (and, for the pin
# itself, in `ci/control/CiDaemonPins`) — a deployment sets qits.ci.* in one place and does not care
# which module reads which.
#
# THE VERSION IS NOT A KEY ANY MORE — IT IS THE POM. It comes from the pinned dependency
# eu.wohlben.qits:qits-ci-daemon-protocol, whose CiDaemonBinary.VERSION is the version of the
# qits-ci-daemon binary the same release published. So the wire contract both sides speak and the
# binary one side downloads are one artifact, bumping one is bumping the other, and the pair cannot
# be mismatched by a deployment act. What gates a bump is this repository's own release request,
# which runs that binary at that version against this host before the merge.
#
# WHAT THAT REPLACED, because every retired key below is part of it: qits.ci.daemon-version was the
# deployment's pin, and on top of it sat a LADDER — a durable table of candidate versions
# (ci_daemon_pin, dropped in V18) adopted straight off SoftwareRelease frames by a bus listener,
# each probed by launching a throwaway container running whatever had just been published and kept
# if the container dialled back. An adopted rung outranked the configured pin, so a daemon release
# reached every CI step container on the platform without qits-ci's own tests ever having run
# against it, and the only gate on a protocol break was a probe the released service ran on itself,
# in production, against its own host.
#
# THE VERSION AND THE URL STILL MOVE TOGETHER, which is why the url is a template rather than a
# second free value. The version is resolved once per run (CiDaemonPins.answer) and injected into
# every one of that run's step containers, so a deploy landing mid-run cannot make step 3 speak a
# different protocol than step 1.
#
# {version} IS A VERSION, not a digest — a calver like `2026.803.91607`, or the sha256 hex of a
# binary this store has no calver row for yet (a freshly bootstrapped platform's own daemon, still
# published that way). The address is qits-platform-artifacts' version-addressed daemon route,
# `GET /artifacts/daemons/<name>/<version>`, which resolves through that store's own
# `daemon_binary(repository, name, version)` row rather than through an OCI blob digest. A version is
# the software's coordinate; needing a digest to name a release would mean the artifact model was
# wrong. What stands in for the old digest-as-integrity-pin is
# immutability instead: a PUT of an existing version is 409 inside qits-platform-artifacts' publish
# transaction, so a version pointer here can never come to mean different bytes. The response still
# echoes `Docker-Content-Digest` for a caller that wants to verify, but nothing in this pin requires
# it to.
#
# The OLD digest-addressed template (`.../v2/qits/ci-daemon/blobs/sha256:{version}`) still works —
# the OCI blob route is untouched — so a deployment can put it back with this same one config edit.
#
# Publishing a calver is one request against the version-addressed route:
#   curl -u qits:$TOKEN --data-binary @qits-ci-daemon \
#     -X PUT 'http://<host>/artifacts/daemons/qits-ci-daemon/<calver>'
#
# --- THE EMERGENCY HATCH, AND WHY IT IS SPELLED `-override` -------------------------------------
# Blank, and it is expected to STAY blank. Set, it runs a daemon binary that no release request of
# this repository has ever run against this host, which is the honest reading of an override and the
# reason it is not called a pin. CiDaemonPins.answer() prefers it over the dependency's version and
# reports source "override" on GET /ci/api/daemon so the deviation is visible without asking a
# deployment what it holds.
#
# THE NAME IS THE POINT, AND THE REASON IS SPECIFIC. The key it replaces is `qits.ci.daemon-version`,
# and the standing platform still holds an entry for it — env.QITS_CI_DAEMON_VERSION, a sha256 digest
# written by qits-bootstrap. NOTHING ON THIS PLATFORM DELETES A CONFIGURATION ENTRY: qits-configuration
# reports an orphan and never cleans it up, and DELETE …/entries/{key} is {qits:admin, qits:system},
# which an agent credential is not. So "retire the key" could not mean "remove the value"; it had to
# mean STOP READING THAT NAME, and a rename is the only move that does that with no deletion required
# and no window in which the residue still decides. It buys a second thing on its own merits: this
# name has never been written by any automation, so a value found in it was put there by a person on
# purpose — which is exactly what an override should be able to say about itself. `RetiredDaemonKeys`
# is what makes the residue audible rather than silent: one WARN at boot naming the stale key, its
# value and the version really in use, and never a refusal.
#
# Injected as Optional<String>, because a property spelled as the empty string arrives from an
# environment variable as present-and-empty and a bare String injection point with no default fails
# the whole deployment on the one value that means "off".
qits.ci.daemon-version-override=
qits.ci.daemon-binary-url-template=http://qits-platform-artifacts:8080/artifacts/daemons/qits-ci-daemon/{version}

# The qits CLI (also answers to qits-publish) — qits-platform-access-cli, the platform's own daemon
# package. THIS KEY NAMES ONLY THE PACKAGE. The version is not configuration at all: it is a pinned
# maven dependency of this repository (eu.wohlben.qits:qits-platform-access-cli-binary, the property
# qits.platform-access-cli-binary.version in the root pom), and CiDaemonLauncher carries that
# constant into every step container as $QITS_ARTIFACTS_CLI_VERSION.
#
# THAT IS THE WHOLE CHANGE, and the download address did not move: it was always
# GET /artifacts/daemons/<package>/<version>, the same wire shape qits-ci-daemon downloads from.
# What is gone is the RESOLUTION in front of it — the composed prelude used to read qits-artifacts'
# own daemons listing and take this package's "latestVersion" at every step start, so one CLI
# release was a shared, unversioned, unreviewed input to every composed release on the platform at
# once. On 2026-09-13 one bad CLI release broke all of them, with nothing changed in any consumer's
# tree and no line anybody could revert. A pin is a line, this repository's release request gates
# moving it, and a release step's image no longer needs jq for the CLI's sake.
#
# BLANK IS THE OFF STATE, not a hole: the launcher sends $QITS_ARTIFACTS_CLI_PACKAGE EMPTY, a
# composed release prelude skips the fetch, and a composed postlude that really needs the CLI fails
# on its own guard naming this key — a sentence about configuration rather than a curl error nobody
# can place. The version is sent regardless; it is a constant and there is nothing to switch off.
#
# The default and PlatformAccessCliBinary.DAEMON_NAME are one string, and the two cannot drift:
# ArtifactsCliPackageDefaultTest reads this file and that constant and compares them.
qits.ci.artifacts-cli-package=qits-platform-access-cli

# THERE IS NO qits.ci.daemon-autoadopt-enabled AND NO qits.ci.daemon-probe-image ANY MORE. The first
# switched whether this instance discovered and adopted qits-ci-daemon releases off SoftwareRelease
# at all — it had to be a key of its own because the startup discovery it guarded was a plain HTTP
# call to qits.events.url that qits.eventstream.enabled does not cover, and both suites set it false.
# The second named the image a candidate's probe container ran. Both keys, the listener, the probe
# and the ci_daemon_pin table are deleted; the reason is at the top of this block.
#
# The standing platform may still hold entries for either. They are read by nobody, and
# RetiredDaemonKeys WARNs once at boot for each one it finds, because a key that looks like it
# decides something and does not is what costs somebody an afternoon. Neither has a successor:
# unlike the version there is nothing an override could mean here, because there is nothing left to
# switch on or to point at.

# THE EMERGENCY DOOR OVER THE PIN, AND IT SHIPS EMPTY — which is to say absent, since SmallRye reads
# an empty property as an unset Optional. Leave it that way. The pin above is the mechanism; this is
# what an operator sets when a pinned CLI turns out to be broken and a release of qits-ci is not
# available fast enough. Set, it is the version EVERY release-phase step on this deployment
# downloads, whatever the pom says — a CLI nothing gated, which is the honest reading of an override
# and the reason it is not the ordinary path. Blank is read the same as unset.
qits.ci.artifacts-cli-version-override=

# Where the daemon dials, TOLD and never derived: the container receives this string verbatim as
# $QITS_CI_DAEMON_URL and parses nothing out of it. It is qits-ci's own route on the shared network
# at qits-ci's own port — NOT a gateway route, because one process per container with a lifetime of
# one step has no stable address worth configuring. The /ci segment is in the value because a
# @WebSocket path is a literal that does not follow quarkus.rest.path. Deployments not on qits-net
# override it (host-run docker wants ws://host.docker.internal:8080/ci/daemon).
qits.ci.container-daemon-url=ws://qits-ci:8080/ci/daemon

# The two lifecycle deadlines the host parks on, each covering a different thing so a hang is
# attributable: register covers the image pull plus the daemon download (a cold image on a slow link
# is the worst case), initialize covers the daemon's own shallow clone and checkout. Both are
# backstops — nothing about a healthy run waits anywhere near them — and neither is the step's
# timeout, which is qits.ci.step-timeout-seconds and enforced inside the container.
#
# 60 -> 180 BECAUSE THE BOOTSTRAP NOW RETRIES ITS FETCH. CiDaemonLauncher.BOOTSTRAP gives the daemon
# download 10 attempts 12 seconds apart — ~108 seconds against a refused connection, which is what
# qits-artifacts (update_order: stop-first, so a refusal window on every deploy) answers while it is
# being replaced. That in-container budget must FIT INSIDE this deadline, so the two numbers move
# together: a deployment that lowers this key below ~108s makes the retry pointless, because qits-ci
# gives up while the container is still trying and reports NEVER_STARTED anyway.
#
# THIS ONE KEY DRIVES TWO DEADLINES AND THAT IS DELIBERATE — both are "how long a container may take
# to become a daemon": CiDaemonStepRunner's register wait and CiDaemonLauncher.launchTimeout() (the
# `ensure` call to qits-containers, mostly an image pull). One number for one question; two keys
# would be two ways to disagree about it. It drove a THIRD until the pin ladder was retired — the
# probe container's own deadline — which is one fewer reader and no change to the number.
# CiDaemonLauncher.maxAgeSeconds sums it with the others, so the orchestrator's maxAge backstop
# follows on its own and needs no second edit.
#
# THE ACCEPTED COST: a binary url that is genuinely unfetchable — a botched publish, or an override
# naming a version nothing ever pushed — now takes about three minutes to fail instead of one. A
# slower verdict on a broken pin is worth not rejecting a release request over a one-minute redeploy.
qits.ci.daemon-register-timeout-seconds=180
qits.ci.daemon-init-timeout-seconds=120
