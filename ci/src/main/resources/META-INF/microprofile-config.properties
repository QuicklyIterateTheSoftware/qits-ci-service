# CI config defaults, shipped from this library jar (docs/epics/qits-ci/). Library jars ship
# defaults as META-INF/microprofile-config.properties (ordinal 100) — a jar's application.properties
# is ignored — read by whichever app pulls the jar in (the `artifacts`/`epics`/`auth/*` modules ship
# their config the same way). The consuming app / env overrides any of these.
#
# ci owns its OWN named datasource + persistence unit + Flyway lineage: its own postgres database,
# never sharing another context's DB or its migration history, so the split into a standalone
# service moved files, not data (the artifacts precedent). Because it is a separate physical DB,
# ci_run.repo_id is a plain String column with NO cross-boundary FK — a deleted repository simply
# leaves runs behind as dangling history. The suites point the same three keys at an embedded
# postgres (EmbeddedPgConfigSource, in this module's and the service module's test sources).
#
# THE THREE KEYS BELOW ARE THE PLATFORM'S GENERIC RESOURCE CONTRACT, read back by the jar that needs
# it. This repository declares `resources: postgresql:db` in .config/qits/deployments.yml;
# qits-platform-deployments creates the role and the database before the cutover and injects
# QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD into the container it starts. Nothing in the deployer
# is ci-specific — an application maps the generic variables in its own shipped defaults, and this
# file is where this context does it. The variable names follow the resource NAME, so renaming the
# resource in the spec stops matching this file: the name is `db`.
#
# THE TRIPLE HAS NO DEFAULTS AND THAT IS THE REFUSE-TO-BOOT STANCE. An unset variable leaves these
# expressions unresolvable, so the process dies at Flyway's migrate-at-start naming what is missing,
# rather than opening some fallback store nobody meant.
#
# That stance is what finally closes this context's oldest failure family, and both halves of it were
# the ${user.home} H2 file. AUTO_SERVER on that URL broke the native binary alone — org.h2.server.
# TcpServer is not in the image — with every JVM test green; and UID 1001 in the runtime image has no
# passwd entry, so ${user.home} resolved to `?` and the container refused to boot on a path. A
# default with no feature in it cannot lose one. What replaced it is a value a deployment supplies or
# does not, and CiPackagedSurfaceIT still puts the SHIPPED expression itself under test by handing
# the launched artifact the variables rather than the datasource keys.
quarkus.datasource.ci.db-kind=postgresql
quarkus.datasource.ci.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.ci.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.ci.password=${QITS_RESOURCE_DB_PASSWORD}

# THE POOL SURVIVES A POSTGRES CUTOVER, WHICH STOCK AGROAL DOES NOT. Replacing the tier's postgres
# severs every pooled connection; without validation the pool hands a dead one to the next caller
# long after the database is back, and 5s of acquisition is not enough for the successor to take the
# alias. Validate at borrow, and wait 15s before giving up.
#
# THREE LINES, AND ALL THREE OR NONE — the platform's datasource baseline, asserted by
# DatasourceBaselineTest and written down in docs/project-setup-quinoa-angular.md with the
# measurements behind it. PatientPgDriver (qits-db-core) delegates to org.postgresql.Driver and,
# when the database is not there, keeps asking for up to 14s rather than failing at once — SQLState
# 08* and 57P03 only, so a wrong password still fails on the first attempt. Its deadline sits UNDER
# the acquisition timeout, so a caller that outlasts it gets the database's real refusal instead of
# a generic pool message; and validate-on-borrow is what turns a dead pooled connection into the
# fresh creation attempt the driver makes patient. Each line does less than it reads as without the
# other two. The url stays a plain jdbc:postgresql: one, so the QITS_RESOURCE_DB_* contract above is
# untouched.
quarkus.datasource.ci.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.ci.jdbc.acquisition-timeout=15S
quarkus.datasource.ci.jdbc.validate-on-borrow=true

# A dedicated persistence unit bound to the ci datasource, owning only this module's entities
# (the default PU keeps qits' domain entities). packages assigns entity→PU unambiguously.
quarkus.hibernate-orm.ci.datasource=ci
quarkus.hibernate-orm.ci.packages=eu.wohlben.qits.ci.entity

# Own Flyway lineage at a distinct classpath location so it never mixes with the other lineage this
# application boots (the eventstream outbox's). ONE location and ONE V1: the move to postgres is a
# clean start, so the nine H2 migrations are history in this repository's log rather than a prefix of
# this lineage — see V1__init.sql's header.
#
# The SECOND location is gone with them. It named the java package holding
# V9__drop_generated_check_constraints, a migration that existed only to remove constraints H2 had
# named itself; a fresh schema simply does not create them. Nothing restates this list in a test
# resources file — a second copy is a copy that drifts.
#
# baseline-on-migrate is GONE with that lineage. It told Flyway to adopt a non-empty schema it had
# no history table for, which the H2 file needed while it was being adopted; every database this code
# now meets is empty or was created by this very lineage, and the flag would only mask the one case
# worth failing on — a schema somebody else put there.
quarkus.flyway.ci.migrate-at-start=true
quarkus.flyway.ci.locations=classpath:db/ci/migration

# Where the git host answers. ci reads a repository's pipeline config off this host's content
# endpoints — <base>/git/<repoId>/blob/<rev>/<path> and .../tree/<rev>[/<path>] — so it needs no
# clone, no local mirror and no git binary. ci appends /git/<repoId> itself, so this value stops at
# the SERVICE: `git` is the codebase's second-level segment for the git host and belongs in ci's
# code, whereas WHICH service hosts it is a deployment fact and belongs here. Do NOT include /git.
#
# THE HOST IS qits-githost NOW, and the value lost a path segment with the move. The git host used
# to live inside qits-artifacts and answer under that service's gateway segment, so the base was
# `http://<host>:<port>/artifacts` and a read landed on /artifacts/git/<repoId>. Standing alone it
# serves /git/** at the ROOT — GitHostRoutes' BASE is the literal `/git` and no config key moves it
# — so the base is scheme+host+port and nothing else, and a read lands on /git/<repoId>. A value
# that keeps the old segment 404s every read, which surfaces as "no pipeline" on every push rather
# than as an error: this is a cutover both services make in one step.
#
# THE ALIAS IS DERIVED FROM THE ENVIRONMENT AND IS NOT A CONFIGURATION DECISION. Every application on
# qits-net answers at `<environment>-<application>` unconditionally (qits-deployments'
# PdNetworks.alias — the bare spelling was the platform plane's and went with the plane), and
# qits-deployments injects QITS_ENVIRONMENT into EVERY container it starts. So this address is a
# SPELLING the process already holds both halves of, and an entry carrying it would be a second place
# for one fact to be wrong. The `dev` fallback is this estate's environment, which is what every other
# default in this file already assumes. The APPLICATION NAME is untouched — qits-githost, qualified,
# never renamed — and the generated deployment extras agree (qits-bootstrap's ComposeTemplate renders
# prod-qits-githost for ENV_NAME=prod).
qits.ci.git-host-url=http://${QITS_ENVIRONMENT:dev}-qits-githost:8080

# THERE IS NO qits.ci.container-git-url ANY MORE (qits-515). It named the git host as a step
# container on qits-net reached it. A step clones from the git host's PUBLIC name,
# https://githost.qits.<QITS_DOMAIN>, which qits-ci composes (runnerhost/StepAddressPlane); the key
# above is only where qits-ci itself reads pipeline config.

# WHERE qits-projects ANSWERS, and there is DELIBERATELY NO DEFAULT — the key is a kill switch.
# It is the platform's repository catalogue: GET <base>/projects/api/repositories answers
# {"repositories":[{"id","projectId","name","mainBranch"}]}, which is the candidate list the trigger
# engine evaluates an arriving event against, and the only place the public (projectId, name) pair a
# clone URL is built from can be read. Unset, ci falls back to the git host's own GET /git listing of
# storage ids, which is exactly what it did before this key existed — so a pre-cutover platform keeps
# triggering and a clone-alone build of this repository needs no qits-projects at all. After the
# identity cutover that fallback answers nothing (the id-addressed scheme is qits-projects' own), so
# a deployment that wants event triggers sets this:
#
#   qits.ci.projects-url=http://${QITS_ENVIRONMENT:dev}-qits-projects:8080
#
# The example spells the derived alias so that a person copying it copies an address that RESOLVES:
# qits-projects answers on qits-net at `<environment>-qits-projects` like every other application, and
# a bare `qits-projects` resolves nowhere. THE KEY STILL SHIPS NO DEFAULT — it is the kill switch, and
# giving it one here would turn "unset means fall back to the git host's own listing" into "every
# deployment talks to qits-projects whether it has one or not". Only the prose moved.
#
# It cannot be derived from qits.ci.git-host-url the way the listing url used to be: that is a
# different service at a different address, not a second path under one ci already holds.

# qits.ci.container-git-audience is read by nothing either: a step's git helper presents the run's
# ci-run token and asks the idp for nothing, so there is no audience to name. A leftover
# QITS_CI_CONTAINER_GIT_AUDIENCE deployment entry changes nothing and shows as orphaned in
# qits-configuration.

# Step containers: the default per-step timeout, and the bounded tail-truncated combined output
# kept per step.
#
# THERE IS NO qits.ci.network ANY MORE (qits-515). It named the docker network a step container
# joined. A step joins none: it runs on a runner outside the swarm and reaches every service by its
# public name, so the workload spec carries no network and no extra host.
#
# THERE IS NO qits.ci.container-runtime EITHER. It named the docker-compatible CLI this process
# shelled out to, and this process shells out to nothing: a step container is started by the runner
# that holds its run, with the runner host's own docker.
#
# step-timeout-seconds is the DEFAULT deadline, not the only one: 30 minutes, which is what a step
# that declares none gets. A per-step `timeout-seconds:` in a `.config/qits/ci-*.yml` overrides it.
# It is enforced INSIDE the container by the step's own daemon, which signals its child and reports
# the timeout as a timeout rather than as a suspicious exit code. A step that hits the deadline is
# aborted and recorded TIMED_OUT, and so is its run — a deadline is not a pipeline verdict.
#
# The grace is how much longer the host waits before concluding the daemon is not going to answer at
# all. It sits behind the in-container deadline on purpose — the daemon enforcing its own child is
# the normal path and this backstop should never fire — and it has to cover the daemon's SIGTERM,
# its 5s grace, the SIGKILL, and one frame's flight. When it does fire the host sends a Cancel and
# then removes the container, and the step is recorded timed out.
#
# output-max-chars bounds BOTH the live relay and the persisted tail — one budget, applied as text
# arrives rather than to an assembled string. A step's output is repo-controlled and unbounded, so
# this is a security property, not a display preference.
#
# THERE IS NO qits.ci.concurrent-builds, qits.ci.queue-poll-interval NOR
# qits.ci.in-process-executor.enabled ANY MORE (qits-506). They sized, paced and switched this
# process's own claim loops, and the loops are deleted: every run is executed by
# a runner, the platform host's included, so how many runs execute at once is the connected runners'
# slots and a QUEUED row waits for a runner's Reserve rather than a local wake.
qits.ci.step-timeout-seconds=1800
qits.ci.step-timeout-grace-seconds=60
qits.ci.output-max-chars=65536

# How long POST /ci/api/events/trigger keeps asking repositories. That call evaluates on the request
# thread — a caller-supplied event is redeliverable by nobody, so it may not be handed to a queue —
# and each candidate costs one read of the git host. The deadline is what stops an unanswering host
# from holding the caller for candidates times that read timeout; the repositories not asked come
# back in the answer as skipped, so the caller sees a partial answer as partial.
qits.ci.trigger-deadline-seconds=60

# THE OWED-EVENT LEDGER'S TWO KEYS. An event accepted off the bus is recorded in ci_owed_event before
# the acceptance is reported, and the row is deleted when the evaluation returns — so the table is
# empty in a healthy process and a row in it is an event some process accepted and never evaluated.
# Two sweeps clear it: one at boot, which takes everything (the deployment is stop-first, so a row at
# boot belongs to a process that is gone), and this schedule, which takes what has been sitting for
# longer than the grace. See V13__owed_trigger_event.sql for the cutover it was measured on.
#
# The grace is generous because picking up an evaluation that is still running costs a duplicate
# git-host fan-out and nothing else — ci_run's unique (trigger_event_id, repo_id, config_path)
# refuses the second run — while a value below a slow fan-out would make that the normal case.
qits.ci.trigger-owed-sweep-interval=1m
qits.ci.trigger-owed-grace=5m

# The PLATFORM pipelines: event pipelines packaged into qits-ci from this repository's own
# `.config/qits/platform-pipelines/` (CiPlatformPipelines), evaluated for every arriving event and
# recording their run against the repository the event's payload names. They used to be read from
# the wrapper's `ci-platform-event-*.yml`; `qits.ci.platform-pipelines-repository` is retired and
# only logged as ignored. False turns the feature off.
qits.ci.platform-pipelines.enabled=true

# A step's script is REPO-CONTROLLED code, so the container is a hostile-code sandbox: privileges
# are dropped (capDropAll, noNewPrivileges), no docker socket is mounted unless the step declared
# `docker: true`, and these caps bound what one step can consume. They travel in the workload spec
# qits-ci sends with a runner's Launch and the runner applies them; the values are still qits-ci's to choose, because
# what a BUILD may consume is this service's policy. See
# docs/issues/2026-07-26_ci-executes-repo-controlled-code-from-unauthenticated-pushes.md.
#
# memory-limit is sent as memory AND memory-swap, and it is the PLATFORM DEFAULT rather than the only
# value: a runner's row may carry its own `stepMemoryLimit` (V26, `PATCH /ci/api/runners/{id}`), which
# replaces it for the steps that runner holds, read at each launch. A runner whose row names none —
# the platform host's own `localhost` runner among them — caps its steps here, so the number is sized
# for the swarm host it shares with every platform service, not for a runner machine with RAM to
# spare.
qits.ci.memory-limit=4g
# 4096, raised from 2048 on 2026-08-29: qits-workspaces' full `mvn verify` — maven + a Quarkus
# surefire JVM's several hundred threads + zonky postgres backends per database + a git subprocess
# per TestOrigin push — hit the ceiling reproducibly (`cannot fork() for pack-objects: Resource
# temporarily unavailable`, twice, same tests). Threads count against --pids-limit like processes
# do. Still a bound, and deliberately not more: a fork bomb from repo-controlled code stays
# contained, which is this line's whole reason to exist (see the doc above).
qits.ci.pids-limit=4096
qits.ci.cpus=2

# THERE IS NO qits.ci.docker-socket-path ANY MORE. It named where the host's docker daemon listens,
# for the ONE thing a pipeline can ask for: a step declaring `docker: true`. That step still gets the
# socket and it is still opt-in per step and visible in the repository's config diff — the spec
# carries a `hostDockerSocket` flag and the runner, which is the process that actually holds a
# socket, knows where its daemon listens. A rootless daemon under $XDG_RUNTIME_DIR or a
# socket-activated proxy is a deployment fact of the RUNNER's host, configured once there.
#
# Such a step is still ROOT-EQUIVALENT ON THE HOST: the socket is the daemon and the daemon is root,
# so the step can mount host paths and start privileged containers regardless of the cap-drop flags,
# which fence its own process tree and not what the daemon does on its behalf. Accepted for the POC
# under the standing posture (sources are trusted). Every step that does not declare the flag keeps
# exactly the sandbox above — and qits-ci itself now holds no socket at all.

# THERE IS NO qits.ci.containers.* ANY MORE (qits-506): owner, boot-reap-patience and
# launch-patience were this process's terms with qits-containers, which it no longer calls. A runner
# starts and removes every step container; its own boot sweep is what removes a previous life's.

# qits-artifacts' registry coordinates, as this service names them.
#
# registry-host is the host a run's PINNED step image is addressed under: CiRunService builds the
# pinned reference with it and HttpImagePins recognises a platform image by it. It is not handed to
# a step. A step reads $QITS_REGISTRY and $QITS_BUILD_REGISTRY, which are both the registry's public
# name, registry.qits.<QITS_DOMAIN> (runnerhost/StepAddressPlane), and its runner pulls the pinned
# image from that public name too: a reference naming this host has its host moved, path, tag and
# digest kept.
#
# image-repository is the platform's image namespace, injected into EVERY step container as
# $QITS_IMAGE_REPOSITORY. With $QITS_REGISTRY and $QITS_CI_SHA it spells the tag convention
#   <registry>/<repository>/<application>:<sha>
#
# RECEIVER-NAMED, not qits.ci.*: these are qits-artifacts' own coordinates.
qits.artifacts.registry-host=${QITS_ENVIRONMENT:dev}-qits-artifacts:8080
qits.artifacts.image-repository=qits

# THERE IS NO qits.ci.docker-auth-hosts, qits.ci.buildkit.enabled NOR qits.ci.buildkit.registry-host
# ANY MORE (qits-515). The first listed the registry hosts a publishing step's docker config.json
# carried a login for; the third was the registry as a builder on qits-net resolved it; the second
# switched $BUILDKIT_HOST and $QITS_BUILD_REGISTRY to empty. A build step's document names the
# registry's and the mirror's public hosts, which are composed from QITS_DOMAIN, and the builder is
# the runner's own: it fills $BUILDKIT_HOST in, and this service sends no value for it.

# --- the credential a step pushes with ------------------------------------------------------------
# IT IS COMMISSIONED PER RUN, and there is no key naming it. qits.ci.registry-auth.client-id and
# qits.ci.registry-auth.client-secret are GONE: they were one static pair, shared by every run of
# every repository, living in a deployment's environment for as long as the deployment did. A
# deployment still setting them is setting nothing.
#
# What replaced them: at the first step of a run, qits-ci POSTs
# {"contextKind":"ci-run","contextId":"<runId>"} to
# <quarkus.oidc-client.qits.auth-server-url>/api/tokens with HTTP Basic of its OWN oidc client
# (`qits`, service-client-identity-plan.md C4), and qits-idp answers a ci-run TOKEN, an opaque
# qits_tok_ value. Every later step of that run reuses it; the run's close deletes it. The ADDRESS
# and the CALLER are both derived from the oidc-client block and there is nothing to configure here.
# It is a token and never a client: the per-run commissioned client a step on qits-net exchanged for
# bearers was deleted with that plane (qits-515).
#
# WITH quarkus.oidc-client.qits.client-enabled OFF (the shipped posture, and every test's) there is
# nothing to commission with, and NO STEP IS LAUNCHED: the token is the step's only credential, so
# RunnerStepRunner records LAUNCH_FAILED naming the key rather than starting a container that can
# reach nothing.
#
# WHAT IT REACHES. Every step gets the token as $QITS_TOKEN (and $QITS_TOKEN_SUBJECT,
# $QITS_MAVEN_AUTH_USR/_PSW, $QITS_PUBLISH_TOKEN_COMMAND, $GIT_CONFIG_GLOBAL). A step in build mode
# (`docker: true` or `build: true`) also gets $DOCKER_CONFIG pointing at a directory the bootstrap
# writes {"auths":{"<public registry host>":{"auth":"<base64 token:qits_tok_…>"}}} into — under
# /tmp, never in the checkout, so it can never land in a build context. A step that is not a build
# gets that document for its own image pull only, and no $DOCKER_CONFIG.
#
# The base64 is the docker CLI's own encoding and is not encryption: the credential is as protected
# as the environment of a container running repo-authored code, which is to say it is readable by
# the step. What the per-run credential bounds is the BLAST RADIUS: this run, and no other.

# How long a commission holds through an idp that cannot answer yet. The classification is the launch
# patience's: nothing answered, a 5xx and a 401 are about the moment (an idp cutover answers 401 to a
# credential that was valid a minute ago), a 403 and a 400 are about the request and stand at once.
# Thirty seconds, ~5s between attempts. Past it the STEP fails naming the commission call, which is
# deliberate: launching credential-less would turn an idp blip into a push 401 minutes later, inside
# somebody's build, with nothing in the record naming the cause.
qits.ci.commission.patience=PT30S

# How often the leftovers are swept. A token is deleted when its run closes, so what this
# collects is the run this process died holding — one per process death — plus any DELETE that did
# not land. It lists this owner's live tokens at qits-idp and deletes every ci-run token whose
# contextId is not a QUEUED or RUNNING run, and a runner's client or registration token its row no
# longer names. Hourly because nothing changes faster than that; the
# boot pass is what makes a restart's leftovers a minute's problem rather than an hour's.
qits.ci.commission.reconcile-interval=1h

# THE ADDRESSES A STEP IS TOLD ARE NOT KEYS ANY MORE (qits-515). qits.artifacts.npm.hosted-url,
# qits.artifacts.docs.url, qits.mirror.maven-central.build-url, qits.mirror.maven-central.step-url
# and qits.ci.workspaces-url each spelled a qits-net alias for a step container to dial, and are
# deleted. A step is told the PUBLIC name of each service, composed from QITS_DOMAIN by
# runnerhost/StepAddressPlane, with the service's own path — and is told the domain itself, bare, as
# $QITS_DOMAIN (qits-731). Hosts are code: a recipe derives registry.qits.$QITS_DOMAIN and
# mirror.qits.$QITS_DOMAIN and the constant paths below from that one value, and the URL variables
# beside it are the same addresses, kept only while a recipe read at some repository's main still
# names them:
#
#   $QITS_DOMAIN                    <domain>
#   $QITS_NPM_REGISTRY_URL          https://registry.qits.<domain>/artifacts/npm/npm/
#   $QITS_NPM_PROXY_URL             https://mirror.qits.<domain>/npm/npmjs/
#   $QITS_MAVEN_REGISTRY_URL        https://registry.qits.<domain>/artifacts/maven/maven
#   $QITS_MAVEN_CENTRAL_MIRROR_URL  https://mirror.qits.<domain>/mirror/maven/central
#   $QITS_MAVEN_PROXY_URL           https://mirror.qits.<domain>/mirror/maven/central
#   $QITS_DOCS_URL                  https://registry.qits.<domain>/artifacts/docs/docs
#   $QITS_ARTIFACTS_URL             https://registry.qits.<domain>
#   $QITS_WORKSPACES_URL            https://workspaces.qits.<domain>
#
# The two keys below stay because qits-ci ITSELF reads them, from inside the swarm.

# qits-artifacts' hosted Maven repository AS QITS-CI REACHES IT. HttpImagePins takes this value's
# scheme and authority as the origin it asks the registry for an image digest at (HEAD
# <origin>/v2/<name>/manifests/<tag>) when qits.artifacts.url is blank. It is set on every live
# deployment. It is not handed to a step.
#
# The alias is derived like every other on-network address here: the store answers on qits-net at
# `<environment>-qits-artifacts`.
qits.artifacts.maven.registry-url=http://${QITS_ENVIRONMENT:dev}-qits-artifacts:8080/artifacts/maven/maven

# qits-artifacts' ROOT AS QITS-CI REACHES IT — scheme and authority, no path. BLANK IS THE DEFAULT,
# and an explicit value wins: HttpImagePins asks the registry at it, and derives the origin of
# qits.artifacts.maven.registry-url above when it is blank. It is not handed to a step.
qits.artifacts.url=

# Whether a step is told the Maven Central pull-through at all. The settings profile in every
# .qits-maven-settings.xml activates only on a NON-EMPTY QITS_MAVEN_CENTRAL_URL (measured Maven 3.9:
# an empty value does not activate a property-presence profile), so enabled=false injects
# $QITS_MAVEN_CENTRAL_MIRROR_URL and $QITS_MAVEN_PROXY_URL empty and every build resolves Central
# directly — the bootstrap lever for a platform whose mirror is not up yet.
qits.mirror.maven-central.enabled=true

# --- the ci-daemon (eu.wohlben.qits.ci.daemonhost, in the service module) ------------------------
# A step container no longer runs a script under `docker run`: it runs qits-ci-daemon, which dials
# BACK to qits-ci over a websocket and receives the step as the reply to its own "initialized". The
# keys below are that arrangement's whole configuration. They are shipped from this jar with the
# other qits.ci.* defaults even though the code reading them lives in `service` (and, for the pin
# itself, in `ci/control/CiDaemonPins`) — a deployment sets qits.ci.* in one place and does not care
# which module reads which.
#
# THE VERSION IS NOT A KEY ANY MORE — IT IS THE POM. It comes from the pinned dependency
# eu.wohlben.qits:qits-ci-daemon-protocol, whose CiDaemonBinary.VERSION is the version of the
# qits-ci-daemon binary the same release published. So the wire contract both sides speak and the
# binary one side downloads are one artifact, bumping one is bumping the other, and the pair cannot
# be mismatched by a deployment act. What gates a bump is this repository's own release request,
# which runs that binary at that version against this host before the merge.
#
# WHAT THAT REPLACED, because every retired key below is part of it: qits.ci.daemon-version was the
# deployment's pin, and on top of it sat a LADDER — a durable table of candidate versions
# (ci_daemon_pin, dropped in V18) adopted straight off SoftwareRelease frames by a bus listener,
# each probed by launching a throwaway container running whatever had just been published and kept
# if the container dialled back. An adopted rung outranked the configured pin, so a daemon release
# reached every CI step container on the platform without qits-ci's own tests ever having run
# against it, and the only gate on a protocol break was a probe the released service ran on itself,
# in production, against its own host.
#
# THE VERSION AND THE URL STILL MOVE TOGETHER. The version is resolved once per run
# (CiDaemonPins.answer) and the binary's path is composed from it —
# /artifacts/daemons/qits-ci-daemon/<version>, qits-artifacts' version-addressed daemon route — so
# a deploy landing mid-run cannot make step 3 speak a different protocol than step 1. A step
# downloads it from the registry's public name, https://registry.qits.<QITS_DOMAIN>, presenting
# the run's token.
#
# THERE IS NO qits.ci.daemon-binary-url-template ANY MORE (qits-515). It spelled the store's qits-net
# alias around that path for a step on qits-net to download from; the path is the store's own route
# and the origin is composed from QITS_DOMAIN, so nothing of it was left to configure.
#
# A version is a calver like `2026.803.91607`. A PUT of an existing version is 409 inside
# qits-artifacts' publish transaction, so a version can never come to mean different bytes.
#
# --- THE EMERGENCY HATCH, AND WHY IT IS SPELLED `-override` -------------------------------------
# Blank, and it is expected to STAY blank. Set, it runs a daemon binary that no release request of
# this repository has ever run against this host, which is the honest reading of an override and the
# reason it is not called a pin. CiDaemonPins.answer() prefers it over the dependency's version and
# reports source "override" on GET /ci/api/daemon so the deviation is visible without asking a
# deployment what it holds.
#
# THE NAME IS THE POINT, AND THE REASON IS SPECIFIC. The key it replaces is `qits.ci.daemon-version`,
# and the standing platform still holds an entry for it — env.QITS_CI_DAEMON_VERSION, a sha256 digest
# written by qits-bootstrap. NOTHING ON THIS PLATFORM DELETES A CONFIGURATION ENTRY: qits-configuration
# reports an orphan and never cleans it up, and DELETE …/entries/{key} is {qits:admin, qits:system},
# which an agent credential is not. So "retire the key" could not mean "remove the value"; it had to
# mean STOP READING THAT NAME, and a rename is the only move that does that with no deletion required
# and no window in which the residue still decides. It buys a second thing on its own merits: this
# name has never been written by any automation, so a value found in it was put there by a person on
# purpose — which is exactly what an override should be able to say about itself. `RetiredDaemonKeys`
# is what makes the residue audible rather than silent: one WARN at boot naming the stale key, its
# value and the version really in use, and never a refusal.
#
# Injected as Optional<String>, because a property spelled as the empty string arrives from an
# environment variable as present-and-empty and a bare String injection point with no default fails
# the whole deployment on the one value that means "off".
qits.ci.daemon-version-override=

# The qits CLI (also answers to qits-publish) — qits-platform-access-cli, the platform's own daemon
# package. THIS KEY NAMES ONLY THE PACKAGE. The version is not configuration at all: it is a pinned
# maven dependency of this repository (eu.wohlben.qits:qits-platform-access-cli-binary, the property
# qits.platform-access-cli-binary.version in the root pom), and StepContainerSettings carries that
# constant into every step container as $QITS_ARTIFACTS_CLI_VERSION.
#
# THAT IS THE WHOLE CHANGE, and the download address did not move: it was always
# GET /artifacts/daemons/<package>/<version>, the same wire shape qits-ci-daemon downloads from.
# What is gone is the RESOLUTION in front of it — the composed prelude used to read qits-artifacts'
# own daemons listing and take this package's "latestVersion" at every step start, so one CLI
# release was a shared, unversioned, unreviewed input to every composed release on the platform at
# once. On 2026-09-13 one bad CLI release broke all of them, with nothing changed in any consumer's
# tree and no line anybody could revert. A pin is a line, this repository's release request gates
# moving it, and a release step's image no longer needs jq for the CLI's sake.
#
# BLANK IS THE OFF STATE, not a hole: the launcher sends $QITS_ARTIFACTS_CLI_PACKAGE EMPTY, a
# composed release prelude skips the fetch, and a composed postlude that really needs the CLI fails
# on its own guard naming this key — a sentence about configuration rather than a curl error nobody
# can place. The version is sent regardless; it is a constant and there is nothing to switch off.
#
# The default and PlatformAccessCliBinary.DAEMON_NAME are one string, and the two cannot drift:
# ArtifactsCliPackageDefaultTest reads this file and that constant and compares them.
qits.ci.artifacts-cli-package=qits-platform-access-cli

# THERE IS NO qits.ci.daemon-autoadopt-enabled AND NO qits.ci.daemon-probe-image ANY MORE. The first
# switched whether this instance discovered and adopted qits-ci-daemon releases off SoftwareRelease
# at all — it had to be a key of its own because the startup discovery it guarded was a plain HTTP
# call to qits.events.url that qits.eventstream.enabled does not cover, and both suites set it false.
# The second named the image a candidate's probe container ran. Both keys, the listener, the probe
# and the ci_daemon_pin table are deleted; the reason is at the top of this block.
#
# The standing platform may still hold entries for either. They are read by nobody, and
# RetiredDaemonKeys WARNs once at boot for each one it finds, because a key that looks like it
# decides something and does not is what costs somebody an afternoon. Neither has a successor:
# unlike the version there is nothing an override could mean here, because there is nothing left to
# switch on or to point at.

# THE EMERGENCY DOOR OVER THE PIN, AND IT SHIPS EMPTY — which is to say absent, since SmallRye reads
# an empty property as an unset Optional. Leave it that way. The pin above is the mechanism; this is
# what an operator sets when a pinned CLI turns out to be broken and a release of qits-ci is not
# available fast enough. Set, it is the version EVERY release-phase step on this deployment
# downloads, whatever the pom says — a CLI nothing gated, which is the honest reading of an override
# and the reason it is not the ordinary path. Blank is read the same as unset.
qits.ci.artifacts-cli-version-override=

# THERE IS NO qits.ci.container-daemon-url ANY MORE (qits-515). It was where a step's daemon on
# qits-net dialled back. The container still receives $QITS_CI_DAEMON_URL verbatim and parses
# nothing out of it; the value is wss://ci.qits.<QITS_DOMAIN>/ci/daemon, composed by
# runnerhost/StepAddressPlane. The /ci segment is in it because a @WebSocket path is a literal that
# does not follow quarkus.rest.path.

# The two lifecycle deadlines the host parks on, each covering a different thing so a hang is
# attributable: register covers the image pull plus the daemon download (a cold image on a slow link
# is the worst case), initialize covers the daemon's own shallow clone and checkout. Both are
# backstops — nothing about a healthy run waits anywhere near them — and neither is the step's
# timeout, which is qits.ci.step-timeout-seconds and enforced inside the container.
#
# 60 -> 180 BECAUSE THE BOOTSTRAP NOW RETRIES ITS FETCH. StepContainerSettings.BOOTSTRAP gives the daemon
# download 10 attempts 12 seconds apart — ~108 seconds against a refused connection, which is what
# qits-artifacts (update_order: stop-first, so a refusal window on every deploy) answers while it is
# being replaced. That in-container budget must FIT INSIDE this deadline, so the two numbers move
# together: a deployment that lowers this key below ~108s makes the retry pointless, because qits-ci
# gives up while the container is still trying and reports NEVER_STARTED anyway.
#
# It is RunnerStepRunner's register wait: how long a container the runner reported Launched may take
# to become a daemon. It also drove the in-process executor's launch call and the orchestrator's
# maxAge backstop until that executor was deleted (qits-506); a runner's Launch answer has its own
# deadline, qits.ci.runner.launch-timeout-seconds.
#
# THE ACCEPTED COST: a binary url that is genuinely unfetchable — a botched publish, or an override
# naming a version nothing ever pushed — now takes about three minutes to fail instead of one. A
# slower verdict on a broken pin is worth not rejecting a release request over a one-minute redeploy.
qits.ci.daemon-register-timeout-seconds=180
qits.ci.daemon-init-timeout-seconds=120

# A RUNNER'S QUARANTINE (qits-466). A step of a runner's run that ended LAUNCH_FAILED, NEVER_STARTED or
# CONNECTION_LOST failed through the runner's fault, before or outside its build script; a streak of
# `failures` of them spanning at least `min-runs` distinct runs takes the runner out of service (0
# effective slots) until a health check passes or an operator greenlights it. A step that started
# resets the streak. The two keys are one rule: the count says "this keeps happening", the distinct
# runs say "and not because one recipe names an image nobody published", which fails LAUNCH_FAILED on
# every attempt and is that recipe's fault rather than the machine's. See CiRunnerHealth.
qits.ci.runner.quarantine.failures=3
qits.ci.runner.quarantine.min-runs=2
# ONE DISCONNECT IS ONE FAILURE (qits-748). A runner's socket and every step daemon's socket cross the
# platform edge, so one edge redeploy ends every run the runner holds CONNECTION_LOST in the same few
# milliseconds — six of them on a 6-slot runner, which crossed the two keys above from one blip. A
# CONNECTION_LOST within this window of the runner's previous COUNTED one is the same disconnect: it
# adds neither a failure nor its run to the streak. The window is anchored at the counted loss (a
# collapsed one does not move it), so a disconnect storm counts once per window. Every other infra
# outcome still counts per step. Two minutes covers a burst of losses and the runner/daemon reconnect
# graces (60s each) behind them.
qits.ci.runner.quarantine.loss-window=PT2M

# A RUNNER'S HEALTH CHECK: a pseudo-build that exercises exactly the path a runner can break — the
# image pull through the registry, the daemon download, the dial back through the edge, the clone
# through githost with the run's credential — and runs `echo hello world`. Its repository is resolved
# against the candidate catalogue by name (then by storage id), its `main` head is what it clones, and
# its image is pinned to a digest at accept like any build's; ci-base because it is the platform's own
# smallest step image and this service's own recipes already depend on it being published.
qits.ci.runner.healthcheck.repository=qits-ci-service
qits.ci.runner.healthcheck.image=qits/build-images/ci-base:latest
# A check its runner has not taken by then is settled FAILED ("runner not connected") — a runner that
# never came back must not keep a pending check, which would hold off the next one forever.
qits.ci.runner.healthcheck.queue-timeout=PT30M
# WHEN a quarantined, connected runner with no check pending is asked again (qits-748, the owner's
# request — it replaced a flat hourly interval, which left a runner quarantined by a blip idle for up to
# an hour). Offsets from the quarantine, the runner's SLOTS: a first check at 1 minute — most
# quarantines are a momentary blip, and this reinstates the runner almost every time — then two 15
# minutes apart, then three 30 minutes apart, then (after the last offset) one every hour: +240m,
# +300m, … for as long as it stays out. A check is due at the first slot after the newest check
# accepted since the quarantine, so a runner disconnected at its slot gets one check on the first sweep
# after it comes back and then waits for its next slot — not a backlog of the ones it missed. A new
# quarantine starts the schedule over.
qits.ci.runner.healthcheck.schedule=PT1M,PT15M,PT30M,PT60M,PT90M,PT120M,PT180M
# How often the schedule looks — the two durations above are what it looks for, so this is only the
# resolution they are honoured at.
qits.ci.runner.healthcheck.sweep-interval=1m
