# cli — the release cycle of a Java CLI that people run and nothing deploys. One repository today:
# qits-bootstrap-cli.
#
# ---------------------------------------------------------------------------------------------
# WHAT A REPOSITORY DECLARES
#
#     # .config/qits/release.yml
#     archetype: cli
#
# One line, plus `contracts:` when the CLI holds consumer pacts. No `artifacts:` and no `userflows:`:
# this repository ships a program a person runs, and it declares no `deployments.yml` because there
# is no application for a deployer to move.
#
# Phase two (Publish) exists for one reason only: the contracts (qits-1149). The platform publishes a
# repository's contract packages — its consumer pacts — from the release slot's last step, so the
# archetype declares a release slot whose one step builds nothing. See java-service.yml's header for
# the full three-phase model.
#
# ---------------------------------------------------------------------------------------------
# WHY THERE IS A GATE AT ALL
#
# A release request releases on exactly one thing: a `BuildSuccessful` for its current fold —
# the phase-one gate, which delays rather than fails: it holds the release where it is until a
# verdict lands. NO VERDICT IS NOT A PASS. Without this recipe the repository cannot release at all —
# qits-bootstrap-cli was the last of the 48 with no `.config/qits` of any kind, for exactly that
# reason.
#
# THIS IS AN INTERIM GATE AND THE FILE SAYS SO. It is unit tests only. The real proof of a bootstrap
# CLI is a cold bootstrap on a fresh node, and the phases that shell docker are deliberately not
# unit-tested — a fake docker daemon would only prove the fake works. The pipeline that would cover
# it needs a disposable machine with a docker daemon, which no step container is, and building that
# is a campaign of its own. Do not read a green run here as "the bootstrap works".
#
# ---------------------------------------------------------------------------------------------
# WHAT IS DELIBERATELY ABSENT FROM THE COMMAND
#
# `verify` IS the unit suite here, not a wider phase: there are no `*IT.java`, the failsafe plugin is
# declared with no executions bound, and `./mvnw clean verify` green on a clone with no docker is the
# repository's own documented contract. The gate runs the command the repository already holds itself
# to rather than inventing a second one — so no `-DskipITs`, no `-Dit.test`, no `-Dquarkus.quinoa`.
#
# `QITS_MAVEN_REPOSITORY_URL` IS EXPORTED, as maven-library's QA step does: a CLI's contract tests
# read its providers' golden masters jars, which only the platform registry serves (qits-1149). A pom
# with no qits dependency never dials it.
#
# ---------------------------------------------------------------------------------------------
# WHEN TO OVERRIDE
#
# A CLI that grows a published artifact stops being this archetype: it declares `artifacts:` and a
# `release:` slot that builds it, or moves to `daemon` if what it ships is a static binary the platform
# downloads. A CLI whose suite needs a wider phase declares its own `release-request:` — declaring
# the slot replaces this one entirely.

release-request:

  - image: qits/build-images/maven-base:latest
    # The image's non-root build user (uid 1001, with a passwd entry). Nothing here spawns a
    # postgres or an initdb — the usual reason a sibling needs it — and the suite writes only into
    # the checkout and /tmp, both of which that user owns. It is chosen at launch and not switched
    # to inside the script: a step container starts `--cap-drop=ALL`, so without CAP_SETUID and
    # CAP_SETGID `su` cannot switch user at all.
    user: build
    timeout-seconds: 1800
    script: |
      # Maven Central through the platform mirror's public name, and the platform registry — code
      # under the platform's public domain (qits-731), which the composed prelude has already
      # demanded. The registry is what the contract tests read: a provider's golden masters jar
      # (qits-1149) is served by the platform's Maven alone. Exported because
      # .qits-maven-settings.xml reads both as ${env.QITS_MAVEN_CENTRAL_URL} and
      # ${env.QITS_MAVEN_REPOSITORY_URL}; passed as a property too, for a pom that declares the
      # `qits-maven` repository by ${qits.maven.repository.url}. A pom with no qits dependency
      # never dials it.
      qits_domain=${QITS_DOMAIN:?this step was told no QITS_DOMAIN}
      export QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central"
      export QITS_MAVEN_REPOSITORY_URL="https://registry.qits.$qits_domain/artifacts/maven/maven"

      # THE COVERAGE AGENT (qits-754) — java-service.yml's QA verify block, byte for byte; read the
      # rationale there. In short: JaCoCo's runtime agent writes `.qits-reports/jacoco.exec` for the
      # composed report hook; it rides JAVA_TOOL_OPTIONS rather than `-DargLine`, because a pom
      # with a literal surefire `<argLine>` silently drops an agent added through the property;
      # `env` scopes it to this one mvnw; a failed fetch is one line and a verify without
      # coverage, never a red step; and `inclnolocationclasses` with `classdumpdir` let it measure
      # what a @QuarkusTest runs (qits-1171).
      jacoco_version=0.8.14
      jacoco_agent=/tmp/qits-jacoco/org.jacoco.agent-$jacoco_version-runtime.jar
      jacoco_url="$QITS_MAVEN_CENTRAL_URL/org/jacoco/org.jacoco.agent/$jacoco_version/org.jacoco.agent-$jacoco_version-runtime.jar"
      set --
      if [ -n "${QITS_TOKEN:-}" ]; then
        set -- "Authorization: Bearer $QITS_TOKEN"
      fi
      jacoco_options=""
      mkdir -p /tmp/qits-jacoco .qits-reports/pact-verification
      if curl -fsSL --retry 2 ${1:+-H} "$@" -o "$jacoco_agent" "$jacoco_url" 2>/dev/null \
        || wget -q ${1:+--header} "$@" -O "$jacoco_agent" "$jacoco_url" 2>/dev/null; then
        jacoco_options="-javaagent:$jacoco_agent=destfile=$PWD/.qits-reports/jacoco.exec,append=true,includes=eu.wohlben.*,inclnolocationclasses=true,classdumpdir=$PWD/.qits-reports/jacoco-classes"
      else
        echo "coverage: could not fetch the JaCoCo $jacoco_version agent; this verify runs without coverage"
      fi

      # THE PACT VERIFICATION REPORT (qits-759). A system property, inert in every JVM this verify
      # starts that is not a Pact-JVM provider verifier — nothing here checks which JVMs those are,
      # because the property costs nothing in any other. It exists because of WHERE the knowledge
      # lives: the pacts a provider verifies are resolved from pinned consumer jars on its OWN test
      # classpath, so only the verifying JVM itself ever learns which ones, and that is the one fact
      # qits-ci cannot read from outside. Pact-JVM's provider verifier writes
      # `.qits-reports/pact-verification/*.json` when it sees these two properties and reads neither
      # any other way; the CLI's `contracts` report kind is what reads that directory back after the
      # step ends.
      #
      # SET WHETHER OR NOT THE COVERAGE AGENT'S FETCH ABOVE SUCCEEDED: it must not sit inside that
      # `if`/`else`, so it is composed as its own always-set part and JAVA_TOOL_OPTIONS below is
      # built from both parts rather than from one living inside the other's branch.
      pact_options="-Dpact.verification.reports=json -Dpact.verification.reportDir=$PWD/.qits-reports/pact-verification"

      env "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:+$JAVA_TOOL_OPTIONS }${jacoco_options:+$jacoco_options }$pact_options" \
        ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL"

# THE RELEASE SLOT, FOR THE CONTRACTS ONLY (qits-1149). A CLI ships no artifact, but it may declare
# `contracts:` — its consumer pacts, committed in `pacts/` — and the platform publishes contract
# packages from the release slot's last step. So every CLI gets this one step. It builds nothing: the
# QA step already proved the committed files, and the composed postlude packs them from the checkout
# at the tag. A CLI that declares no `contracts:` publishes nothing here.
release:

  - image: qits/build-images/maven-base:latest
    user: build
    timeout-seconds: 600
    script: |
      if [ -d pacts ]; then
        echo "contracts: the pacts at this tag"
        ls pacts/
      else
        echo "contracts: this CLI holds no pacts/; nothing to publish"
      fi
