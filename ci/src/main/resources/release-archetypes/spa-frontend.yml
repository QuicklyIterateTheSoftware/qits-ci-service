# spa-frontend — the whole release cycle of an Angular client that ships no artifact of its own.
#
# Fifteen repositories run this recipe, and thirteen of their QA files were byte-identical modulo one
# line before it existed. A migrating repository's `.config/qits/release.yml` is ONE LINE:
#
#     archetype: spa-frontend
#
# No `artifacts:`, no `userflows:`, and no `release:` slot anywhere — which is the point rather than
# an omission. Publish is a phase this repository does not have, not an empty phase: a frontend
# repository publishes nothing, the consuming service carries it as a Quinoa submodule at
# `service/src/main/webui` and builds the bundle into its own image, so a release of this repository
# is a TAG and what acts on the tag is the service's own maintenance pipeline. A phase nobody
# declares steps for gets no trigger document and therefore no run, which is exactly what a missing
# `ci-event-release.yml` meant before — this file declares phase one (QA) alone, and with no phase
# two (Publish) there is no `SoftwareRelease` for a phase three (Deploy) to gate on either. See
# java-service.yml's header for the full three-phase model.
#
# ---------------------------------------------------------------------------------------------
# WHAT THIS STEP IS FOR
#
# One step, and like every step it gates: install, lint, test, build. The verdict returns on the
# ordinary `BuildSuccessful`/`BuildFailed` with `commitSha` = the merged sha, which is what
# qits-projects' gate matches on together with `repoId`. There is no trailing verify-and-publish
# half, because there is nothing to publish from a fold — and had there been one it would gate like
# this one, since a run announces ONE verdict for all of its steps. See java-service.yml's header.
#
# NO `docker:` AND NO `build:`. Nothing here needs a builder, a socket or a credential, so this step
# keeps the ordinary sandbox that a publishing step has to give up.
#
# ---------------------------------------------------------------------------------------------
# WHEN TO OVERRIDE
#
# `npm run --if-present lint` and `--if-present test` are how one recipe covers fifteen repositories
# that do not all carry the same scripts: qits-spa-observability has an eslint.config.js and a `lint`
# script, several siblings do not, and a missing script must not be a red gate for a repository that
# never had one. ADDING the script is what turns the check on — no pipeline edit.
#
# Override `release-request:` (phase one, QA — the only phase this archetype has) when the
# repository needs a step this does not have (a second target, a browser-mode test run against an
# image that ships a browser, a bundle-size assertion). Declaring the slot replaces this list
# entirely; there is no per-step merging.

release-request:

  - image: qits/build-images/node-base:latest
    timeout-seconds: 1800
    script: |
      # THE LOCKFILE IS INSTALLED AS COMMITTED (qits-731). npm fetches every tarball by the full
      # `resolved` URL its lockfile pins and never asks the configured registry for it, so the
      # lockfile is an address list — and it is committed resolving against the platform's two
      # public registries, which a step reaches by the same names a developer does. Nothing here
      # rewrites it. The composed prelude has already refused a lockfile naming any other origin,
      # naming the file and the entries, before this script started.
      #
      # THE ADDRESSES ARE CODE: the platform's public domain is the one input, and the hosts and
      # paths are constants under it — registry.qits.<domain> hosts the @qits scope, mirror.qits.<domain>
      # the npmjs pull-through cache. The prelude demands the domain; the `:?` says so again here.
      qits_domain=${QITS_DOMAIN:?this step was told no QITS_DOMAIN}
      npm_hosted_origin="https://registry.qits.$qits_domain"
      npm_proxy_origin="https://mirror.qits.$qits_domain"
      npm_hosted_path=/artifacts/npm/npm/

      # ENVIRONMENT, not a file. These repositories COMMIT an .npmrc naming the edge vhosts (right
      # for a developer on the deployment host), and npm ranks a project .npmrc ABOVE ~/.npmrc — so
      # a `cat > ~/.npmrc` preamble would be written and silently ignored. `npm_config_*`
      # environment outranks both files, so it wins without touching the tree.
      env npm_config_registry="$npm_proxy_origin/npm/npmjs/" \
          "npm_config_@qits:registry=$npm_hosted_origin$npm_hosted_path" \
          npm ci --no-audit --no-fund

      # THE COVERAGE PROVIDER IS THE PLATFORM'S, AND THE REPOSITORY DECLARES NOTHING (qits-754).
      # vitest measures coverage through a provider package no repository on the estate depends on,
      # and the rule is that none is made to: no devDependency is added for the platform's sake. So
      # `@vitest/coverage-v8` is supplied here, at EXACTLY the vitest version the lockfile installed
      # — a provider of another version refuses to load.
      #
      # NOT `npm install --no-save` IN THE TREE. That re-resolves the whole dependency tree against
      # the registry and was measured moving @angular/build 21.2.19 → 21.2.25 under a committed
      # lockfile: the suite would then run against packages nobody committed. Instead the provider is
      # installed alone into a scratch directory outside the checkout and copied in as a
      # self-contained tree — its own dependencies nested under it, so nothing the lockfile placed is
      # touched or shadowed — and neither package.json nor the lockfile is ever opened. The
      # arguments are the registry configuration the install above ran under, prefixed to `npm`.
      #
      # A FAILURE COSTS THE COVERAGE AND NEVER THE STEP: every command is checked by hand (a
      # function called as a condition runs without `-e`), one line says what happened, and the
      # tests run exactly as they would have without coverage. Under pnpm's isolated node_modules
      # the same copy is resolved the same way, measured; npm does the scratch install there too.
      install_coverage_provider() {
        _vitest=$(node -p "require('./node_modules/vitest/package.json').version" 2>/dev/null) \
          || return 2
        [ -n "$_vitest" ] || return 2
        [ ! -f node_modules/@vitest/coverage-v8/package.json ] || return 0
        _scratch=$(mktemp -d) || return 1
        _status=0
        (
          cd "$_scratch" || exit 1
          npm init -y > /dev/null 2>&1 || exit 1
          "$@" npm install --no-save --no-package-lock --legacy-peer-deps --no-audit --no-fund \
            "@vitest/coverage-v8@$_vitest" > /tmp/qits-coverage-provider.log 2>&1 || exit 1
        ) && (
          provider=node_modules/@vitest/coverage-v8
          mkdir -p "$provider/node_modules/@vitest" || exit 1
          cp -a "$_scratch/node_modules/@vitest/coverage-v8/." "$provider/" || exit 1
          for dep in "$_scratch"/node_modules/*; do
            [ "${dep##*/}" = @vitest ] || cp -a "$dep" "$provider/node_modules/" || exit 1
          done
          for dep in "$_scratch"/node_modules/@vitest/*; do
            [ "${dep##*/}" = coverage-v8 ] || cp -a "$dep" "$provider/node_modules/@vitest/" || exit 1
          done
        ) || _status=1
        rm -rf "$_scratch"
        return "$_status"
      }

      # Supplied after the install, so the composed lockfile check before this script read the
      # committed tree, and with the install's own registry configuration.
      coverage_flags=""
      coverage_status=0
      install_coverage_provider env npm_config_registry="$npm_proxy_origin/npm/npmjs/" \
        "npm_config_@qits:registry=$npm_hosted_origin$npm_hosted_path" || coverage_status=$?
      case "$coverage_status" in
        0) coverage_flags="--coverage --coverage-reporters=json" ;;
        2) echo "coverage: no vitest in node_modules, so there is nothing to measure" ;;
        *) echo "coverage: could not supply @vitest/coverage-v8 for this vitest; the tests run without coverage" ;;
      esac

      # `--if-present` rather than a hard call: see the header. A repository that grows the script
      # gets the check with no pipeline edit.
      npm run --if-present lint

      # The jsdom target. This image has no browser and CI is not the place to download one. A
      # component that genuinely needs a layout engine gets a `.browser.spec.ts` and its own target,
      # run locally until a build image ships a browser.
      #
      # THE REPORTS (qits-754): vitest's JUnit reporter and, when the provider above is in place,
      # istanbul's `json` coverage — the two files the composed report hook reads after this script,
      # whatever its exit code. `--output-file` applies to the FIRST reporter, which is why `junit`
      # comes first and `default` keeps the log readable. Every repository's `test` ends in `ng
      # test`, so the flags land on @angular/build's unit-test builder, which takes all four.
      # Coverage cannot be pointed elsewhere from here — the builder has no directory option and
      # the flag refuses the reporter tuple — so it lands at `coverage/<project>/coverage-final.json`,
      # untracked, where the CLI looks for it. A red suite writes no coverage, and that is fine: its
      # test results are the report that matters. ONE run, with the coverage flags appended only
      # when the provider is there.
      mkdir -p .qits-reports
      npm run --if-present test -- --reporters=junit --reporters=default \
        --output-file=.qits-reports/vitest-unit.xml $coverage_flags

      npm run build
