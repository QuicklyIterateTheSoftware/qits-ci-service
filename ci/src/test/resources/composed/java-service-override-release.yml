# Composed by qits-ci from .config/qits/release.yml and .config/qits/release-archetypes/java-service.yml.
# Generated: this text is never committed. Edit the slot file or the archetype recipe.
event: SCMRelease
when:
  - repository: { exact: 'qits-ci-service' }
checkout:
  branch: version
  sha: commitSha
artifacts:
  - { type: 'docker', name: 'qits/qits-ci' }
steps:
  - image: 'qits/build-images/ci-base:latest'
    timeout-seconds: 3600
    build: true
    script: |
      set -eu
      # --- platform prelude ---------------------------------------------------------
      : "${QITS_VERSION:?the triggering release event carried no version}"
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$QITS_VERSION:refs/tags/$QITS_VERSION"
      git checkout --detach "$QITS_VERSION"
      if [ -n "${QITS_ARTIFACTS_CLI_PACKAGE:-}" ]; then
        : "${QITS_ARTIFACTS_CLI_VERSION:?the qits CLI package is configured but no version was injected; the qits-ci that launched this step predates the CLI pin}"
        mkdir -p /tmp/qits-bin
        if command -v curl > /dev/null 2>&1; then
          curl -fsSL --retry 2 --retry-delay 2 -o /tmp/qits-bin/qits "$QITS_ARTIFACTS_URL/artifacts/daemons/$QITS_ARTIFACTS_CLI_PACKAGE/$QITS_ARTIFACTS_CLI_VERSION"
        elif command -v wget > /dev/null 2>&1; then
          wget -q -O /tmp/qits-bin/qits "$QITS_ARTIFACTS_URL/artifacts/daemons/$QITS_ARTIFACTS_CLI_PACKAGE/$QITS_ARTIFACTS_CLI_VERSION"
        else
          echo 'qits-ci: the image for this step (qits/build-images/ci-base:latest) has neither curl nor wget, so the qits CLI cannot be fetched into it — add one to the image, or take the qits calls out of this step' >&2
          exit 1
        fi
        chmod +x /tmp/qits-bin/qits
        ln -sf /tmp/qits-bin/qits /tmp/qits-bin/qits-publish
        echo "qits-ci: fetched $QITS_ARTIFACTS_CLI_PACKAGE $QITS_ARTIFACTS_CLI_VERSION" >&2
        PATH="/tmp/qits-bin:$PATH"
        export PATH
      fi
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this step builds only through it}"
      : "${QITS_BUILD_REGISTRY:?}"
      (
        umask 077
        printf '%s' "${QITS_COMMISSIONED_CLIENT_ID:-}" > /tmp/qits-client-id
        printf '%s' "${QITS_COMMISSIONED_CLIENT_SECRET:-}" > /tmp/qits-client-secret
      )
      # --- the declared step, run as data -------------------------------------------
      cat > /tmp/qits-slot.sh <<'QITS_SLOT_EOF'
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --output "type=image,name=$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-ci:$QITS_VERSION,push=true"
      buildctl build --frontend dockerfile.v0 --opt target=sbom \
        --local context=. --local dockerfile=docker --output type=local,dest=out
      QITS_SLOT_EOF
      if command -v bash > /dev/null 2>&1; then
        bash -eu /tmp/qits-slot.sh
      else
        sh -eu /tmp/qits-slot.sh
      fi
      # --- platform postlude --------------------------------------------------------
      : "${QITS_ARTIFACTS_CLI_PACKAGE:?this release submits an SBOM, and the qits CLI is not configured on this deployment}"
      qits artifacts publish sbom submit --type 'docker' --name 'qits/qits-ci' --version "$QITS_VERSION" --file 'out/sbom.json'
