      # Maven Central through the platform mirror's public name, and the platform registry — code
      # under the platform's public domain (qits-731), which the composed prelude has already
      # demanded. The registry is what the contract tests read: a provider's golden masters jar
      # (qits-1149) is served by the platform's Maven alone. Exported because
      # .qits-maven-settings.xml reads both as ${env.QITS_MAVEN_CENTRAL_URL} and
      # ${env.QITS_MAVEN_REPOSITORY_URL}. A pom with no qits dependency never dials it.
      qits_domain=${QITS_DOMAIN:?this step was told no QITS_DOMAIN}
      export QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central"
      export QITS_MAVEN_REPOSITORY_URL="https://registry.qits.$qits_domain/artifacts/maven/maven"

      # Passed as a property ONLY when a pom reads ${qits.maven.repository.url} — the pom that
      # declares the `qits-maven` repository by it. Maven forwards a user property into surefire's
      # test JVM, and a CLI with a strict `qits` ConfigMapping refuses one it does not map
      # (SRCFG00050), so its tests would not boot.
      maven_repository_property=""
      if grep -rqs --include=pom.xml 'qits.maven.repository.url' .; then
        maven_repository_property="-Dqits.maven.repository.url=$QITS_MAVEN_REPOSITORY_URL"
      fi

      # THE COVERAGE AGENT (qits-754) — java-service.yml's QA verify block, byte for byte; read the
      # rationale there. In short: JaCoCo's runtime agent writes `.qits-reports/jacoco.exec` for the
      # composed report hook; it rides JAVA_TOOL_OPTIONS rather than `-DargLine`, because a pom
      # with a literal surefire `<argLine>` silently drops an agent added through the property;
      # `env` scopes it to this one mvnw; a failed fetch is one line and a verify without
      # coverage, never a red step; and `inclnolocationclasses` with `classdumpdir` let it measure
      # what a @QuarkusTest runs (qits-1171).
      jacoco_version=0.8.14
      jacoco_agent=/tmp/qits-jacoco/org.jacoco.agent-$jacoco_version-runtime.jar
      jacoco_url="$QITS_MAVEN_CENTRAL_URL/org/jacoco/org.jacoco.agent/$jacoco_version/org.jacoco.agent-$jacoco_version-runtime.jar"
      set --
      if [ -n "${QITS_TOKEN:-}" ]; then
        set -- "Authorization: Bearer $QITS_TOKEN"
      fi
      jacoco_options=""
      mkdir -p /tmp/qits-jacoco .qits-reports/pact-verification
      if curl -fsSL --retry 2 ${1:+-H} "$@" -o "$jacoco_agent" "$jacoco_url" 2>/dev/null \
        || wget -q ${1:+--header} "$@" -O "$jacoco_agent" "$jacoco_url" 2>/dev/null; then
        jacoco_options="-javaagent:$jacoco_agent=destfile=$PWD/.qits-reports/jacoco.exec,append=true,includes=eu.wohlben.*,inclnolocationclasses=true,classdumpdir=$PWD/.qits-reports/jacoco-classes"
      else
        echo "coverage: could not fetch the JaCoCo $jacoco_version agent; this verify runs without coverage"
      fi

      # THE PACT VERIFICATION REPORT (qits-759). A system property, inert in every JVM this verify
      # starts that is not a Pact-JVM provider verifier — nothing here checks which JVMs those are,
      # because the property costs nothing in any other. It exists because of WHERE the knowledge
      # lives: the pacts a provider verifies are resolved from pinned consumer jars on its OWN test
      # classpath, so only the verifying JVM itself ever learns which ones, and that is the one fact
      # qits-ci cannot read from outside. Pact-JVM's provider verifier writes
      # `.qits-reports/pact-verification/*.json` when it sees these two properties and reads neither
      # any other way; the CLI's `contracts` report kind is what reads that directory back after the
      # step ends.
      #
      # SET WHETHER OR NOT THE COVERAGE AGENT'S FETCH ABOVE SUCCEEDED: it must not sit inside that
      # `if`/`else`, so it is composed as its own always-set part and JAVA_TOOL_OPTIONS below is
      # built from both parts rather than from one living inside the other's branch.
      pact_options="-Dpact.verification.reports=json -Dpact.verification.reportDir=$PWD/.qits-reports/pact-verification"

      env "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:+$JAVA_TOOL_OPTIONS }${jacoco_options:+$jacoco_options }$pact_options" \
        ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        ${maven_repository_property:+"$maven_repository_property"}
      QITS_SLOT_EOF
      set +e
      if command -v bash > /dev/null 2>&1; then
        bash -eu /tmp/qits-slot.sh
      else
        sh -eu /tmp/qits-slot.sh
      fi
      qits_step_exit=$?
