# Composed by qits-ci from .config/qits/release.yml and .config/qits/release-archetypes/java-service.yml.
# Generated: this text is never committed. Edit the slot file or the archetype recipe.
event: SCMRelease
when:
  - repository: { exact: 'qits-projects-service' }
checkout:
  branch: version
  sha: commitSha
artifacts:
  - { type: 'docker', name: 'qits/qits-projects' }
  - { type: 'docs', name: '@apidocs/qits-projects' }
  - { type: 'maven', name: 'eu.wohlben.qits:qits-projects-golden-masters', publish: 'if-changed', section: 'contracts' }
  - { type: 'npm', name: '@qits/projects-golden-masters', publish: 'if-changed', section: 'contracts' }
steps:
  - timeout-seconds: 3600
    build: true
    script: |
      set -eu
      # --- platform prelude ---------------------------------------------------------
      : "${QITS_DOMAIN:?this step was told no QITS_DOMAIN, so it has no platform address}"
      qits_caches=
      for qits_cache in m2 pnpm; do
        if [ -d "/caches/$qits_cache" ]; then
          qits_cache_size=$(du -sh "/caches/$qits_cache" 2>/dev/null | cut -f1) || qits_cache_size=
          qits_cache_size=${qits_cache_size:-unknown}
        else
          qits_cache_size=absent
        fi
        qits_caches="$qits_caches $qits_cache=$qits_cache_size"
      done
      echo "qits-ci: caches$qits_caches" >&2 || true
      : "${QITS_VERSION:?the triggering release event carried no version}"
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$QITS_VERSION:refs/tags/$QITS_VERSION"
      git checkout --detach "$QITS_VERSION"
      cat > /tmp/qits-lockfile-origins.sh <<'QITS_LOCKFILE_EOF'
      # qits-ci: every npm lockfile here resolves from the platform's two registries (qits-731).
      set -eu
      : "${QITS_DOMAIN:?this step was told no QITS_DOMAIN, so no lockfile origin can be checked}"
      registry="https://registry.qits.$QITS_DOMAIN/"
      mirror="https://mirror.qits.$QITS_DOMAIN/"
      find . -name package-lock.json ! -path '*/node_modules/*' | {
        refused=0
        while IFS= read -r lock; do
          foreign=$(grep -o '"resolved": *"[^"]*"' "$lock" \
            | sed -e 's/^"resolved": *"//' -e 's/"$//' \
            | awk -v r="$registry" -v m="$mirror" \
              'index($0, "://") && index($0, r) != 1 && index($0, m) != 1')
          if [ -n "$foreign" ]; then
            count=$(printf '%s\n' "$foreign" | wc -l | tr -d ' ')
            echo "qits-ci: $lock resolves $count package(s) outside $registry and $mirror:" >&2
            printf '%s\n' "$foreign" | head -n 5 | sed 's/^/  /' >&2
            refused=1
          fi
        done
        if [ "$refused" -ne 0 ]; then
          echo "qits-ci: no lockfile is rewritten on this platform. Regenerate it against the" \
            "public registries (npm_config_registry=${mirror}npm/npmjs/," \
            "npm_config_@qits:registry=${registry}artifacts/npm/npm/) and commit it." >&2
          exit 1
        fi
      }
      QITS_LOCKFILE_EOF
      sh /tmp/qits-lockfile-origins.sh
      cat > /tmp/qits-migration-versions.sh <<'QITS_MIGRATION_EOF'
      # qits-ci: every migration lineage here holds each version once, none behind main's (qits-1669).
      set -eu
      pattern='(^|/)src/main/resources/(.*/)?db/(.*/)?V[0-9]+__[^/]*\.sql$'
      # One row per migration, `<dir>|<version>|<file>`, the version without its leading zeros so V057
      # and V57 are the same number, sorted by directory and then numerically by version.
      rows() {
        grep -E "$pattern" | sed -E 's#^(.*)/V0*([0-9]+)__[^/]*$#\1|\2|&#' | sort -t '|' -k1,1 -k2,2n
      }
      # The highest version $2's rows hold in directory $1, into $top; empty when they hold none.
      highest() {
        top=
        while IFS='|' read -r hd hv hf; do
          if [ "$hd" = "$1" ]; then top=$hv; fi
        done <<EOF
      $2
      EOF
      }
      here=$(find . \( -name target -o -name node_modules -o -name .git \) -prune \
        -o -type f -name 'V*__*.sql' -print | sed 's#^\./##' | rows)
      if [ -z "$here" ]; then
        echo "qits-ci: no migrations here" >&2
        exit 0
      fi
      refused=0
      lineages=0
      pd=
      pv=
      pf=
      while IFS='|' read -r d v f; do
        if [ "$d" != "$pd" ]; then
          lineages=$((lineages + 1))
        elif [ "$v" = "$pv" ]; then
          highest "$d" "$here"
          echo "qits-ci: $d has more than one migration with version $v: $pf $f" >&2
          echo "qits-ci: rename one of them to V$((top + 1))__..." >&2
          refused=1
        fi
        pd=$d
        pv=$v
        pf=$f
      done <<EOF
      $here
      EOF
      if [ -n "${QITS_VERSION:-}" ] && git rev-parse --git-dir >/dev/null 2>&1; then
        git fetch -q "${QITS_CI_REPOSITORY_URL:?this step was told no QITS_CI_REPOSITORY_URL}" \
          '+refs/heads/main:refs/qits/migration-check-main'
        main=$(git ls-tree -r --name-only refs/qits/migration-check-main | rows)
        nl='
      '
        while IFS='|' read -r d v f; do
          case "$nl$main$nl" in
            *"|$f$nl"*) continue ;;
          esac
          highest "$d" "$main"
          if [ -n "$top" ] && [ "$v" -le "$top" ]; then
            echo "qits-ci: $f is version $v, but main already has V$top in $d;" \
              "production would refuse it as out of order" >&2
            highest "$d" "$here"
            echo "qits-ci: rename it to V$((top + 1))__..." >&2
            refused=1
          fi
        done <<EOF
      $here
      EOF
      fi
      if [ "$refused" -ne 0 ]; then
        exit 1
      fi
      echo "qits-ci: migration versions checked ($lineages lineages)" >&2
      QITS_MIGRATION_EOF
      sh /tmp/qits-migration-versions.sh
      if [ -n "${QITS_ARTIFACTS_CLI_PACKAGE:-}" ]; then
        : "${QITS_ARTIFACTS_CLI_VERSION:?the qits CLI package is configured but no version was injected; the qits-ci that launched this step predates the CLI pin}"
        mkdir -p /tmp/qits-bin
        set --
        if [ -n "${QITS_TOKEN:-}" ]; then
          set -- --header "Authorization: Bearer $QITS_TOKEN"
        fi
        if command -v curl > /dev/null 2>&1; then
          curl -fsSL --retry 2 --retry-delay 2 "$@" -o /tmp/qits-bin/qits "https://registry.qits.$QITS_DOMAIN/artifacts/daemons/$QITS_ARTIFACTS_CLI_PACKAGE/$QITS_ARTIFACTS_CLI_VERSION"
        elif command -v wget > /dev/null 2>&1; then
          wget -q "$@" -O /tmp/qits-bin/qits "https://registry.qits.$QITS_DOMAIN/artifacts/daemons/$QITS_ARTIFACTS_CLI_PACKAGE/$QITS_ARTIFACTS_CLI_VERSION"
        else
          echo 'qits-ci: the image for this step (qits/build-images/ci-slot) has neither curl nor wget, so the qits CLI cannot be fetched into it — add one to the image, or take the qits calls out of this step' >&2
          exit 1
        fi
        chmod +x /tmp/qits-bin/qits
        ln -sf /tmp/qits-bin/qits /tmp/qits-bin/qits-publish
        echo "qits-ci: fetched $QITS_ARTIFACTS_CLI_PACKAGE $QITS_ARTIFACTS_CLI_VERSION" >&2
        PATH="/tmp/qits-bin:$PATH"
        export PATH
      fi
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this step builds only through it}"
      (
        umask 077
        if [ -n "${QITS_TOKEN:-}" ]; then
          printf '%s' "${QITS_TOKEN_SUBJECT:-qits-ci-run}" > /tmp/qits-client-id
          printf '%s' "$QITS_TOKEN" > /tmp/qits-client-secret
        else
          printf '' > /tmp/qits-client-id
          printf '' > /tmp/qits-client-secret
        fi
      )
      # --- the declared step, run as data -------------------------------------------
      cat > /tmp/qits-slot.sh <<'QITS_SLOT_EOF'
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --output "type=image,name=registry.qits.$QITS_DOMAIN/$QITS_IMAGE_REPOSITORY/qits-ci:$QITS_VERSION,push=true"
      buildctl build --frontend dockerfile.v0 --opt target=sbom \
        --local context=. --local dockerfile=docker --output type=local,dest=out
      QITS_SLOT_EOF
      if command -v bash > /dev/null 2>&1; then
        bash -eu /tmp/qits-slot.sh
      else
        sh -eu /tmp/qits-slot.sh
      fi
      # --- platform postlude --------------------------------------------------------
      : "${QITS_ARTIFACTS_CLI_PACKAGE:?this release publishes or submits an SBOM, and the qits CLI is not configured on this deployment}"
      qits artifacts publish contract --kind 'golden-masters' --ecosystem 'maven' --name 'eu.wohlben.qits:qits-projects-golden-masters' --application 'qits-projects' --from 'golden-masters/' --version "$QITS_VERSION"
      qits artifacts publish contract --kind 'golden-masters' --ecosystem 'npm' --name '@qits/projects-golden-masters' --application 'qits-projects' --from 'golden-masters/' --version "$QITS_VERSION"
      qits artifacts publish contract-docs --application 'qits-projects' --from 'golden-masters/' --package 'maven=eu.wohlben.qits:qits-projects-golden-masters' --package 'npm=@qits/projects-golden-masters' --version "$QITS_VERSION" --meta git.commit.hash="$QITS_CI_SHA" --meta git.repository.name="$QITS_CI_REPO_NAME"
      qits artifacts publish docs submit --site '@apidocs/qits-projects' --openapi 'docs/openapi.yml' --version "$QITS_VERSION" --meta git.commit.hash="$QITS_CI_SHA" --meta git.repository.name="$QITS_CI_REPO_NAME"
      command -v qits > /dev/null 2>&1 || { echo "qits-ci: the changelog cannot be published: this release step has no qits CLI (QITS_ARTIFACTS_CLI_PACKAGE unset or the fetch was skipped)" >&2; exit 1; }
      qits artifacts publish changelog --version "$QITS_VERSION" --meta git.commit.hash="$QITS_CI_SHA" --meta git.repository.name="$QITS_CI_REPO_NAME"
      if [ -f '.sbom/sbom.json' ]; then
        qits artifacts publish sbom submit --type 'docker' --name 'qits/qits-projects' \
          --version "$QITS_VERSION" --file '.sbom/sbom.json'
      fi
      qits artifacts publish exists sbom 'docker/qits/qits-projects' "$QITS_VERSION" \
        || { echo '.config/qits/release.yml declares sbom: .sbom/sbom.json for docker qits/qits-projects, and no release step produced it' >&2; exit 1; }
