          # pipeline's job; repeating them here would make this repository red for someone else's
          # commit.
          npm run build
        )
      done

      # NOTHING IS PUBLISHED, SO THERE IS NO `--output` AT ALL: buildctl solves the whole graph and
      # exports nothing. The build IS the gate on the fold, and the per-push `:$QITS_CI_SHA`
      # coordinate went with per-push CI — a fold's merged sha is not something cd could deploy.
      #
      # NO --network host, AND NOTHING REPLACES IT. Every `RUN` executes in the builder's own
      # namespace, so the two addresses a build dials are the RUN's: the platform's public names.
      # `QITS_DOMAIN` rides beside the two maven urls, which stay for the Dockerfiles that still
      # read them; a Dockerfile derives both from the domain once it declares that ARG.
      #
      # THE CREDENTIAL IS A SECRET IN FILE FORM, never a build arg — an arg is recorded in the image
      # history. The composer wrote /tmp/qits-client-id and /tmp/qits-client-secret under umask 077
      # before this script ran — the run's token subject and token; they are outside the clone, so
      # neither can enter the build context.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_DOMAIN="$qits_domain" \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="https://registry.qits.$qits_domain/artifacts/maven/maven" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret
