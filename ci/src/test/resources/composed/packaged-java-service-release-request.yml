# Generated: this text is never committed. Edit the slot file or the archetype recipe.
event: ReleaseRequestChanged
when:
  - repoName: { exact: 'qits-java-service-example' }
    preRun: { exists: false }
  - repoName: { exact: 'qits-java-service-example' }
    preRun: { exact: 'DONE' }
checkout:
  branch: backingBranch
  sha: mergedSha
steps:
  - name: 'build image'
    timeout-seconds: 3600
    build: true
    script: |
      set -eu
      # --- platform prelude ---------------------------------------------------------
      : "${QITS_DOMAIN:?this step was told no QITS_DOMAIN, so it has no platform address}"
      qits_caches=
      for qits_cache in m2 pnpm; do
        if [ -d "/caches/$qits_cache" ]; then
          qits_cache_size=$(du -sh "/caches/$qits_cache" 2>/dev/null | cut -f1) || qits_cache_size=
