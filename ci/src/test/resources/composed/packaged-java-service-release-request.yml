      # checked the tree before this script ran, when every gitlink was still an empty directory,
      # so a webui's lockfile was not there to read; the same check runs again over the tree as it
      # stands. Guarded on the file: a qits-ci older than the check composes none, and this line
      # then checks nothing rather than failing a step that predates it.
      if [ -f /tmp/qits-lockfile-origins.sh ]; then sh /tmp/qits-lockfile-origins.sh; fi

      # THE LOCKFILE IS INSTALLED AS COMMITTED (qits-731). npm fetches every tarball by the full
      # `resolved` URL its lockfile pins and never asks the configured registry for it, so a
      # lockfile is an address list — and every one is committed resolving against the platform's
      # two public registries, which a step reaches by the same names a developer does. Nothing
      # here rewrites it; the check above has refused one naming any other origin.
      # THE ADDRESSES ARE CODE: the platform's public domain is the one input, and the hosts and
      # paths below are constants — registry.qits.<domain> serves the hosted @qits scope,
      # mirror.qits.<domain> the npmjs cache. The composed prelude has already demanded the
      # domain; the `:?` says so again here.
      qits_domain=${QITS_DOMAIN:?this step was told no QITS_DOMAIN}
      npm_hosted_origin="https://registry.qits.$qits_domain"
      npm_proxy_origin="https://mirror.qits.$qits_domain"
      npm_hosted_path=/artifacts/npm/npm/
