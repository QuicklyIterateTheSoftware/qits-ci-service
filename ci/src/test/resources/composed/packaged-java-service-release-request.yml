# Composed by qits-ci from .config/qits/release.yml and ci/src/main/resources/release-archetypes/java-service.yml.
# Generated: this text is never committed. Edit the slot file or the archetype recipe.
event: ReleaseRequestChanged
when:
  - repoName: { exact: 'qits-java-service-example' }
    preRun: { exists: false }
  - repoName: { exact: 'qits-java-service-example' }
    preRun: { exact: 'DONE' }
checkout:
  branch: backingBranch
  sha: mergedSha
steps:
  - image: 'qits/build-images/node-docker-base:latest'
    timeout-seconds: 3600
    build: true
    script: |
      set -eu
      # --- platform prelude ---------------------------------------------------------
      : "${QITS_DOMAIN:?this step was told no QITS_DOMAIN, so it has no platform address}"
      cat > /tmp/qits-lockfile-origins.sh <<'QITS_LOCKFILE_EOF'
      # qits-ci: every npm lockfile here resolves from the platform's two registries (qits-731).
      set -eu
      : "${QITS_DOMAIN:?this step was told no QITS_DOMAIN, so no lockfile origin can be checked}"
      registry="https://registry.qits.$QITS_DOMAIN/"
      mirror="https://mirror.qits.$QITS_DOMAIN/"
      find . -name package-lock.json ! -path '*/node_modules/*' | {
        refused=0
        while IFS= read -r lock; do
          foreign=$(grep -o '"resolved": *"[^"]*"' "$lock" \
            | sed -e 's/^"resolved": *"//' -e 's/"$//' \
            | awk -v r="$registry" -v m="$mirror" \
              'index($0, "://") && index($0, r) != 1 && index($0, m) != 1')
          if [ -n "$foreign" ]; then
            count=$(printf '%s\n' "$foreign" | wc -l | tr -d ' ')
            echo "qits-ci: $lock resolves $count package(s) outside $registry and $mirror:" >&2
            printf '%s\n' "$foreign" | head -n 5 | sed 's/^/  /' >&2
            refused=1
          fi
        done
        if [ "$refused" -ne 0 ]; then
          echo "qits-ci: no lockfile is rewritten on this platform. Regenerate it against the" \
            "public registries (npm_config_registry=${mirror}npm/npmjs/," \
            "npm_config_@qits:registry=${registry}artifacts/npm/npm/) and commit it." >&2
          exit 1
        fi
      }
      QITS_LOCKFILE_EOF
      sh /tmp/qits-lockfile-origins.sh
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this step builds only through it}"
      (
        umask 077
        if [ -n "${QITS_TOKEN:-}" ]; then
          printf '%s' "${QITS_TOKEN_SUBJECT:-qits-ci-run}" > /tmp/qits-client-id
          printf '%s' "$QITS_TOKEN" > /tmp/qits-client-secret
        else
          printf '' > /tmp/qits-client-id
          printf '' > /tmp/qits-client-secret
        fi
      )
      # --- the declared step, run as data -------------------------------------------
      cat > /tmp/qits-slot.sh <<'QITS_SLOT_EOF'
      # $QITS_CI_BRANCH is release/<id> and $QITS_CI_SHA is the merged sha. The fold is already
      # checked out; nothing here fetches or switches refs.
      echo "verifying $QITS_CI_BRANCH at $QITS_CI_SHA"

      # THE SUBMODULES, READ OUT OF .gitmodules BY GIT ITSELF. The daemon's clone is shallow and
      # does not recurse, so a gitlink arrives as an EMPTY DIRECTORY — and an empty webui directory
      # is the one case Quinoa treats as a misconfiguration rather than as "no client", so the image
      # build dies on `No package.json found in Web UI directory` if the Dockerfile's own `test -f`
      # guard has not stopped it first.
      #
      # The url is overridden per entry rather than taken from the file: the committed url is the
      # public GitHub address, and a step container resolves the sibling next to the origin it was
      # cloned from. The entry NAME is the sibling repository's name, which the wrapper's
      # `git submodule add --name <name>` ritual is what guarantees.
      origin_parent="${QITS_CI_REPOSITORY_URL%/*}"
      webui_dirs=""
      if [ -f .gitmodules ]; then
        for key in $(git config -f .gitmodules --name-only --get-regexp '^submodule\..*\.path$'); do
          name=${key#submodule.}
          name=${name%.path}
          path=$(git config -f .gitmodules --get "$key")
          git -c "submodule.$name.url=$origin_parent/$name" submodule update --init "$path"
          if [ -f "$path/package.json" ]; then
            webui_dirs="$webui_dirs $path"
          fi
        done
      fi

      # THE SUBMODULES' LOCKFILES, checked now that they exist (qits-731). The composed prelude
      # checked the tree before this script ran, when every gitlink was still an empty directory,
      # so a webui's lockfile was not there to read; the same check runs again over the tree as it
      # stands. Guarded on the file: a qits-ci older than the check composes none, and this line
      # then checks nothing rather than failing a step that predates it.
      if [ -f /tmp/qits-lockfile-origins.sh ]; then sh /tmp/qits-lockfile-origins.sh; fi

      # THE LOCKFILE IS INSTALLED AS COMMITTED (qits-731). npm fetches every tarball by the full
      # `resolved` URL its lockfile pins and never asks the configured registry for it, so a
      # lockfile is an address list — and every one is committed resolving against the platform's
      # two public registries, which a step reaches by the same names a developer does. Nothing
      # here rewrites it; the check above has refused one naming any other origin.
      # THE ADDRESSES ARE CODE: the platform's public domain is the one input, and the hosts and
      # paths below are constants — registry.qits.<domain> serves the hosted @qits scope,
      # mirror.qits.<domain> the npmjs cache. The composed prelude has already demanded the
      # domain; the `:?` says so again here.
      qits_domain=${QITS_DOMAIN:?this step was told no QITS_DOMAIN}
      npm_hosted_origin="https://registry.qits.$qits_domain"
      npm_proxy_origin="https://mirror.qits.$qits_domain"
      npm_hosted_path=/artifacts/npm/npm/
      for dir in $webui_dirs; do
        (
          cd "$dir"
          # ENVIRONMENT, not a file. Every frontend repository COMMITS an .npmrc naming the edge
          # vhosts (right for a developer on the deployment host), and npm ranks a project .npmrc
          # ABOVE ~/.npmrc — so a `cat > ~/.npmrc` preamble would be written and silently ignored.
          # `npm_config_*` environment outranks both files without touching the submodule's tree.
          env npm_config_registry="$npm_proxy_origin/npm/npmjs/" \
              "npm_config_@qits:registry=$npm_hosted_origin$npm_hosted_path" \
              npm ci --no-audit --no-fund
          # The bundle the image build consumes. Lint and test are the frontend repository's own
          # pipeline's job; repeating them here would make this repository red for someone else's
          # commit.
          npm run build
        )
      done

      # NOTHING IS PUBLISHED, SO THERE IS NO `--output` AT ALL: buildctl solves the whole graph and
      # exports nothing. The build IS the gate on the fold, and the per-push `:$QITS_CI_SHA`
      # coordinate went with per-push CI — a fold's merged sha is not something cd could deploy.
      #
      # NO --network host, AND NOTHING REPLACES IT. Every `RUN` executes in the builder's own
      # namespace, so the two addresses a build dials are the RUN's: the platform's public names.
      # `QITS_DOMAIN` rides beside the two maven urls, which stay for the Dockerfiles that still
      # read them; a Dockerfile derives both from the domain once it declares that ARG.
      #
      # THE CREDENTIAL IS A SECRET IN FILE FORM, never a build arg — an arg is recorded in the image
      # history. The composer wrote /tmp/qits-client-id and /tmp/qits-client-secret under umask 077
      # before this script ran — the run's token subject and token; they are outside the clone, so
      # neither can enter the build context.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_DOMAIN="$qits_domain" \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="https://registry.qits.$qits_domain/artifacts/maven/maven" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret
      QITS_SLOT_EOF
      set +e
      if command -v bash > /dev/null 2>&1; then
        bash -eu /tmp/qits-slot.sh
      else
        sh -eu /tmp/qits-slot.sh
      fi
      qits_step_exit=$?
      set -e
      # --- platform report hook: always runs, never changes the step's verdict ---
      cat > /tmp/qits-report-hook.sh <<'QITS_REPORT_HOOK'
      # qits-ci report hook (qits-754). $1 is the declared script's exit code.
      set -u
      if [ -z "${QITS_ARTIFACTS_CLI_PACKAGE:-}" ]; then
        echo "qits-ci: reports skipped: no qits CLI configured" >&2
        exit 0
      fi
      if [ -z "${QITS_ARTIFACTS_CLI_VERSION:-}" ]; then
        echo "qits-ci: the qits CLI package is configured but no version was injected; the qits-ci that launched this step predates the CLI pin" >&2
        exit 1
      fi
      mkdir -p /tmp/qits-cli || { echo "qits-ci: could not create /tmp/qits-cli" >&2; exit 1; }
      qits_cli_bearer=
      if [ -n "${QITS_TOKEN:-}" ]; then
        qits_cli_bearer="Authorization: Bearer $QITS_TOKEN"
      fi
      if command -v curl > /dev/null 2>&1; then
        curl -fsSL --retry 2 --retry-delay 2 ${qits_cli_bearer:+--header} ${qits_cli_bearer:+"$qits_cli_bearer"} -o /tmp/qits-cli/qits "https://registry.qits.$QITS_DOMAIN/artifacts/daemons/$QITS_ARTIFACTS_CLI_PACKAGE/$QITS_ARTIFACTS_CLI_VERSION" || { echo "qits-ci: could not fetch $QITS_ARTIFACTS_CLI_PACKAGE $QITS_ARTIFACTS_CLI_VERSION" >&2; exit 1; }
      elif command -v wget > /dev/null 2>&1; then
        wget -q ${qits_cli_bearer:+--header} ${qits_cli_bearer:+"$qits_cli_bearer"} -O /tmp/qits-cli/qits "https://registry.qits.$QITS_DOMAIN/artifacts/daemons/$QITS_ARTIFACTS_CLI_PACKAGE/$QITS_ARTIFACTS_CLI_VERSION" || { echo "qits-ci: could not fetch $QITS_ARTIFACTS_CLI_PACKAGE $QITS_ARTIFACTS_CLI_VERSION" >&2; exit 1; }
      else
        echo 'qits-ci: the image for this step (qits/build-images/node-docker-base:latest) has neither curl nor wget, so the qits CLI cannot be fetched into it — add one to the image to get its reports submitted' >&2
        exit 1
      fi
      chmod +x /tmp/qits-cli/qits || { echo "qits-ci: could not make /tmp/qits-cli/qits executable" >&2; exit 1; }
      echo "qits-ci: fetched $QITS_ARTIFACTS_CLI_PACKAGE $QITS_ARTIFACTS_CLI_VERSION" >&2
      /tmp/qits-cli/qits ci report submit --exit-code "$1"
      QITS_REPORT_HOOK
      sh /tmp/qits-report-hook.sh "$qits_step_exit" || echo "qits-ci: reports were not submitted; the step's verdict is unchanged" >&2
      exit "$qits_step_exit"
  - image: 'qits/build-images/maven-base:latest'
    timeout-seconds: 2400
    user: 'build'
    script: |
      set -eu
      # --- platform prelude ---------------------------------------------------------
      : "${QITS_DOMAIN:?this step was told no QITS_DOMAIN, so it has no platform address}"
      cat > /tmp/qits-lockfile-origins.sh <<'QITS_LOCKFILE_EOF'
      # qits-ci: every npm lockfile here resolves from the platform's two registries (qits-731).
      set -eu
      : "${QITS_DOMAIN:?this step was told no QITS_DOMAIN, so no lockfile origin can be checked}"
      registry="https://registry.qits.$QITS_DOMAIN/"
      mirror="https://mirror.qits.$QITS_DOMAIN/"
      find . -name package-lock.json ! -path '*/node_modules/*' | {
        refused=0
        while IFS= read -r lock; do
          foreign=$(grep -o '"resolved": *"[^"]*"' "$lock" \
            | sed -e 's/^"resolved": *"//' -e 's/"$//' \
            | awk -v r="$registry" -v m="$mirror" \
              'index($0, "://") && index($0, r) != 1 && index($0, m) != 1')
          if [ -n "$foreign" ]; then
            count=$(printf '%s\n' "$foreign" | wc -l | tr -d ' ')
            echo "qits-ci: $lock resolves $count package(s) outside $registry and $mirror:" >&2
            printf '%s\n' "$foreign" | head -n 5 | sed 's/^/  /' >&2
            refused=1
          fi
        done
        if [ "$refused" -ne 0 ]; then
          echo "qits-ci: no lockfile is rewritten on this platform. Regenerate it against the" \
            "public registries (npm_config_registry=${mirror}npm/npmjs/," \
            "npm_config_@qits:registry=${registry}artifacts/npm/npm/) and commit it." >&2
          exit 1
        fi
      }
      QITS_LOCKFILE_EOF
      sh /tmp/qits-lockfile-origins.sh
      # --- the declared step, run as data -------------------------------------------
      cat > /tmp/qits-slot.sh <<'QITS_SLOT_EOF'
      # The platform registry: the poms' default names a host-published address unreachable from a
      # step container, and the exact-id mirror in .qits-maven-settings.xml is what passes Maven's
      # HTTP blocker. Central rides the mirror. Both are code under the platform's public domain
      # (qits-731), which the composed prelude has already demanded.
      qits_domain=${QITS_DOMAIN:?this step was told no QITS_DOMAIN}
      export QITS_MAVEN_REPOSITORY_URL="https://registry.qits.$qits_domain/artifacts/maven/maven"
      export QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central"

      # The story allow-list, if this repository keeps one. See the header: absent means the
      # repository's pom decides, which is the shape four repositories already prefer.
      it_selection=""
      if [ -f .config/qits/userflow-stories ]; then
        stories=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' .config/qits/userflow-stories \
          | grep -v '^$' | tr '\n' ',')
        stories=${stories%,}
        : "${stories:?.config/qits/userflow-stories is present and names no story class}"
        it_selection="-Dit.test=$stories"
      fi

      # THE COVERAGE AGENT (qits-754). JaCoCo's runtime agent, fetched from the Central mirror and
      # handed to every JVM the verify starts, writes `.qits-reports/jacoco.exec` at the checkout
      # root; the composed report hook reads it against the reactor's `target/classes` after this
      # script, whatever its exit code. Nothing in the repository is configured for it: no pom
      # plugin, no `report` goal.
      #
      # THROUGH JAVA_TOOL_OPTIONS, NOT `-DargLine`. Many poms on the estate set a literal surefire
      # `<argLine>` (qits-ci-service's own service/pom.xml among them), and a literal argLine
      # REPLACES the property — so an agent added through `-DargLine` or `prepare-agent` would be
      # dropped silently, with a green build and no coverage. The environment is inherited by every
      # forked test JVM and by the application failsafe launches for the stories, which no flag
      # reaches. Every one of those JVMs prints `Picked up JAVA_TOOL_OPTIONS: …` on stderr; measured
      # 2026-10-06 against qits-ci-service's and qits-projects-service's whole verify: no test failed
      # on that line, and the wall time stayed inside the run-to-run noise.
      #
      # THE TWO OPTIONS QUARKUS NEEDS (qits-1171). Without them qits-projects-service read 35.6%.
      # - `inclnolocationclasses=true`: a @QuarkusTest runs the application from Quarkus's own class
      #   loader, which defines its classes with no code source location. The agent skips such
      #   classes by default, so nothing a @QuarkusTest ran was recorded at all.
      # - `classdumpdir`: Quarkus also rewrites many classes as it loads them (CDI beans, Panache
      #   entities and repositories). JaCoCo keys its data by the CRC of the loaded bytes, so that
      #   data matches no class in `target/classes`. The agent writes each class as a JVM loaded it
      #   to `.qits-reports/jacoco-classes/` (one file per variant, its id in the name, tens of MB at
      #   most), and the CLI reads each variant against its own data and credits the covered lines
      #   to the original.
      #
      # SCOPED TO THE ONE INVOCATION: `env` hands it to this mvnw and to nothing after it, so the
      # bundle and the publish below run without the agent.
      #
      # A FAILED FETCH COSTS THE COVERAGE AND NEVER THE STEP. One line says so and the verify runs
      # exactly as it did before this block existed; the report hook then finds no exec and reports
      # no coverage. The mirror refuses an anonymous read, so the bearer is the run's own token, as
      # a `set --` argument list like the docs PUT's below: an absent token sends no header rather
      # than an empty one, and the `-H`/`--header` in front of it appears only when there is one.
      # 0.8.14 is the version the qits CLI reads the exec with; the two move together.
      jacoco_version=0.8.14
      jacoco_agent=/tmp/qits-jacoco/org.jacoco.agent-$jacoco_version-runtime.jar
      jacoco_url="$QITS_MAVEN_CENTRAL_URL/org/jacoco/org.jacoco.agent/$jacoco_version/org.jacoco.agent-$jacoco_version-runtime.jar"
      set --
      if [ -n "${QITS_TOKEN:-}" ]; then
        set -- "Authorization: Bearer $QITS_TOKEN"
      fi
      jacoco_options=""
      mkdir -p /tmp/qits-jacoco .qits-reports/pact-verification
      if curl -fsSL --retry 2 ${1:+-H} "$@" -o "$jacoco_agent" "$jacoco_url" 2>/dev/null \
        || wget -q ${1:+--header} "$@" -O "$jacoco_agent" "$jacoco_url" 2>/dev/null; then
        jacoco_options="-javaagent:$jacoco_agent=destfile=$PWD/.qits-reports/jacoco.exec,append=true,includes=eu.wohlben.*,inclnolocationclasses=true,classdumpdir=$PWD/.qits-reports/jacoco-classes"
      else
        echo "coverage: could not fetch the JaCoCo $jacoco_version agent; this verify runs without coverage"
      fi

      # THE PACT VERIFICATION REPORT (qits-759). A system property, inert in every JVM this verify
      # starts that is not a Pact-JVM provider verifier — nothing here checks which JVMs those are,
      # because the property costs nothing in any other. It exists because of WHERE the knowledge
      # lives: the pacts a provider verifies are resolved from pinned consumer jars on its OWN test
      # classpath, so only the verifying JVM itself ever learns which ones, and that is the one fact
      # qits-ci cannot read from outside. Pact-JVM's provider verifier writes
      # `.qits-reports/pact-verification/*.json` when it sees these two properties and reads neither
      # any other way; the CLI's `contracts` report kind is what reads that directory back after the
      # step ends.
      #
      # SET WHETHER OR NOT THE COVERAGE AGENT'S FETCH ABOVE SUCCEEDED: it must not sit inside that
      # `if`/`else`, so it is composed as its own always-set part and JAVA_TOOL_OPTIONS below is
      # built from both parts rather than from one living inside the other's branch.
      pact_options="-Dpact.verification.reports=json -Dpact.verification.reportDir=$PWD/.qits-reports/pact-verification"

      # Quinoa off: the client is the build step's business, and the stories assert nothing about
      # the SPA. It is also what keeps this step from needing the submodule at all — the daemon's
      # clone does not recurse, so the webui directory is empty here, which is the one state Quinoa
      # calls a misconfiguration.
      env "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:+$JAVA_TOOL_OPTIONS }${jacoco_options:+$jacoco_options }$pact_options" \
        ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -Dquarkus.quinoa=false \
        -DskipITs=false \
        ${it_selection:+"$it_selection"}

      # The bundle. `-C <dir> .` so the story directories are the bundle's roots — nesting one level
      # deep would put the directory in every served URL. The directory is `<module>/target/
      # userstories`, and which module holds the deployable differs, so it is found rather than
      # spelled.
      stories_dir=$(find . -maxdepth 3 -type d -path '*/target/userstories' | head -1)
      : "${stories_dir:?the verify produced no */target/userstories — this repository declares userflows and generated none}"
      tar -czf /tmp/userstories.tgz -C "$stories_dir" .

      # THE SITE, out of this repository's own release.yml. `userflows: true` means the repository's
      # own name; a spelled value wins, because the fleet's sites are not derivable — and every
      # repository spells one, so the derived arm is a fallback nothing takes (qits-projects
      # publishes @userflows/qits-projects, qits-system-service publishes @userflows/qits-system).
      site=$(sed -n 's/^userflows:[[:space:]]*//p' .config/qits/release.yml | head -1)
      site=${site%%#*}
      site=$(printf '%s' "$site" | tr -d '[:space:]')
      case "$site" in
        ''|true) site="$QITS_CI_REPO_NAME" ;;
      esac

      # THE RUN'S OWN BEARER, AND IT IS MINTED HERE RATHER THAN READ FROM $QITS_PUBLISH_TOKEN.
      # qits-ci hands a step both: the variable, minted when the container started, and
      # $QITS_PUBLISH_TOKEN_COMMAND, which prints a FRESH raw token on every call. The mint's TTL
      # and this step's timeout are the same number (3600s), and this PUT is the last thing the
      # step does — after a verify that can spend most of that hour — so the variable can already
      # be expired where the command cannot. Every publish in this estate re-mints at the call site
      # for that reason.
      #
      # IT DEGRADES TO ANONYMOUS, NEVER TO A BROKEN HEADER. This file is read at main and runs
      # against a tag, on whatever qits-ci the estate is running, so the command may be absent
      # entirely and a mint may fail. qits-artifacts still accepts an anonymous publish today, so
      # sending no Authorization header is exactly the call that worked yesterday; sending
      # `Bearer ` with nothing after it is a 401 that would cost a release before the store's
      # refusal has even landed. Neither case may abort the step.
      publish_token=""
      if [ -n "${QITS_PUBLISH_TOKEN_COMMAND:-}" ] \
        && command -v "$QITS_PUBLISH_TOKEN_COMMAND" >/dev/null 2>&1; then
        publish_token=$("$QITS_PUBLISH_TOKEN_COMMAND" 2>/dev/null) || publish_token=""
      fi
      # THE ARGUMENT LIST, not an unquoted `${publish_token:+-H "Authorization: …"}`: that value
      # contains spaces and would word-split into four arguments, of which curl would read the
      # first as the whole header. `set --` builds it as words, which needs no curl semantics at
      # all — an empty `"$@"` under `set -u` expands to nothing in both dash and bash.
      set --
      if [ -n "$publish_token" ]; then
        set -- -H "Authorization: Bearer $publish_token"
      fi

      # Branch and commit ride as metadata (the docs store's exact-match discovery keys); the
      # version is the merged sha itself, so a bundle URL never changes meaning. `qits-publish docs
      # submit` is this call and is unavailable on the QA phase — see the header, which is also why
      # the bearer is assembled by hand above rather than left to the CLI that credentials itself.
      #
      # PUBLISH-IF-ABSENT: events redeliver and docs versions are immutable, so 409 is success.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @/tmp/userstories.tgz "$@" \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: ${site##*/}" \
        "https://registry.qits.$qits_domain/artifacts/docs/docs/@userflows/$site/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for $site@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for $site@$QITS_CI_SHA are already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
      QITS_SLOT_EOF
      set +e
      if command -v bash > /dev/null 2>&1; then
        bash -eu /tmp/qits-slot.sh
      else
        sh -eu /tmp/qits-slot.sh
      fi
      qits_step_exit=$?
      set -e
      # --- platform report hook: always runs, never changes the step's verdict ---
      cat > /tmp/qits-report-hook.sh <<'QITS_REPORT_HOOK'
      # qits-ci report hook (qits-754). $1 is the declared script's exit code.
      set -u
      if [ -z "${QITS_ARTIFACTS_CLI_PACKAGE:-}" ]; then
        echo "qits-ci: reports skipped: no qits CLI configured" >&2
        exit 0
      fi
      if [ -z "${QITS_ARTIFACTS_CLI_VERSION:-}" ]; then
        echo "qits-ci: the qits CLI package is configured but no version was injected; the qits-ci that launched this step predates the CLI pin" >&2
        exit 1
      fi
      mkdir -p /tmp/qits-cli || { echo "qits-ci: could not create /tmp/qits-cli" >&2; exit 1; }
      qits_cli_bearer=
      if [ -n "${QITS_TOKEN:-}" ]; then
        qits_cli_bearer="Authorization: Bearer $QITS_TOKEN"
      fi
      if command -v curl > /dev/null 2>&1; then
