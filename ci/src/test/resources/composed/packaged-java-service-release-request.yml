      # checked out; nothing here fetches or switches refs.
      echo "verifying $QITS_CI_BRANCH at $QITS_CI_SHA"

      # THE SUBMODULES, READ OUT OF .gitmodules BY GIT ITSELF. The daemon's clone is shallow and
      # does not recurse, so a gitlink arrives as an EMPTY DIRECTORY — and an empty webui directory
      # is the one case Quinoa treats as a misconfiguration rather than as "no client", so the image
      # build dies on `No package.json found in Web UI directory` if the Dockerfile's own `test -f`
      # guard has not stopped it first.
      #
      # The url is overridden per entry rather than taken from the file: the committed url is the
      # public GitHub address, and a step container resolves the sibling next to the origin it was
      # cloned from. The entry NAME is the sibling repository's name, which the wrapper's
      # `git submodule add --name <name>` ritual is what guarantees.
      origin_parent="${QITS_CI_REPOSITORY_URL%/*}"
      webui_dirs=""
      if [ -f .gitmodules ]; then
        for key in $(git config -f .gitmodules --name-only --get-regexp '^submodule\..*\.path$'); do
          name=${key#submodule.}
          name=${name%.path}
          path=$(git config -f .gitmodules --get "$key")
          git -c "submodule.$name.url=$origin_parent/$name" submodule update --init "$path"
          if [ -f "$path/package.json" ]; then
            webui_dirs="$webui_dirs $path"
          fi
        done
      fi

