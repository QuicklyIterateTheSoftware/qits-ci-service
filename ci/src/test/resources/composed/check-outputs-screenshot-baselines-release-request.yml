# Composed by qits-ci from .config/qits/release.yml.
# Generated: this text is never committed. Edit the slot file or the archetype recipe.
event: ReleaseRequestChanged
when:
  - repoName: { exact: 'qits-ci-service' }
    preRun: { exists: false }
  - repoName: { exact: 'qits-ci-service' }
    preRun: { exact: 'DONE' }
checkout:
  branch: backingBranch
  sha: mergedSha
steps:
  - timeout-seconds: 3600
    script: |
      set -eu
      # --- platform prelude ---------------------------------------------------------
      : "${QITS_DOMAIN:?this step was told no QITS_DOMAIN, so it has no platform address}"
      cat > /tmp/qits-lockfile-origins.sh <<'QITS_LOCKFILE_EOF'
      # qits-ci: every npm lockfile here resolves from the platform's two registries (qits-731).
      set -eu
      : "${QITS_DOMAIN:?this step was told no QITS_DOMAIN, so no lockfile origin can be checked}"
      registry="https://registry.qits.$QITS_DOMAIN/"
      mirror="https://mirror.qits.$QITS_DOMAIN/"
      find . -name package-lock.json ! -path '*/node_modules/*' | {
        refused=0
        while IFS= read -r lock; do
          foreign=$(grep -o '"resolved": *"[^"]*"' "$lock" \
            | sed -e 's/^"resolved": *"//' -e 's/"$//' \
            | awk -v r="$registry" -v m="$mirror" \
              'index($0, "://") && index($0, r) != 1 && index($0, m) != 1')
          if [ -n "$foreign" ]; then
            count=$(printf '%s\n' "$foreign" | wc -l | tr -d ' ')
            echo "qits-ci: $lock resolves $count package(s) outside $registry and $mirror:" >&2
            printf '%s\n' "$foreign" | head -n 5 | sed 's/^/  /' >&2
            refused=1
          fi
        done
        if [ "$refused" -ne 0 ]; then
          echo "qits-ci: no lockfile is rewritten on this platform. Regenerate it against the" \
            "public registries (npm_config_registry=${mirror}npm/npmjs/," \
            "npm_config_@qits:registry=${registry}artifacts/npm/npm/) and commit it." >&2
          exit 1
        fi
      }
      QITS_LOCKFILE_EOF
      sh /tmp/qits-lockfile-origins.sh
      # --- the qits CLI, pinned, on PATH: this step declares qits-cli: true ---
      if [ -z "${QITS_ARTIFACTS_CLI_PACKAGE:-}" ]; then
        echo "qits-ci: the qits CLI could not be fetched: no qits CLI package is configured for this deployment" >&2
        exit 1
      fi
      if [ -z "${QITS_ARTIFACTS_CLI_VERSION:-}" ]; then
        echo "qits-ci: the qits CLI could not be fetched: the qits CLI package is configured but no version was injected; the qits-ci that launched this step predates the CLI pin" >&2
        exit 1
      fi
      mkdir -p /tmp/qits-bin || { echo "qits-ci: the qits CLI could not be fetched: could not create /tmp/qits-bin" >&2; exit 1; }
      qits_cli_bearer=
      if [ -n "${QITS_TOKEN:-}" ]; then
        qits_cli_bearer="Authorization: Bearer $QITS_TOKEN"
      fi
      if command -v curl > /dev/null 2>&1; then
        curl -fsSL --retry 2 --retry-delay 2 ${qits_cli_bearer:+--header} ${qits_cli_bearer:+"$qits_cli_bearer"} -o /tmp/qits-bin/qits "https://registry.qits.$QITS_DOMAIN/artifacts/daemons/$QITS_ARTIFACTS_CLI_PACKAGE/$QITS_ARTIFACTS_CLI_VERSION" || { echo "qits-ci: the qits CLI could not be fetched: the download of $QITS_ARTIFACTS_CLI_PACKAGE $QITS_ARTIFACTS_CLI_VERSION failed" >&2; exit 1; }
      elif command -v wget > /dev/null 2>&1; then
        wget -q ${qits_cli_bearer:+--header} ${qits_cli_bearer:+"$qits_cli_bearer"} -O /tmp/qits-bin/qits "https://registry.qits.$QITS_DOMAIN/artifacts/daemons/$QITS_ARTIFACTS_CLI_PACKAGE/$QITS_ARTIFACTS_CLI_VERSION" || { echo "qits-ci: the qits CLI could not be fetched: the download of $QITS_ARTIFACTS_CLI_PACKAGE $QITS_ARTIFACTS_CLI_VERSION failed" >&2; exit 1; }
      else
        echo 'qits-ci: the qits CLI could not be fetched: the image for this step (qits/build-images/ci-slot) has neither curl nor wget — add one to the image' >&2
        exit 1
      fi
      chmod +x /tmp/qits-bin/qits || { echo "qits-ci: the qits CLI could not be fetched: could not make /tmp/qits-bin/qits executable" >&2; exit 1; }
      echo "qits-ci: fetched $QITS_ARTIFACTS_CLI_PACKAGE $QITS_ARTIFACTS_CLI_VERSION" >&2
      PATH="/tmp/qits-bin:$PATH"
      export PATH
      # --- the declared step, run as data -------------------------------------------
      cat > /tmp/qits-slot.sh <<'QITS_SLOT_EOF'
      npm ci --no-audit --no-fund
      npm run build
      QITS_SLOT_EOF
      set +e
      if command -v bash > /dev/null 2>&1; then
        bash -eu /tmp/qits-slot.sh
      else
        sh -eu /tmp/qits-slot.sh
      fi
      qits_step_exit=$?
      set -e
      # --- platform output check: the generators run, then git status on their paths ---
      qits_stale=
      qits_regenerate=
      cat > /tmp/qits-check-screenshot-baselines.sh <<'QITS_CHECK_EOF'
      if ! jq -e '.scripts["test:browser"]' package.json >/dev/null 2>&1; then
        echo "this repository has no test:browser script - there are no screenshot tests to render" >&2
        exit 1
      fi

      # The same install the `app` QA step runs: the lockfile as committed, resolving against the
      # platform's two public registries, and nothing rewritten (qits-731). An entry naming any
      # other host fails `npm ci` itself.
      # THE ADDRESSES ARE CODE: the platform's public domain is the one input, and the hosts and
      # paths are constants under it. A step is always told the domain; the `:?` stops one that
      # is not, here, rather than at a host named `registry.qits.`.
      qits_domain=${QITS_DOMAIN:?this step was told no QITS_DOMAIN}
      npm_hosted_origin="https://registry.qits.$qits_domain"
      npm_proxy_origin="https://mirror.qits.$qits_domain"
      npm_hosted_path=/artifacts/npm/npm/
      env npm_config_registry="$npm_proxy_origin/npm/npmjs/" \
          "npm_config_@qits:registry=$npm_hosted_origin$npm_hosted_path" \
          npm ci --no-audit --no-fund

      # Writes every reference that is missing or differs. A spec that fails for any
      # other reason fails the run, and nothing is committed.
      UPDATE_SNAPSHOT=all npm run test:browser

      # Deletes the references no test asked for in the run above (a deleted spec, a renamed
      # screenshot). The postlude stages the deletions with the new images. A repository without
      # the script keeps its orphans.
      npm run --if-present screenshots:prune
      QITS_CHECK_EOF
      if [ "$qits_step_exit" -eq 0 ]; then
        echo "qits-ci: checking screenshot-baselines" >&2
        set +e
        if command -v bash > /dev/null 2>&1; then
          bash -eu /tmp/qits-check-screenshot-baselines.sh
        else
          sh -eu /tmp/qits-check-screenshot-baselines.sh
        fi
        qits_check_exit=$?
        set -e
        if [ "$qits_check_exit" -ne 0 ]; then
          echo "qits-ci: the screenshot-baselines generator failed (exit $qits_check_exit), so its outputs were not checked" >&2
          qits_step_exit=$qits_check_exit
        elif ! qits_changed=$(git status --porcelain --untracked-files=all -- ':(glob)**/__screenshots__/**' ':(glob)**/testing/browser/renderer.txt'); then
          echo "qits-ci: git status failed, so the screenshot-baselines outputs were not checked" >&2
          qits_step_exit=1
        elif [ -n "$qits_changed" ]; then
          printf '%s\n' "$qits_changed" >&2
          qits_stale="${qits_stale:+$qits_stale, }screenshot-baselines"
          qits_regenerate="${qits_regenerate:+$qits_regenerate; }qits release-request regenerate --project ${QITS_CI_PROJECT_ID:-<project>} --repository ${QITS_CI_REPO_NAME:-<repository>} --kind screenshot-baselines"
        fi
      fi
      if [ -n "$qits_stale" ]; then
        echo "qits-ci: stale outputs: $qits_stale — regenerate with: $qits_regenerate" >&2
        qits_step_exit=1
      fi
      # --- platform report hook: always runs, never changes the step's verdict ---
      cat > /tmp/qits-report-hook.sh <<'QITS_REPORT_HOOK'
      # qits-ci report hook (qits-754). $1 is the declared script's exit code.
      set -u
      if [ -z "${QITS_ARTIFACTS_CLI_PACKAGE:-}" ]; then
        echo "qits-ci: reports skipped: no qits CLI configured" >&2
        exit 0
      fi
      if [ -z "${QITS_ARTIFACTS_CLI_VERSION:-}" ]; then
        echo "qits-ci: the qits CLI package is configured but no version was injected; the qits-ci that launched this step predates the CLI pin" >&2
        exit 1
      fi
      mkdir -p /tmp/qits-cli || { echo "qits-ci: could not create /tmp/qits-cli" >&2; exit 1; }
      qits_cli_bearer=
      if [ -n "${QITS_TOKEN:-}" ]; then
        qits_cli_bearer="Authorization: Bearer $QITS_TOKEN"
      fi
      if command -v curl > /dev/null 2>&1; then
        curl -fsSL --retry 2 --retry-delay 2 ${qits_cli_bearer:+--header} ${qits_cli_bearer:+"$qits_cli_bearer"} -o /tmp/qits-cli/qits "https://registry.qits.$QITS_DOMAIN/artifacts/daemons/$QITS_ARTIFACTS_CLI_PACKAGE/$QITS_ARTIFACTS_CLI_VERSION" || { echo "qits-ci: could not fetch $QITS_ARTIFACTS_CLI_PACKAGE $QITS_ARTIFACTS_CLI_VERSION" >&2; exit 1; }
      elif command -v wget > /dev/null 2>&1; then
        wget -q ${qits_cli_bearer:+--header} ${qits_cli_bearer:+"$qits_cli_bearer"} -O /tmp/qits-cli/qits "https://registry.qits.$QITS_DOMAIN/artifacts/daemons/$QITS_ARTIFACTS_CLI_PACKAGE/$QITS_ARTIFACTS_CLI_VERSION" || { echo "qits-ci: could not fetch $QITS_ARTIFACTS_CLI_PACKAGE $QITS_ARTIFACTS_CLI_VERSION" >&2; exit 1; }
      else
        echo 'qits-ci: the image for this step (qits/build-images/ci-slot) has neither curl nor wget, so the qits CLI cannot be fetched into it — add one to the image to get its reports submitted' >&2
        exit 1
      fi
      chmod +x /tmp/qits-cli/qits || { echo "qits-ci: could not make /tmp/qits-cli/qits executable" >&2; exit 1; }
      echo "qits-ci: fetched $QITS_ARTIFACTS_CLI_PACKAGE $QITS_ARTIFACTS_CLI_VERSION" >&2
      /tmp/qits-cli/qits ci report submit --exit-code "$1"
      QITS_REPORT_HOOK
      sh /tmp/qits-report-hook.sh "$qits_step_exit" || echo "qits-ci: reports were not submitted; the step's verdict is unchanged" >&2
      exit "$qits_step_exit"
