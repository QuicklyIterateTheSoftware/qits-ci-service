archetype: java-service
artifacts:
  - { type: docker, name: qits/qits-ci, sbom: .sbom/sbom.json }
  - { type: docs, name: "@apidocs/qits-ci" }
# The provider golden masters (epic qits-112): the platform packages `golden-masters/` as
# `eu.wohlben.qits:qits-ci-golden-masters` and `@qits/ci-golden-masters`, each published only when
# its content changed, plus the `@contracts/qits-ci` docs bundle. The composed postlude publishes
# them after the release step below. `contracts/GoldenMasterRecordingTest` records them.
# THE PACTS (qits-1149): qits-ci's own consumer pact against qits-events (the eventstream library's
# catch-up reads), flat in `pacts/` as `qits-ci-service_qits-events-service.json`. The platform packs
# it as eu.wohlben.qits:qits-ci-service-pacts-qits-events-service, published only when it changed.
contracts:
  application: qits-ci
  golden-masters: { from: golden-masters/, packages: [maven, npm] }
  pacts:
    qits-events-service: { packages: [maven] }
userflows: qits-ci

# A SECOND PUBLICATION BESIDE THE IMAGE: `docs/openapi.yml` is this service's API surface, committed
# and regenerated by OpenApiSchemaExportTest, and it goes up as `@apidocs/qits-ci` at the released
# version. java-service pushes one image and publishes nothing else, so the whole release slot is
# here. The docs entry carries no `sbom:` — an OpenAPI bundle has no bill of materials — and it is
# submitted inline at the end of this one step, which is also the step the composed postlude appends
# the image's SBOM submit to. One step, one working directory, both documents present in it.
#
# THE QA SLOT IS NOT OVERRIDDEN. The only thing this repository needs from it beyond the archetype
# is `-Dit.test`, and that is composed from `.config/qits/userflow-stories` beside this file: five
# story classes, which is what keeps CiPackagedSurfaceIT — not a story — from running there (the
# docker-backed CiDaemonHandshakeIT and CiDaemonGateIT it also kept out went with the in-process
# executor, qits-506). The list survives the
# migration as a FILE, not as a sixth key, and it lives in exactly one place.
release:
  - image: qits/build-images/node-docker-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      declared=$(sed -n \
        's/^[[:space:]]*-[[:space:]]*{[[:space:]]*type:[[:space:]]*docker[[:space:]]*,[[:space:]]*name:[[:space:]]*\([^,}[:space:]]*\).*/\1/p' \
        .config/qits/release.yml)
      image=${declared#*/}
      # The addresses are code under the platform's public domain (qits-731), which every qits-ci
      # that runs this file injects; the `:?` stops a step that was not told it.
      qits_domain=${QITS_DOMAIN:?this step was told no QITS_DOMAIN}
      ref="registry.qits.$qits_domain/$QITS_IMAGE_REPOSITORY/$image:$QITS_VERSION"
      echo "releasing $ref"

      origin_parent="${QITS_CI_REPOSITORY_URL%/*}"
      webui_dirs=""
      if [ -f .gitmodules ]; then
        for key in $(git config -f .gitmodules --name-only --get-regexp '^submodule\..*\.path$'); do
          name=${key#submodule.}
          name=${name%.path}
          path=$(git config -f .gitmodules --get "$key")
          git -c "submodule.$name.url=$origin_parent/$name" submodule update --init "$path"
          if [ -f "$path/package.json" ]; then
            webui_dirs="$webui_dirs $path"
          fi
        done
      fi

      # The submodules' lockfiles, checked now that they exist: the composed prelude ran before any
      # gitlink was materialised. Installed as committed — nothing is rewritten (qits-731). Guarded
      # on the file because a qits-ci older than the check composes none.
      if [ -f /tmp/qits-lockfile-origins.sh ]; then sh /tmp/qits-lockfile-origins.sh; fi

      npm_hosted_origin="https://registry.qits.$qits_domain"
      npm_proxy_origin="https://mirror.qits.$qits_domain"
      npm_hosted_path=/artifacts/npm/npm/
      for dir in $webui_dirs; do
        (
          cd "$dir"
          env npm_config_registry="$npm_proxy_origin/npm/npmjs/" \
              "npm_config_@qits:registry=$npm_hosted_origin$npm_hosted_path" \
              npm ci --no-audit --no-fund
          npm run build
        )
      done

      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_DOMAIN="$qits_domain" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output "type=image,name=$ref,push=true"

      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=sbom \
        --opt build-arg:QITS_DOMAIN="$qits_domain" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output type=local,dest=.sbom

      # THE API SURFACE. `-C docs openapi.yml` so the document is the bundle's root. Submitted here
      # rather than left to the postlude: the postlude submits SBOMs for artifacts that declare a
      # path, and this one has none.
      tar -czf /tmp/apidocs.tgz -C docs openapi.yml
      qits artifacts publish docs submit \
        --site "@apidocs/qits-ci" --version "$QITS_VERSION" --archive /tmp/apidocs.tgz \
        --meta git.commit.hash="$QITS_CI_SHA" \
        --meta git.repository.name=qits-ci
