# Apply one maintenance bump: qits-platform-maintenance decides WHAT moves, this
# pipeline moves it and pushes the branch.
#
# A PLATFORM pipeline: packaged into qits-ci from qits-ci-service's own
# `.config/qits/platform-pipelines/` (until 2026-10-02 it lived in the wrapper as
# `ci-platform-event-maintenance-bump.yml`), and run against the repository the payload
# names. No `when:` - every MaintenanceBump is for us, and the payload's changes decide
# what each step does. `PackagedPlatformPipelinesTest` holds the commit guards below to
# `--ignore-submodules=none`.
#
# STEPS SHARE NO WORKING TREE. Every step is its own container with its own shallow
# clone, so each of the two below fetches the branch, commits its own ecosystem and
# pushes. The maven step runs first; the node step fetches its commit back. One bump
# is therefore up to TWO commits on the branch, not one - the service must read the
# branch head rather than expect a single commit.
#
# A BRANCH IS EITHER CONTINUED OR REBUILT, and never force-pushed otherwise. `baseRef`
# is what a new branch starts from: a bare name means `refs/heads/<name>`, and a full
# ref is fetched as written - `refs/tags/<version>` when the repository has a release
# that is not merged yet, so the bump lands on what actually ships. `replaceHead` is
# the branch head as the maintenance service last read it, sent when the branch was
# started from an older base and has to be rebuilt on the new one. Both steps make the
# same decision from the same three facts - the branch's head now, `replaceHead`, and
# the base:
#   no branch                    start it from baseRef, plain push
#   head == replaceHead          REBUILD: start from baseRef, push with a lease on
#                                replaceHead
#   head != replaceHead, or      continue it, plain push - which is how the node step
#   no replaceHead at all        lands on top of the maven step's rebuilt commit, and
#                                how a branch somebody else moved meanwhile ends in a
#                                non-ff rejection rather than an overwrite
# So a rebuild is carried by whichever step commits first: when the maven step has
# nothing to commit, the node step still finds head == replaceHead and rebuilds. And when
# NEITHER step has anything to commit - the base already carries every pin this bump would
# have written - a rebuild that only ever pushes a commit would push nothing at all, and the
# stale branch would stay exactly where it was: still naming replaceHead, still conflicting
# with the base it was supposed to move onto. The NODE STEP alone carries that case: finding
# REBUILD still decided (`$lease` set) and nothing staged, it pushes the commit it started
# from under that same lease - no new commit, same guarantee - so the branch moves onto the
# base either way. The maven step takes no such action on nothing to commit; it is never the
# step with the last word, so leaving a stale branch to it would still leave it stale.
#
# A MAVEN-ONLY BUMP MUST REACH THAT DECISION TOO, even though the node step's own change list
# is then empty from the start. The node step's early "nothing for me" exit is conditioned on
# `replaceHead` as well as on its change list, so a payload carrying one still walks down into
# the branch decision with an empty list to apply - which the apply loop and the commit/push
# block both already tolerate - rather than returning before ever looking at the branch.
#
# What this reads of a `changes[]` entry, and what it does not:
#   ecosystem     maven here, npm, docker and gitlink in the second step
#   manifestPath  the file to edit, repository-relative - EXCEPT for gitlink, where it
#                 is the DIRECTORY the submodule sits at and no file exists
#   name          npm/docker: the thing to install or the image to re-tag
#                 maven: the commit message only - `location` carries the coordinates
#                 gitlink: the SIBLING REPOSITORY, which is what the clone url is
#                 derived from. Load-bearing, and the only ecosystem where it is.
#   to            the new version, refused unless [0-9A-Za-z._+-]+
#   from          the commit message only. It is NOT a precondition: a manifest that
#                 already holds `to` is a no-op, never a failure. For gitlink it is the
#                 commit sha the tree holds now, which is what makes the body readable.
#   location      maven: `property:<name>` or `dependency:<groupId>:<artifactId>`
#                 npm: IGNORED - npm updates the entry in whichever section holds it
#                 docker: it says WHICH KIND OF LINE holds the pin, and there are two.
#                 `line:<n>` is IGNORED - a line number goes stale the moment the first
#                 step commits, so a FROM is anchored on the image name instead.
#                 `arg:<name>` is NOT ignored and is the anchor itself: the pin sits in
#                 an `ARG <name>=<image>:<tag>` default that a later `FROM ${<name>}`
#                 resolves, and the argument's name is a stable address where a line
#                 number is not
#                 gitlink: IGNORED - `gitlink:<path>` restates manifestPath
#
# GITLINK REPLACES THE `ci-event-upstream-frontend.yml` HOP FILES. Fifteen service
# repositories each carried one: it watched its own SPA's SCMRelease, fetched the tag
# and force-pushed `maintenance/frontend`. The same move is an ordinary pin here - one
# entry in `.gitmodules`, one row in the inventory, one commit on the shared branch,
# released through the same door as everything else.
event: MaintenanceBump
steps:
  - image: qits/build-images/maven-base:latest
    timeout-seconds: 900
    script: |
      set -eu

      # --- what this step has to do, if anything -----------------------------------
      # The payload holds changes for every ecosystem. This image has maven; the next
      # step has node. Each applies its own and exits 0 quietly when it has none.
      printf '%s' "$QITS_EVENT_PAYLOAD" \
        | jq -r '.changes[]? | select(.ecosystem == "maven")
                 | [.name, (.from // ""), .to, .manifestPath, (.location // "")] | @tsv' \
        > /tmp/bump-maven.tsv
      if [ ! -s /tmp/bump-maven.tsv ]; then
        echo "no maven changes in this bump"
        exit 0
      fi

      group=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -er '.group')
      branch=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -er '.branch')
      base=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -r '.baseRef // "main"')
      replace=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -r '.replaceHead // empty')

      # Every value below reaches an argv or an awk -v, so the charset is refused rather
      # than quoted - the hop files this replaces argue it in full. Nothing legitimate
      # here needs a character outside these sets.
      case "$group" in ''|*[!0-9A-Za-z._-]*) echo "refusing an implausible group: $group" >&2; exit 1 ;; esac
      for ref in "$branch" "$base"; do
        case "$ref" in
          ''|-*|*..*|*[!0-9A-Za-z._/-]*) echo "refusing an implausible ref: $ref" >&2; exit 1 ;;
        esac
      done
      # A bare name is a branch, as it always was; a full ref - `refs/tags/<version>` - is
      # fetched as written. The charset above already holds a full ref to the same rules.
      case "$base" in
        refs/*) base_ref=$base ;;
        *) base_ref="refs/heads/$base" ;;
      esac
      # A commit name and nothing else: sha-1 or sha-256, lowercase, as rev-parse prints it.
      # It is compared, and it reaches a --force-with-lease, so anything else is refused.
      case "$replace" in
        '') ;;
        *[!0-9a-f]*) echo "refusing an implausible replaceHead: $replace" >&2; exit 1 ;;
        *)
          if [ ${#replace} -ne 40 ] && [ ${#replace} -ne 64 ]; then
            echo "refusing an implausible replaceHead: $replace" >&2
            exit 1
          fi
          ;;
      esac

      # --- the two edits, anchored and counted -------------------------------------
      # Not a global sed: a bump must change the one element it names or fail loudly.
      # Both programs exit non-zero unless they matched EXACTLY once.
      cat > /tmp/bump-property.awk <<'AWK'
      # <name>...</name> inside a <properties> block, and nowhere else.
      BEGIN { n = 0; inprops = 0; open = "<" prop ">"; shut = "</" prop ">" }
      {
        if (index($0, "<properties>") > 0) inprops = 1
        if (inprops == 1) {
          s = index($0, open)
          if (s > 0) {
            e = index($0, shut)
            if (e > s) {
              $0 = substr($0, 1, s + length(open) - 1) to substr($0, e)
              n++
            }
          }
        }
        if (index($0, "</properties>") > 0) inprops = 0
        print
      }
      END {
        if (n != 1) {
          printf("matched %d <%s> properties, expected 1\n", n, prop) > "/dev/stderr"
          exit 3
        }
      }
      AWK

      cat > /tmp/bump-dependency.awk <<'AWK'
      # The <version> of the one <dependency> or <parent> block carrying this g:a.
      function strip(text, tag) { sub("<" tag ">", "", text); sub("</" tag ">", "", text); return text }
      BEGIN { n = 0; nb = 0; inblock = 0; bad = 0 }
      {
        if (inblock == 0 && ($0 ~ /<dependency>/ || $0 ~ /<parent>/)) { inblock = 1; nb = 0; g = ""; a = "" }
        if (inblock == 0) { print; next }
        nb++
        buf[nb] = $0
        if (match($0, /<groupId>[^<]*<\/groupId>/)) g = strip(substr($0, RSTART, RLENGTH), "groupId")
        if (match($0, /<artifactId>[^<]*<\/artifactId>/)) a = strip(substr($0, RSTART, RLENGTH), "artifactId")
        if ($0 ~ /<\/dependency>/ || $0 ~ /<\/parent>/) {
          if (g == gid && a == aid) {
            hits = 0
            for (i = 1; i <= nb; i++) {
              if (buf[i] ~ /<version>[^<]*<\/version>/) {
                sub(/<version>[^<]*<\/version>/, "<version>" to "</version>", buf[i])
                hits++
              }
            }
            if (hits == 1) n++
            else {
              printf("%s:%s carries %d <version> elements, expected 1\n", gid, aid, hits) > "/dev/stderr"
              bad = 1
            }
          }
          for (i = 1; i <= nb; i++) print buf[i]
          inblock = 0
          nb = 0
        }
      }
      END {
        for (i = 1; i <= nb; i++) print buf[i]
        if (bad) exit 4
        if (n != 1) {
          printf("matched %d dependencies for %s:%s, expected 1\n", n, gid, aid) > "/dev/stderr"
          exit 3
        }
      }
      AWK

      # --- the branch: ff-only, or a rebuild under a lease ------------------------
      # Steps do NOT share a working tree - every step is its own container with its
      # own shallow clone - so this step puts its own commit on the branch and the next
      # one fetches it back and commits on top. If the branch exists we continue it; if
      # it does not we start it from baseRef; if it is exactly the replaceHead we were
      # sent, we rebuild it on baseRef. The node step makes the same decision in the
      # same words.
      # A failed fetch is read as "no such branch". That is safe in the only direction
      # that matters: we then build on baseRef and the push is refused as a non-ff - or
      # by the lease, on a rebuild - rather than overwriting work.
      lease=
      if git fetch -q "$QITS_CI_REPOSITORY_URL" "refs/heads/$branch" 2>/dev/null; then
        head=$(git rev-parse --verify "FETCH_HEAD^{commit}")
      else
        head=
      fi
      if [ -n "$head" ] && [ "$head" != "$replace" ]; then
        echo "continuing $branch"
        start=$head
      else
        git fetch -q "$QITS_CI_REPOSITORY_URL" "$base_ref"
        start=$(git rev-parse --verify "FETCH_HEAD^{commit}")
        if [ -z "$head" ]; then
          echo "starting $branch from $base"
        else
          # A REBUILD THROWS THE BRANCH AWAY, which is safe because a maintenance branch
          # is written by the maintenance service and nobody else. The lease is what keeps
          # it honest: the push names replaceHead as the value it replaces, so a branch
          # that moved after the maintenance service read it is refused, not overwritten.
          echo "rebuilding $branch on $base (was $replace)"
          lease="--force-with-lease=refs/heads/$branch:$replace"
        fi
      fi
      git checkout -q --detach "$start"

      # --- apply -------------------------------------------------------------------
      : > /tmp/bump-body.txt
      applied=0
      tab=$(printf '\t')
      while IFS="$tab" read -r name from to manifest location <&3; do
        case "$to" in ''|*[!0-9A-Za-z._+-]*) echo "refusing an implausible version: $to" >&2; exit 1 ;; esac
        case "$name" in ''|*[!0-9A-Za-z._:-]*) echo "refusing an implausible dependency: $name" >&2; exit 1 ;; esac
        case "$manifest" in
          ''|/*|*..*|*[!0-9A-Za-z._/-]*) echo "refusing an implausible manifest: $manifest" >&2; exit 1 ;;
        esac
        [ -f "$manifest" ] || { echo "no such manifest: $manifest" >&2; exit 1; }

        case "$location" in
          property:*)
            prop=${location#property:}
            case "$prop" in
              ''|*[!0-9A-Za-z._-]*) echo "refusing an implausible property: $prop" >&2; exit 1 ;;
            esac
            awk -v prop="$prop" -v to="$to" -f /tmp/bump-property.awk "$manifest" > /tmp/bump-edited
            ;;
          dependency:*:*)
            coords=${location#dependency:}
            gid=${coords%%:*}
            aid=${coords#*:}
            for part in "$gid" "$aid"; do
              case "$part" in
                ''|*[!0-9A-Za-z._-]*) echo "refusing implausible coordinates: $location" >&2; exit 1 ;;
              esac
            done
            awk -v gid="$gid" -v aid="$aid" -v to="$to" -f /tmp/bump-dependency.awk "$manifest" > /tmp/bump-edited
            ;;
          *)
            echo "unknown maven location: $location" >&2
            exit 1
            ;;
        esac
        mv /tmp/bump-edited "$manifest"
        git add -- "$manifest"
        applied=$((applied + 1))
        echo "- maven $name $from -> $to ($manifest)" >> /tmp/bump-body.txt
        echo "bumped $name to $to in $manifest"
      done 3< /tmp/bump-maven.tsv

      # --- commit and push ---------------------------------------------------------
      # --ignore-submodules=none because `.gitmodules` sets `ignore = all` on the webui
      # submodule of every service, and that setting makes `git diff` blind to gitlink
      # entries - `--cached` included. No gitlink reaches this step today, so the flag
      # changes nothing here; it is written the same way as the node step's so the two
      # guards cannot drift, and so a gitlink arriving here later is not silently dropped.
      if git diff --cached --quiet --ignore-submodules=none; then
        echo "every maven change in this bump is already the pin - nothing to commit"
        exit 0
      fi
      {
        printf 'bump(%s): %d dependencies\n\n' "$group" "$applied"
        cat /tmp/bump-body.txt
      } > /tmp/bump-message.txt
      git -c user.name="qits maintenance" -c user.email="maintenance@qits.local" \
          commit -q -F /tmp/bump-message.txt
      # NEVER a bare --force. A rejection means somebody rewrote the branch by hand; it
      # is theirs now, and the maintenance service marks it STALE. A rebuild is the one
      # non-ff push, and it carries a lease on replaceHead: if the branch moved after
      # the maintenance service read it, the push is refused the same way.
      if ! git push ${lease:+"$lease"} "$QITS_CI_REPOSITORY_URL" "HEAD:refs/heads/$branch"; then
        echo "push to $branch was rejected - the branch is not what we built on" >&2
        exit 1
      fi
  - image: qits/build-images/node-base:latest
    timeout-seconds: 1800
    script: |
      set -eu

      # --- what this step has to do, if anything -----------------------------------
      # npm, docker and gitlink changes. node-base carries node, npm, git and curl - and
      # NO jq, so the payload is read with `node -p`/`node -e`, exactly as the angular
      # hop file this replaces does. gitlink needs only the git that is already here.
      node -e '
        const payload = JSON.parse(process.env.QITS_EVENT_PAYLOAD || "{}");
        const mine = (payload.changes || []).filter(c =>
          c.ecosystem === "npm" || c.ecosystem === "docker" || c.ecosystem === "gitlink");
        process.stdout.write(mine.map(c =>
          [c.ecosystem, c.name, c.from || "", c.to, c.manifestPath, c.location || ""].join("\t") + "\n").join(""));
      ' > /tmp/bump-node.tsv
      # A REPLACEHEAD IS A REASON TO CARRY ON EVEN WITH NOTHING OF OUR OWN: this step is the
      # one that runs last, so a REBUILD the maven step left undone - because IT had nothing to
      # commit, maven-only bump or not - is this step's only remaining chance to carry it; see
      # the header. So the early exit is conditioned on replaceHead too, not on the change list
      # alone. Everything from the branch decision down already tolerates an empty
      # /tmp/bump-node.tsv - the apply loop below just does nothing over it - so carrying on
      # costs nothing when there turns out to be no rebuild to carry either.
      replace=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).replaceHead || ""')
      if [ ! -s /tmp/bump-node.tsv ] && [ -z "$replace" ]; then
        echo "no npm, docker or gitlink changes in this bump"
        exit 0
      fi

      group=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).group')
      branch=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).branch')
      base=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).baseRef || "main"')
      replace=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).replaceHead || ""')

      case "$group" in ''|*[!0-9A-Za-z._-]*) echo "refusing an implausible group: $group" >&2; exit 1 ;; esac
      for ref in "$branch" "$base"; do
        case "$ref" in
          ''|-*|*..*|*[!0-9A-Za-z._/-]*) echo "refusing an implausible ref: $ref" >&2; exit 1 ;;
        esac
      done
      # A bare name is a branch, as it always was; a full ref - `refs/tags/<version>` - is
      # fetched as written. The charset above already holds a full ref to the same rules.
      case "$base" in
        refs/*) base_ref=$base ;;
        *) base_ref="refs/heads/$base" ;;
      esac
      # A commit name and nothing else: sha-1 or sha-256, lowercase, as rev-parse prints it.
      # It is compared, and it reaches a --force-with-lease, so anything else is refused.
      case "$replace" in
        '') ;;
        *[!0-9a-f]*) echo "refusing an implausible replaceHead: $replace" >&2; exit 1 ;;
        *)
          if [ ${#replace} -ne 40 ] && [ ${#replace} -ne 64 ]; then
            echo "refusing an implausible replaceHead: $replace" >&2
            exit 1
          fi
          ;;
      esac

      # --- the docker edits, anchored and counted ----------------------------------
      # TWO PROGRAMS, because a base image is pinned in one of two places and the
      # payload's `location` says which.
      #
      # A `line:<n>` location is not used: a line number goes stale the moment the maven
      # step commits, and the image name is the thing that is actually true about the
      # line. Exactly one FROM must match, or the step fails.
      cat > /tmp/bump-from.awk <<'AWK'
      BEGIN { n = 0; pfx = img ":" }
      {
        if (match($0, /^[ \t]*[Ff][Rr][Oo][Mm][ \t]+/)) {
          # Both halves are cut BEFORE the next match(), which overwrites RSTART.
          head = substr($0, 1, RSTART + RLENGTH - 1)
          rest = substr($0, RSTART + RLENGTH)
          if (index(rest, pfx) == 1) {
            tail = substr(rest, length(pfx) + 1)
            after = ""
            if (match(tail, /[ \t]/)) after = substr(tail, RSTART)
            $0 = head pfx to after
            n++
          }
        }
        print
      }
      END {
        if (n != 1) {
          printf("matched %d FROM lines for %s, expected 1\n", n, img) > "/dev/stderr"
          exit 3
        }
      }
      AWK

      # An `arg:<name>` location IS the anchor. Three repositories pin their base image
      # in an `ARG <name>=<image>:<tag>` default with a `FROM ${<name>}` below it, so
      # that `docker build --build-arg` can override what a literal FROM cannot - and
      # the argument's name is an address that survives every edit above it. The image
      # name is checked as well as the argument's, so a payload that named the wrong
      # one edits nothing rather than the wrong thing.
      cat > /tmp/bump-arg.awk <<'AWK'
      BEGIN { n = 0; pfx = img ":" }
      {
        if (match($0, "^[ \t]*[Aa][Rr][Gg][ \t]+" arg "=")) {
          # Both halves are cut BEFORE the next match(), which overwrites RSTART.
          head = substr($0, 1, RSTART + RLENGTH - 1)
          rest = substr($0, RSTART + RLENGTH)
          # AN ARG DEFAULT CARRIES A REGISTRY HOST AND THE PAYLOAD DOES NOT. The default
          # has to be an address a `docker build` can pull on its own, while the name the
          # inventory records is the portable one - `qits/workspace`, the same spelling
          # mt_latest is keyed by. So a leading host is stepped over and written back
          # untouched. Docker's own test for one: a first segment carrying a dot or a
          # colon, or spelled localhost. A namespace is never mistaken for a host.
          host = ""
          slash = index(rest, "/")
          if (slash > 1) {
            first = substr(rest, 1, slash - 1)
            if (first ~ /[.:]/ || first == "localhost") {
              host = substr(rest, 1, slash)
              rest = substr(rest, slash + 1)
            }
          }
          if (index(rest, pfx) == 1) {
            tail = substr(rest, length(pfx) + 1)
            after = ""
            if (match(tail, /[ \t]/)) after = substr(tail, RSTART)
            $0 = head host pfx to after
            n++
          }
        }
        print
      }
      END {
        if (n != 1) {
          printf("matched %d ARG %s lines for %s, expected 1\n", n, arg, img) > "/dev/stderr"
          exit 3
        }
      }
      AWK

      # --- the branch: ff-only, or a rebuild under a lease ------------------------
      # This step's container is a fresh clone, so the maven step's commit is fetched
      # back here rather than inherited - steps share no working tree. The decision is
      # the maven step's, word for word: a branch the maven step already rebuilt has a
      # head that is no longer replaceHead, so it is continued; one the maven step left
      # alone - it had nothing to commit - still is replaceHead, so it is rebuilt here.
      # A failed fetch is read as "no such branch". That is safe in the only direction
      # that matters: we then build on baseRef and the push is refused as a non-ff - or
      # by the lease, on a rebuild - rather than overwriting work.
      lease=
      if git fetch -q "$QITS_CI_REPOSITORY_URL" "refs/heads/$branch" 2>/dev/null; then
        head=$(git rev-parse --verify "FETCH_HEAD^{commit}")
      else
        head=
      fi
      if [ -n "$head" ] && [ "$head" != "$replace" ]; then
        echo "continuing $branch"
        start=$head
      else
        git fetch -q "$QITS_CI_REPOSITORY_URL" "$base_ref"
        start=$(git rev-parse --verify "FETCH_HEAD^{commit}")
        if [ -z "$head" ]; then
          echo "starting $branch from $base"
        else
          # A REBUILD THROWS THE BRANCH AWAY, which is safe because a maintenance branch
          # is written by the maintenance service and nobody else. The lease is what keeps
          # it honest: the push names replaceHead as the value it replaces, so a branch
          # that moved after the maintenance service read it is refused, not overwritten.
          echo "rebuilding $branch on $base (was $replace)"
          lease="--force-with-lease=refs/heads/$branch:$replace"
        fi
      fi
      git checkout -q --detach "$start"

      # --- apply -------------------------------------------------------------------
      : > /tmp/bump-body.txt
      applied=0
      tab=$(printf '\t')
      while IFS="$tab" read -r ecosystem name from to manifest location <&3; do
        case "$to" in ''|*[!0-9A-Za-z._+-]*) echo "refusing an implausible version: $to" >&2; exit 1 ;; esac
        case "$name" in ''|*[!@A-Za-z0-9._/-]*) echo "refusing an implausible dependency: $name" >&2; exit 1 ;; esac
        case "$manifest" in
          ''|/*|*..*|*[!0-9A-Za-z._/-]*) echo "refusing an implausible manifest: $manifest" >&2; exit 1 ;;
        esac
        # A gitlink's path is a DIRECTORY, and in this clone it is an empty one - the
        # submodule is never initialised here, because the whole edit is an index entry.
        # So the file test guards the two ecosystems that edit a file, and no more.
        if [ "$ecosystem" != "gitlink" ] && [ ! -f "$manifest" ]; then
          echo "no such manifest: $manifest" >&2
          exit 1
        fi

        if [ "$ecosystem" = "npm" ]; then
          # THE TWO NPM ROOTS ARE CODE (qits-731): the hosted @qits scope and the npmjs
          # cache are constant paths under registry.qits.<domain> and mirror.qits.<domain>,
          # and the platform's public domain is the one input. Both answer 401
          # anonymously; the step's ~/.npmrc already carries the run's token for both
          # hosts, written by qits-ci's bootstrap before this script started.
          if [ -z "${QITS_DOMAIN:-}" ]; then
            echo "this step was told no QITS_DOMAIN, so it has no npm registry to resolve against" >&2
            exit 1
          fi
          registry_origin="https://registry.qits.$QITS_DOMAIN"
          mirror_origin="https://mirror.qits.$QITS_DOMAIN"
          dir=$(dirname "$manifest")
          lock="$dir/package-lock.json"
          [ -f "$lock" ] || { echo "no package-lock.json beside $manifest" >&2; exit 1; }
          # THE SPECIFIER KEEPS ITS SHAPE. Read from whichever section holds the entry:
          # an exact pin stays exact, a `^`/`~` range keeps its operator around the new
          # version. Anything else - a wider range, a tag, a file: or git: source - is
          # not a version a bump can move without changing what it means, so it is
          # refused rather than rewritten to `^<to>`, which is what npm would do. Both
          # flags are always passed, so a repository's own .npmrc `save-exact` cannot
          # turn a `^` into a pin or a pin into a `^`.
          current=$(BUMP_MANIFEST="$manifest" BUMP_NAME="$name" node -p '
            const m = JSON.parse(require("fs").readFileSync(process.env.BUMP_MANIFEST, "utf8"));
            const hit = ["dependencies", "devDependencies", "optionalDependencies"]
              .map((s) => (m[s] || {})[process.env.BUMP_NAME])
              .find((v) => typeof v === "string");
            hit === undefined ? "" : hit')
          case "$current" in
            '') echo "$manifest declares no dependency on $name" >&2; exit 1 ;;
            [0-9]*) exact=true; prefix= ;;
            '^'[0-9]*) exact=false; prefix='^' ;;
            '~'[0-9]*) exact=false; prefix='~' ;;
            *) echo "refusing to bump $name: $manifest pins it as '$current', which is not an exact version, ^ or ~" >&2; exit 1 ;;
          esac
          # NO LOCKFILE REWRITE, in either direction. The install resolves against the
          # platform's own public names and writes them into `resolved` as it finds them;
          # environment rather than a file, because a committed project .npmrc outranks
          # ~/.npmrc and `npm_config_*` outranks both.
          ( cd "$dir" \
            && env npm_config_registry="$mirror_origin/npm/npmjs/" \
                   "npm_config_@qits:registry=$registry_origin/artifacts/npm/npm/" \
                   npm install --package-lock-only --no-audit --no-fund \
                     "--save-exact=$exact" "--save-prefix=$prefix" "$name@$to" )
          # EVERY ORIGIN IN THE LOCK IS THE PLATFORM'S, OR THE BUMP FAILS. A lock still on
          # an old placeholder (`http://localhost:8081`) or naming any other host keeps
          # those entries across the install, and committing it would push a lockfile no
          # step can install from. It is a migration the repository owes, so it is said
          # here, with the entries named, rather than papered over by a rewrite.
          foreign=$(grep -o '"resolved": *"[^"]*"' "$lock" \
            | sed -e 's/^"resolved": *"//' -e 's/"$//' \
            | awk -v r="$registry_origin/" -v m="$mirror_origin/" \
                'index($0, r) != 1 && index($0, m) != 1' \
            | head -n 5)
          if [ -n "$foreign" ]; then
            echo "$lock resolves packages outside $registry_origin and $mirror_origin, for example:" >&2
            printf '  %s\n' $foreign >&2
            echo "regenerate the lockfile against those two registries before this dependency can be bumped" >&2
            exit 1
          fi
          git add -- "$manifest" "$lock"
        elif [ "$ecosystem" = "docker" ]; then
          # Which line holds the pin - see the two programs above. Anything that is not
          # an `arg:` location is a FROM, which is what every other docker pin is.
          case "$location" in
            arg:*)
              # The argument's name reaches an awk -v AND is interpolated into that
              # program's own regex, so it is held to what docker allows a build
              # argument to be called and refused otherwise - a name with a `.` or a `*`
              # in it would be a pattern rather than a name.
              argument=${location#arg:}
              case "$argument" in
                ''|[0-9]*|*[!0-9A-Za-z_]*)
                  echo "refusing an implausible build argument: $argument" >&2
                  exit 1
                  ;;
              esac
              awk -v arg="$argument" -v img="$name" -v to="$to" \
                  -f /tmp/bump-arg.awk "$manifest" > /tmp/bump-edited
              ;;
            *)
              awk -v img="$name" -v to="$to" -f /tmp/bump-from.awk "$manifest" > /tmp/bump-edited
              ;;
          esac
          mv /tmp/bump-edited "$manifest"
          git add -- "$manifest"
        elif [ "$ecosystem" = "gitlink" ]; then
          # The submodule move, and it is an INDEX write rather than a file edit: a
          # gitlink is a 160000 entry in the tree and there is no text anywhere that
          # holds the sha. `.gitmodules` names the sibling and never its version.
          #
          # The name reaches a URL, so it is held to a repository name and nothing
          # else - a slash here would build a clone url pointing somewhere else on the
          # host, and `@` and `.` sequences are how you leave a path at all.
          case "$name" in
            ''|*[!0-9A-Za-z._-]*) echo "refusing an implausible submodule: $name" >&2; exit 1 ;;
          esac
          # The sibling is derived from OUR OWN clone url, which is the same derivation
          # the `ci-event-upstream-frontend.yml` hop files and `ci-event-build.yml` make:
          # every repository of a project is a sibling path under one host, and the url
          # this run was given is the only address that is certainly reachable from here.
          sibling="${QITS_CI_REPOSITORY_URL%/*}/$name"
          if ! git fetch -q "$sibling" "refs/tags/$to"; then
            echo "no tag $to in $sibling" >&2
            exit 1
          fi
          # Peeled: a release tag may be annotated, and the index entry has to be the
          # commit it points at rather than the tag object.
          sha=$(git rev-parse --verify "FETCH_HEAD^{commit}")
          # --add because the entry may be absent from a tree built off baseRef, and
          # --cacheinfo because there is nothing on disk to add: the mode says gitlink.
          git update-index --add --cacheinfo "160000,$sha,$manifest"
        else
          echo "unknown ecosystem for this step: $ecosystem" >&2
          exit 1
        fi
        applied=$((applied + 1))
        echo "- $ecosystem $name $from -> $to ($manifest)" >> /tmp/bump-body.txt
        echo "bumped $name to $to in $manifest"
      done 3< /tmp/bump-node.tsv

      # --- commit and push ---------------------------------------------------------
      # --ignore-submodules=none IS LOAD-BEARING, and leaving it out is how the gitlink arm
      # shipped dead on 2026-09-01 and stayed dead. Every service's `.gitmodules` carries
      # `ignore = all` on its webui submodule so that the expected drift between a pin and
      # the branch it follows stays out of `git status` and `git diff` - and that suppression
      # reaches `git diff --cached` too. So this guard compared an index holding a freshly
      # staged 160000 entry against HEAD, was told there was nothing there, and exited 0:
      # the step reported success, the branch never moved, and this service read that as
      # NOTHING_TO_DO. Fifteen services' SPAs stopped being picked up with no error anywhere.
      #
      # The flag re-enables submodule comparison FOR THIS ONE COMMAND and nothing else.
      # Ordinary files are unaffected, and because the comparison is `--cached` - index
      # against HEAD, never the working tree - a submodule checked out at some other commit
      # still counts for nothing. Only a gitlink this step deliberately staged is seen,
      # which is exactly the change it is trying not to lose.
      if git diff --cached --quiet --ignore-submodules=none; then
        # A REBUILD STILL HAS TO MOVE THE BRANCH, even when the base already carries every pin
        # this bump would have written and this step has nothing to add on top. Nothing-to-commit
        # is ordinarily silence - the maven step takes exactly this branch above with no push at
        # all - but silence here is this bump's LAST word: if neither step pushes, the stale
        # branch is left naming replaceHead forever, still conflicting with the base it was
        # supposed to move onto. So when `$lease` is set - REBUILD was decided and nothing earlier
        # rebuilt it - push the commit this step started from. No new commit, the same lease on
        # replaceHead a rebuild that did write something would use, so a branch that moved since
        # is refused exactly as it would be otherwise.
        if [ -n "$lease" ]; then
          if ! git push "$lease" "$QITS_CI_REPOSITORY_URL" "$start:refs/heads/$branch"; then
            echo "push to $branch was rejected - the branch is not what we built on" >&2
            exit 1
          fi
          echo "rebuilt $branch on $base with nothing to commit"
          exit 0
        fi
        echo "every npm, docker and gitlink change in this bump is already the pin - nothing to commit"
        exit 0
      fi
      {
        printf 'bump(%s): %d dependencies\n\n' "$group" "$applied"
        cat /tmp/bump-body.txt
      } > /tmp/bump-message.txt
      git -c user.name="qits maintenance" -c user.email="maintenance@qits.local" \
          commit -q -F /tmp/bump-message.txt
      # NEVER a bare --force, and a rebuild under its lease, for the reasons the maven
      # step states.
      if ! git push ${lease:+"$lease"} "$QITS_CI_REPOSITORY_URL" "HEAD:refs/heads/$branch"; then
        echo "push to $branch was rejected - the branch is not what we built on" >&2
        exit 1
      fi
