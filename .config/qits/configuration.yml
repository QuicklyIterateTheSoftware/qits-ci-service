# What qits-ci declares about its own configuration.
#
# The deployer reads this file from the git host at the RELEASED TAG, beside
# `.config/qits/deployments.yml`, and POSTs it to qits-configuration before it schedules the
# deployment. qits-configuration parses it with its own `DeclarationParser`; nothing in qits-ci
# reads it. The name does not start with `ci-event-`, so the trigger engine never takes it for a
# pipeline.
#
# WHY IT EXISTS. qits-configuration flags a stored entry `orphaned` only when the application has a
# declaration that does not list the key. With no file, none of qits-ci's leftover entries can be
# flagged, so none can be removed from the configuration UI. With it, every stored qits-ci entry not
# listed below shows as orphaned — and those are exactly the keys nothing reads any more
# (service-client-identity-plan.md, C9 and C10).
#
# SO THE LIST MUST BE COMPLETE. Every key below is read by qits-ci today, checked against the code.
# A key left out would show as orphaned and invite a person to delete a value the service needs.
#
# NO DEFAULTS, ON PURPOSE. A declared default sits UNDER the stored entries, and a key declared with
# no default adds nothing to the resolved read. So this file changes nothing a container receives:
# it is step one of the two-step rule (docs guide §7.5), and provably inert.
#
# NO serviceAddress. The URLs are `string` here. A serviceAddress is rendered by the platform and
# ignores a stored value, so declaring one would replace every hand-set address on this platform in
# the same step. That change belongs to the config-declarations work, one application at a time.
#
# THE FOUR `QUARKUS_OIDC_CLIENT_*` KEYS WITH NO CLIENT NAME are the `qits` client's fallback
# (application.properties reads `${QITS_RESOURCE_IDP_*:${QUARKUS_OIDC_CLIENT_*}}`). They stay
# declared until qits-ci's `idp:client` cutover (plan C5) retires that fallback. Note
# `QUARKUS_OIDC_CLIENT_CLIENT_ENABLED` has no QITS_RESOURCE_IDP_* twin and the shipped value behind
# it is `false`: deleting it turns the client off, cutover or not.
#
# DELIBERATELY NOT HERE (these show as orphaned):
#   * QUARKUS_OIDC_CLIENT_GRANT_OPTIONS_CLIENT_AUDIENCE — the old unnamed client's audience. The
#     `qits` client's audience is the constant `qits-platform`.
#   * QUARKUS_OIDC_CLIENT_GITHOST_* (five keys) — the old `githost` client. There is no such client:
#     `application.properties` ships one named block, `qits`, and nothing binds these.
#   * QITS_CI_CONTAINER_GIT_AUDIENCE — a step container's Git helper asks the idp for nothing; it
#     presents the run's ci-run token.
#   * QITS_CONTAINERS_URL and QITS_CI_CONCURRENT_BUILDS — the in-process executor's two keys, gone
#     with it (qits-506): qits-ci asks no qits-containers for a step container and runs no claim
#     loop of its own. Every run is a runner's, the platform host's `localhost` runner included.
#   * QITS_CI_REGISTRY_AUTH_CLIENT_ID / _SECRET — the old static push credential, replaced by one
#     commissioned per run.
#   * The internal step-address plane's keys, gone with it (qits-515): QITS_CI_CONTAINER_GIT_URL,
#     QITS_CI_CONTAINER_DAEMON_URL, QITS_CI_NETWORK, QITS_CI_DOCKER_AUTH_HOSTS,
#     QITS_CI_BUILDKIT_ENABLED, QITS_CI_BUILDKIT_REGISTRY_HOST, QITS_CI_WORKSPACES_URL,
#     QITS_CI_DAEMON_BINARY_URL_TEMPLATE, QITS_ARTIFACTS_NPM_HOSTED_URL, QITS_ARTIFACTS_DOCS_URL,
#     QITS_MIRROR_MAVEN_CENTRAL_BUILD_URL, QITS_MIRROR_MAVEN_CENTRAL_STEP_URL,
#     QITS_CI_RUNNER_INTERNAL_URL and QITS_CI_RUNNER_ARTIFACTS_INTERNAL_URL. Each spelled a qits-net
#     address for a step or a runner; both are told public names composed from QITS_DOMAIN now.
#   * QITS_DOMAIN and QITS_ENVIRONMENT — written into every container by the deployer, like
#     QITS_RESOURCE_*. QITS_DOMAIN is what every address a runner and a step are told is composed
#     from; without it qits-ci hands out none and launches no step.
#   * QITS_RESOURCE_* — injected by the deployer from its resource registry. Configuration cannot
#     state or delete one.
#
# `OwnDeclarationTest` (service module) checks what a hand edit can break: the file is here, the
# top level is `keys:` alone, and no key is declared twice. It is not a parser; the store is.

keys:
  # --- where this service's peers answer ---------------------------------------------------------

  env.QITS_CI_PROJECTS_URL:
    type: string
    description: "Where qits-projects answers. Its repository catalogue is the list an event can trigger. Scheme, host and port only; unset, ci lists the git host's storage ids instead."

  env.QITS_CI_GIT_HOST_URL:
    type: string
    description: "Where the git host answers; ci reads pipeline config from it. Scheme, host and port only; ci adds /git itself."

  env.QITS_EVENTS_URL:
    type: string
    description: "The event bus this service publishes to and consumes from."

  env.QITS_OBSERVABILITY_URL:
    type: string
    description: "Where this service's OTLP telemetry goes. Scheme, host and port only."

  # --- step containers ---------------------------------------------------------------------------

  env.QITS_CI_MEMORY_LIMIT:
    type: string
    description: "Memory cap for one step container, with its unit (for example 4g). A runner row's own step memory limit replaces it for that runner's steps."

  env.QITS_CI_CPUS:
    type: number
    description: "CPU cap for one step container, as docker's --cpus reads it."

  # The version itself is NOT configuration any more: it is the version of the pinned dependency
  # eu.wohlben.qits:qits-ci-daemon-protocol, whose release also published the binary. This entry is
  # the emergency hatch and is expected to stay blank — set, it runs a binary no release request of
  # qits-ci has run against this host.
  #
  # It is a RENAME of env.QITS_CI_DAEMON_VERSION, and the rename is the mechanism rather than
  # tidiness: nothing on this platform deletes a configuration entry (qits-configuration reports an
  # orphan and never cleans it up, and DELETE …/entries/{key} needs qits:admin or qits:system), and
  # the standing platform still holds QITS_CI_DAEMON_VERSION carrying a sha256 digest qits-bootstrap
  # wrote. Reading a different name is what makes that residue stop deciding without deleting
  # anything. It also gives the hatch a name no automation has ever written, so a value in it was
  # put there by a person. The service WARNs once at boot about the old entry and never refuses.
  env.QITS_CI_DAEMON_VERSION_OVERRIDE:
    type: string
    description: "Emergency override for the qits-ci-daemon version. Blank (the expected state) uses the version of the protocol dependency qits-ci is built against."

  # --- the artifacts store, as this service itself names and reaches it ----------------------------

  env.QITS_ARTIFACTS_REGISTRY_HOST:
    type: string
    description: "The registry host a run's pinned step image is addressed under, and by which a platform image is recognised. Not handed to a step: a step is told the registry's public name."

  env.QITS_ARTIFACTS_MAVEN_REGISTRY_URL:
    type: string
    description: "The hosted Maven repository as qits-ci reaches it. Its scheme and authority are where qits-ci asks the registry for a step image's digest. Not handed to a step."

  # --- the qits CLI a release-phase step downloads ---------------------------------------------------

  env.QITS_CI_ARTIFACTS_CLI_PACKAGE:
    type: string
    description: "The daemon package a release-phase step downloads the qits CLI from. The package only — the version is a pinned dependency of qits-ci, not configuration. Blank turns the fetch off."

  env.QITS_CI_ARTIFACTS_CLI_VERSION_OVERRIDE:
    type: string
    description: "Emergency door: the qits CLI version every release-phase step downloads, overriding qits-ci's own pin. Normally UNSET — the real mechanism is the qits-platform-access-cli-binary dependency in qits-ci's pom, which this repository's release request gates. Setting this runs a CLI nothing gated."

  # --- what arrives here: the inbound identity -----------------------------------------------------

  env.QITS_AUTH_MACHINE_REQUIRED:
    type: boolean
    description: "The machine gate. Off, there is no OIDC tenant and no bearer is checked; on, a machine token is validated."

  env.QITS_AUTH_MACHINE_AUDIENCE:
    type: string
    description: "The audience a machine token arriving here must carry. It is the platform's one audience, qits-platform, and a deployment has no reason to say otherwise."

  env.QUARKUS_OIDC_AUTH_SERVER_URL:
    type: string
    description: "The issuer whose keys validate the bearers that arrive here."

  # --- what goes out: the `qits` client's fallback, until the idp:client cutover -------------------

  env.QUARKUS_OIDC_CLIENT_CLIENT_ENABLED:
    type: boolean
    description: "Turns the qits client on; its only switch. Off, nothing is commissioned and peer calls carry no bearer."

  env.QUARKUS_OIDC_CLIENT_AUTH_SERVER_URL:
    type: string
    description: "The idp the qits client gets tokens from. Read only when QITS_RESOURCE_IDP_URL is unset."

  env.QUARKUS_OIDC_CLIENT_CLIENT_ID:
    type: string
    description: "This service's idp client id. Read only when QITS_RESOURCE_IDP_CLIENT_ID is unset."

  env.QUARKUS_OIDC_CLIENT_CREDENTIALS_SECRET:
    type: string
    description: "A secret: the qits client's secret. Read only when QITS_RESOURCE_IDP_CLIENT_SECRET is unset."
