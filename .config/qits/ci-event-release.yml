# The release pipeline: this repository reacts to its OWN release and pushes the image under the
# released VERSION.
#
# THE SELECTION NAMES THIS REPOSITORY, WHICH READS LIKE A LOOP AND IS NOT. `SCMRelease` says only
# "source control has this version" — qits-projects publishes it the instant the release tag is
# created, and nothing in this file publishes it. So a repository listening for its own SCMRelease
# is exactly the release pipeline the split-release design asks each repository to own: the SCM half
# fires, this half builds the tagged commit and pushes it, and qits-ci turns the green run into one
# `SoftwareRelease` per entry under `artifacts:` below. The event that could loop is
# SoftwareRelease, and this file neither listens for it nor publishes it.
#
# THE VERSION TAG IS THE ONLY COORDINATE NOW, AND IT USED TO BE THE SECOND OF TWO. This file read
# `:$QITS_CI_SHA` at the push below for as long as there was a per-push image beside it — the sha
# coordinate was the contract with qits-deployments, and this pipeline pushed the released tree
# under it a second time so the two would never disagree. Both halves of that are gone: per-push CI
# is retired (ci-event-build.yml and ci-event-userflows.yml are one QA pipeline that publishes no
# image at all), and cd deploys a RELEASE rather than a green push. So the push below tags
# `$version` — the CalVer name the release was made under, which is what `artifacts:` declares and
# what every consumer of the resulting `SoftwareRelease` asks for. A sha coordinate nothing
# publishes and nothing deploys was a tag pointing at an image no reader could name.
#
# `artifacts:` IS A DECLARATION, NOT A REPORT. qits-ci never learns how to publish anything, so it
# cannot see what the step below pushed; it announces `{repository, version, packageType,
# packageName}` on the strength of these two lines. Keep them true.
#
# THE NAME IS UNQUALIFIED ON PURPOSE. No registry-qualified reference is portable here — the
# registry is one service under several addresses (`$QITS_BUILD_REGISTRY` to the platform builder,
# `$QITS_REGISTRY` to the host daemon and qits-deployments) — and an OCI reference cannot carry
# a path prefix. So the declaration carries
# `qits/<application>` and the reader supplies its own host, exactly as the push below composes one
# from environment.
#
# THE BUILD BELOW IS THE QA PIPELINE'S, AND THE TWO MUST STAY MATCHED — byte for byte in every
# buildctl argument, because the platform builder's cache is shared and a matched build is what
# makes a release that follows a green fold a stack of cache hits rather than a second native
# compile. It used to be ci-post-receive.yml's, then ci-event-build.yml's; both are retired and the
# sibling that carries the same two halves is now ci-event-release-request.yml's gating step, which
# builds the fold and exports nothing. That file is where the submodule fetch, the lockfile origin
# swap, the `npm_config_*` environment and the whole builder arrangement (`build: true` as the
# declaration that grants $BUILDKIT_HOST without a socket, the file-form secrets, why there is no
# `--network host` any more) are explained at length; this one carries the short form and points
# there rather than keeping a second copy of the reasoning to drift.
#
# THIS REPOSITORY IS ALSO THE ENGINE. A green run here ends by replacing the process that ran it,
# and it is this process that turns the run into `SoftwareRelease` — the announcement is made at the
# run's finish, before cd swaps anything, so the event is published by the instance that built it.
# What a redeploy does interrupt is any other build still RUNNING, which is the ordinary reason this
# repository is deployed with the queue quiet.
#
# THE CHECKOUT IS THE TAG, AND FOR A LONG TIME THERE COULD NOT BE ONE. This file used to carry a
# warning that it must declare no `checkout:`, and the warning was right about its reason and wrong
# about its conclusion. The reason: the event's `branch` is the release request's BACKING BRANCH
# (`release/<id>`), and qits-projects deletes it — along with the request's source branches — in the
# same operation that creates the tag, so `checkout: { branch: branch, ... }` would clone a ref that
# no longer exists and fail every release. The version, never the branch, is what this file builds
# from. What followed from that was a trigger with no checkout at all: the run was recorded at `main`,
# the step container cloned `main`, and the tag fetch below supplied the released tree — so every
# release run of every repository on the platform displayed as `main@<head>`, a run recorded against
# a commit it did not build, while the thing it actually built was named only inside a step script.
#
# WHAT CHANGED IS THE EVENT, NOT THE ENGINE. `SCMRelease` now carries `commitSha` — the commit the tag
# points at, which qits-projects knew all along and did not say. With it the event finally names a
# checkoutable pair, and it is spelled below as the ordinary two dot-paths every other `checkout:` is:
#
#   branch: version    -> the tag's own name. `branch` is what the run row calls its REF, and a tag is
#                         a ref: the daemon's clone is `git clone --branch "$QITS_CI_BRANCH"`, which
#                         resolves a tag exactly as it resolves a head (measured against this
#                         platform's git host, which advertises tags over smart-HTTP). qits-ci learned
#                         nothing about tags to make this work, and must not — a ref name is a ref
#                         name, and any event carrying one plus a sha can do the same.
#   sha: commitSha     -> what `git checkout --detach` then lands on, which for an annotated tag is
#                         the peeled commit either way.
#
# `optional: true` IS THE TRANSITION, AND IT IS NOT DECORATION. `commitSha` is additive, so an
# `SCMRelease` published before it existed — a replay out of the durable log, an older publisher, a
# rolled-back qits-projects — carries no such key. Without this flag, a declared `checkout:` whose
# paths resolve to nothing costs the file its run, which is the right answer for a push pipeline and
# a catastrophic one here: a release would be tagged and its image would silently never be published.
# With it, such an event is built the old way — recorded at `main`'s head, with the tag fetch below
# supplying the tree — which is byte-for-byte what this file did before this paragraph existed. That
# is also why the fetch below STAYS: it is the whole of the fallback path, and a harmless no-op on the
# anchored one.
#
# THIS FILE PREDATES ITS PUBLISHER, and it landed first on purpose: a trigger file must be in place
# before the event it selects exists, or the first release is lost and looks like a train that
# quietly did not roll. (The bus is durable now — a claim ledger and a catch-up sweep — so the window
# is narrower than it was, but a file that is not there when the frame arrives still selects
# nothing.)
event: SCMRelease
when:
  - repository: { exact: qits-ci-service }
checkout:
  branch: version       # the tag's name — a ref the daemon's `clone --branch` resolves
  sha: commitSha        # what it points at; absent on any release published before the field existed
  optional: true        # ...and then this run is main's head, exactly as it was before the checkout
artifacts:
  - { type: docker, name: qits/qits-ci }
  - { type: docs, name: "@apidocs/qits-ci" }
steps:
    # node-docker-base, the image the QA pipeline's gating step also uses: node, npm and git for half one,
    # buildctl for half two — and node is also what reads the event payload, which is JSON. The
    # image still carries a docker CLI; nothing below dials a socket, and this step is not handed
    # one.
    #
    # `build: true` IS THE DECLARATION, and it is `docker: true` minus the root-equivalence: the
    # same per-step, diff-visible opt-in the platform keys the commissioned credential, the registry
    # auth document and $QITS_BUILD_REGISTRY on, plus the $BUILDKIT_HOST qits-containers injects —
    # and no /var/run/docker.sock. qits-buildkit-plan.md in the wrapper is the whole migration and
    # qits-workspace-daemon's pipeline pair is the converted exemplar.
  - image: qits/build-images/node-docker-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed buildctl call is
      # swallowed: a later line runs as if the image existed and the run reports SUCCESS — and a
      # green release run is what makes qits-ci announce the artifact. -u makes an unset injected
      # variable stop the step too, rather than composing a push ref out of empty strings.
      set -eu

      # The platform builder, demanded loudly before anything is built. Unset means a
      # qits-ci/qits-containers pair too old to inject it; EMPTY means the kill switch
      # (qits.ci.buildkit.enabled=false spells off as empty-never-absent). Either way this recipe
      # must fail here, naming the cause, rather than publish through some other path — a silent
      # fallback is exactly what the migration exists to remove.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"
      : "${QITS_BUILD_REGISTRY:?}"

      # THE EVENT, READ AS DATA. The payload reaches the container verbatim as one string in
      # $QITS_EVENT_PAYLOAD; there is no per-field projection.
      version=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).version')
      # The version reaches a `sed` s### expression below, and `#` is that expression's own
      # delimiter — a version carrying one closes it, and GNU sed's `e` command then runs a shell.
      # Refused rather than quoted: a version here is a calver or a semver, and nothing legitimate
      # needs a character outside this set. The existence check further down happens to reject a `#`
      # too (curl truncates a url at a fragment), but that is an accident of curl, not a guard.
      case "$version" in
        ''|*[!0-9A-Za-z._+-]*) echo "refusing an implausible version: $version" >&2; exit 1 ;;
      esac
      echo "releasing qits/qits-ci:$version"

      # THE TAG IS THE CHECKOUT TARGET, AND THESE TWO LINES ARE NOW THE FALLBACK RATHER THAN THE
      # MECHANISM. With `checkout:` declared above, the daemon already cloned `--branch <version>` and
      # detached at `commitSha`, so this fetch finds the tag present and answers "up to date" and the
      # checkout is where HEAD already is: a measured no-op, two subsecond git invocations.
      #
      # THEY STAY BECAUSE THE ANCHOR IS NOT GUARANTEED. An `SCMRelease` carrying no `commitSha` — a
      # replay, an older publisher — takes the recipe's `optional: true` arm, and then the run really
      # is cloned at the head of main and everything about WHAT is built comes from right here. The
      # released commit is NOT on main at this moment (the flow tags the backing branch, deletes it,
      # deploys, and finalizes main afterwards) and the branch the event names is already gone, so
      # without this the fallback would build the wrong tree — the failure this file spent its whole
      # life avoiding. Removing them is a change to make when no untagged release event can arrive
      # any more, not before.
      #
      # The clone may carry no tags, hence the explicit refspec; the URL rather than `origin` because
      # every address a step needs arrives as environment. `checkout --detach` peels the annotated tag
      # to its commit — and it is what makes the submodule fetches below land on the gitlinks the
      # release recorded rather than on main's.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # --- half one: the bundle -----------------------------------------------------------------
      # Initialise the Angular client explicitly. See ci-event-release-request.yml for why the
      # lockfile origins are rewritten and why the registry is passed as environment, not as a file.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-ci-frontend"
      git -c submodule.qits-ci-frontend.url="$frontend_url" submodule update --init service/src/main/webui

      cd service/src/main/webui
      # TWO SERVICES since the byte-plane split, so the swap reads the PATH: an entry under the
      # hosted registry's own pathname ($QITS_NPM_REGISTRY_URL's, /artifacts/npm/npm/) gets the
      # hosted origin and everything else gets the proxy's, and the broad expression has to run
      # before the narrow one. ci-event-release-request.yml carries the full reasoning.
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      npm run build
      cd -

      # --- half two: the image ------------------------------------------------------------------
      # Same doctrine for the credential, in FILE form on both sides now: a secret, never a build
      # arg, because an arg is recorded in the history of a pullable image. The launcher injects the
      # run's commissioned idp client as $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET;
      # these two files are what the Dockerfile's mvnw RUN mounts under /run/secrets. /tmp is
      # outside the clone, so neither can enter the build context. The `env=` mount form is gone
      # from both sides because it needs a dockerfile frontend the BUILDER chooses, while a bare
      # file mount is served identically by every version. `${…:-}` keeps the no-commission arm
      # alive under `set -u`: two empty files, which the settings read exactly as they read unset.
      # ci-event-release-request.yml writes the same two files; keep them matched.
      umask 077
      printf '%s' "${QITS_COMMISSIONED_CLIENT_ID:-}" > /tmp/qits-client-id
      printf '%s' "${QITS_COMMISSIONED_CLIENT_SECRET:-}" > /tmp/qits-client-secret

      # NO `--network host`, AND NOTHING REPLACES IT. Every `RUN` executes in the platform builder's
      # own network namespace on qits-net, so both build-args carry IN-NETWORK routes:
      # $QITS_MAVEN_REGISTRY_URL for the platform's maven repository (the host-daemon spelling
      # `http://$QITS_REGISTRY/…` answers nothing from there) and $QITS_MAVEN_PROXY_URL for Maven
      # Central's pull-through, where the edge vhost $QITS_MAVEN_CENTRAL_MIRROR_URL names is on the
      # host loopback and unreachable from a build by design. Empty — mirror off, or an older
      # qits-ci — deactivates the settings profile and Central is resolved directly, as it always
      # was. The Dockerfile's `FROM` lines keep their committed edge-vhost spellings: the builder's
      # own registry config rewrites them to the platform aliases.
      #
      # `push=true` IS THE PUBLISH, and it replaces the build/push pair whole: the image goes from
      # the builder straight to the registry and never enters any local image store — which also
      # retires the note that stood here about `docker rmi` and the concurrent-build race that broke
      # the release of 2026-08-11. There is no store left for that race to happen in.
      # $QITS_BUILD_REGISTRY is the registry as the BUILDER resolves it; $QITS_REGISTRY stays the
      # host daemon's view and is not dialled from this step at all.
      ref="$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-ci:$version"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output "type=image,name=$ref,push=true"

      # --- the SBOM -----------------------------------------------------------------------------
      # THE DOCUMENT GOES UP AFTER THE PUSH AND BEFORE THIS STEP EXITS GREEN. qits-ci — this very
      # application — announces `SoftwareRelease` only for a green run, so ordering is the whole
      # guarantee: no consumer is ever told about a version whose bill of materials is missing. A
      # failed PUT fails the release ON PURPOSE — the store being down is not a reason to announce a
      # version nobody can audit. Only THIS pipeline uploads one: the QA pipeline announces no
      # release and publishes no image, so it owes no document.
      #
      # ONE DOCUMENT, TWO DECLARED ARTIFACTS. `artifacts:` above also declares the `@apidocs/qits-ci`
      # docs bundle, and that one gets no SBOM: it is a tar of one committed openapi.yml, built by
      # the block below rather than by Maven, with no dependency graph to describe. A CycloneDX
      # document for it would be a document about nothing.
      #
      # The second `buildctl build` reaches the Dockerfile's `sbom` stage — a `FROM scratch` holding
      # only the service module's CycloneDX document, exported with `type=local` instead of pushed.
      # Build-args and secrets are BYTE-IDENTICAL to the image build above, which is what makes
      # every layer a cache hit in the same builder and this export seconds rather than a second
      # native compile; a drift between the two invocations costs a full rebuild, not a wrong
      # document.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=sbom \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output type=local,dest=.sbom
      # The SBOM store is a sibling path of the npm registry inside the artifacts deployment, so its
      # root is DERIVED from $QITS_NPM_REGISTRY_URL — the qits-net alias a STEP container can reach.
      # NOT from $QITS_REGISTRY: that is the host daemon's view of the registry, and inside this
      # container it answers curl with an instant connection refusal (measured twice — on
      # qits-artifacts' 2026.902 heal release a push through the daemon succeeded while the same
      # host name was unreachable from in here, and the edge 401s a sessionless write besides).
      # Nothing in this step dials it any more: the image push above goes from the builder to
      # $QITS_BUILD_REGISTRY. The path names the DECLARED artifact identity verbatim: `artifacts:` above
      # says `{type: docker, name: qits/qits-ci}`, and (packageType, packageName, version) is how
      # the SoftwareRelease consumer will ask for it.
      sbom_base="${QITS_NPM_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @.sbom/sbom.json \
        "$sbom_base/docker/qits/qits-ci/-/$version"

      # --- the API document ---------------------------------------------------------------------
      # docs/openapi.yml is committed (OpenApiSchemaExportTest regenerates it), so publishing the
      # release's API surface is one tar and one PUT. The @apidocs scope is what the docs client
      # renders with swagger-ui; the file sits at the bundle root under the name that scope's
      # reader looks for first. Publish-if-absent: releases can replay and docs versions are
      # immutable, so 409 is success (qits-spa-ui-components' discipline).
      tar -czf apidocs.tgz -C docs openapi.yml
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @apidocs.tgz \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-ci" \
        "$QITS_DOCS_URL/@apidocs/qits-ci/-/$version")
      case "$status" in
        201) echo "published apidocs for qits-ci@$version" ;;
        409) echo "apidocs for qits-ci@$version already published — skipping" ;;
        *)   echo "apidocs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
