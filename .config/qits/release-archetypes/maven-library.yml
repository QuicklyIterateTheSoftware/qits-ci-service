# maven-library — the release cycle of a jar (or a reactor of jars) published to the platform's own
# Maven repository. Four repositories: qits-eventstream-javalib, qits-userflows-javalib,
# qits-registries-javalib and qits-integrations-quarkus-javalib.
#
# `release-request:` below is phase one (QA, on ReleaseRequestChanged) and `release:` is phase two
# (Publish, on SCMRelease). See java-service.yml's header for the full three-phase model — phase
# three (Deploy) is a consumer's deployment request off the `SoftwareRelease` a green phase two
# announces, and lives in no slot file, this one included.
#
# ---------------------------------------------------------------------------------------------
# WHAT A REPOSITORY DECLARES
#
#     # .config/qits/release.yml — single module
#     archetype: maven-library
#     artifacts:
#       - { type: maven, name: "eu.wohlben.qits:qits-eventstream", sbom: target/sbom.json }
#
#     # .config/qits/release.yml — a reactor, one entry per PUBLISHED module
#     archetype: maven-library
#     artifacts:
#       - { type: maven, name: "eu.wohlben.qits:qits-blobstore", path: blobstore, sbom: blobstore/target/sbom.json }
#       - { type: maven, name: "eu.wohlben.qits:qits-registries-common", path: common, sbom: common/target/sbom.json, link: [qits-blobstore] }
#       - { type: maven, name: "eu.wohlben.qits:qits-registries-npm", path: npm, sbom: npm/target/sbom.json, link: [qits-blobstore, qits-registries-common], publish: if-changed }
#
# The GAV is quoted because `:` after a space is a YAML mapping indicator. `artifacts:` must be in the
# repository's own file, never defaulted here: qits-projects reads it at the tag and an archetype
# default is invisible to it.
#
# - `path:` is the module's directory under the reactor root, `.` when absent — so a single-module
#   repository names none and a reactor names one per entry. The entry's `<path>/pom.xml` must BE
#   its GAV at the release version, or the publish fails naming both.
# - `sbom:` is `<path>/target/sbom.json`, which is where the release step's reactor-wide `makeBom`
#   writes it: the paths ARE the module list, and nothing here spells one.
# - `publish: if-changed` uploads the module only when its content — the jar's entries and its
#   SBOM's dependency graph — differs from the newest published version's. Otherwise the release
#   publishes nothing for it, qits-ci records `unchanged since <v>`, and no consumer is offered a
#   bump. It needs `sbom:`. `always` is the default.
#
# HOW A MODULE IS PUBLISHED. The pom uploaded is FLATTENED: no `<parent>`, every version resolved,
# and only external dependencies. A dependency on another module of the same reactor is BUNDLED into
# the jar — unless `link:` names it, and then that sibling stays an ordinary pom dependency at the
# version decided for it in this same release. Link a sibling that is itself declared here and that
# consumers take several of these jars at once with (qits-registries' blobstore and common), so
# nothing is bundled twice; a module only one jar uses is simply bundled.
#
# THE REACTOR PARENT IS NO LONGER PUBLISHED, and is not declared. A flattened pom names no parent,
# so an internal parent is nobody's dependency; versions published before this keep resolving,
# because their parents stay in the store.
#
# ---------------------------------------------------------------------------------------------
# WHAT THE PLATFORM ADDS, SO THAT THESE SCRIPTS DO NOT
#
# CiReleaseComposer wraps every step with `set -eu`, and every RELEASE step with the `$QITS_VERSION`
# guard, the tag fetch, `git checkout --detach` and the qits CLI on `$PATH`. On the release slot's
# LAST step — the only one here — it then PUBLISHES: one `qits artifacts publish maven` per declared
# entry, in `link:` order so a linked sibling is decided first, each uploading the module's jar and
# flattened pom with the run's own credential and its content hash. Then one `qits artifacts publish
# sbom submit` per entry carrying `sbom:` (an `if-changed` entry's only when it was published), and a
# check that each one arrived. So this script BUILDS and nothing else: nothing below deploys, holds a
# bearer, parses a version, fetches a tag or PUTs a document.
#
# ---------------------------------------------------------------------------------------------
# THE REPLAY GUARD THIS RECIPE ONCE GAVE UP IS THE CLI'S NOW
#
# The fleet's release steps probed the registry for each artifact's `.pom` and skipped the deploy
# when every one was already there — a replay guard for the rebootstrap case — and this recipe could
# not reproduce it, because nothing answered for a maven GAV. `qits artifacts publish maven` does:
# a re-run at a version already published with the same content answers `published <version>`
# without uploading, and other content at that version is a refusal rather than an overwrite. The
# makeBom and the SBOM submission run on every run either way.
#
# ---------------------------------------------------------------------------------------------
# WHEN TO OVERRIDE
#
# - `user: build` on the QA step is not optional where the suite starts zonky's embedded postgres:
#   initdb refuses to run as root and calls getpwuid, so the step needs a passwd-backed non-root
#   user, and a step container starts `--cap-drop=ALL` so `su` cannot switch from inside. maven-base
#   carries uid 1001. A repository whose suite needs root does not exist today; one that needs
#   different flags overrides `release-request:` (phase one) entirely.
# - A repository publishing something besides jars (qits-containers-service publishes two jars AND
#   an image) is not a maven-library — it is a java-service, whose release slot ends on a step that
#   packages every declared `type: maven` module, so its jars are `artifacts:` entries and need no
#   slot of its own (qits-890).

release-request:

  - image: qits/build-images/maven-base:latest
    user: build
    timeout-seconds: 1800
    script: |
      # The platform registry: the poms' default names a host-published address that is unreachable
      # from inside a step container, and the derived non-localhost address then needs the exact-id
      # mirror in .qits-maven-settings.xml to get past Maven's HTTP blocker. Both addresses are
      # code under the platform's public domain (qits-731): the hosted registry on registry.qits,
      # Maven Central through the mirror's public name; the composed prelude has already demanded
      # the domain. Exported because .qits-maven-settings.xml reads both as
      # ${env.QITS_MAVEN_REPOSITORY_URL} and ${env.QITS_MAVEN_CENTRAL_URL}.
      qits_domain=${QITS_DOMAIN:?this step was told no QITS_DOMAIN}
      export QITS_MAVEN_REPOSITORY_URL="https://registry.qits.$qits_domain/artifacts/maven/maven"
      export QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central"

      # THE COVERAGE AGENT (qits-754) — java-service.yml's QA verify block, byte for byte; read the
      # rationale there. In short: JaCoCo's runtime agent writes `.qits-reports/jacoco.exec` for the
      # composed report hook; it rides JAVA_TOOL_OPTIONS rather than `-DargLine`, because a pom
      # with a literal surefire `<argLine>` silently drops an agent added through the property;
      # `env` scopes it to this one mvnw; and a failed fetch is one line and a verify without
      # coverage, never a red step.
      jacoco_version=0.8.14
      jacoco_agent=/tmp/qits-jacoco/org.jacoco.agent-$jacoco_version-runtime.jar
      jacoco_url="$QITS_MAVEN_CENTRAL_URL/org/jacoco/org.jacoco.agent/$jacoco_version/org.jacoco.agent-$jacoco_version-runtime.jar"
      set --
      if [ -n "${QITS_TOKEN:-}" ]; then
        set -- "Authorization: Bearer $QITS_TOKEN"
      fi
      jacoco_options=""
      mkdir -p /tmp/qits-jacoco .qits-reports/pact-verification
      if curl -fsSL --retry 2 ${1:+-H} "$@" -o "$jacoco_agent" "$jacoco_url" 2>/dev/null \
        || wget -q ${1:+--header} "$@" -O "$jacoco_agent" "$jacoco_url" 2>/dev/null; then
        jacoco_options="-javaagent:$jacoco_agent=destfile=$PWD/.qits-reports/jacoco.exec,append=true,includes=eu.wohlben.*"
      else
        echo "coverage: could not fetch the JaCoCo $jacoco_version agent; this verify runs without coverage"
      fi

      # THE PACT VERIFICATION REPORT (qits-759). A system property, inert in every JVM this verify
      # starts that is not a Pact-JVM provider verifier — nothing here checks which JVMs those are,
      # because the property costs nothing in any other. It exists because of WHERE the knowledge
      # lives: the pacts a provider verifies are resolved from pinned consumer jars on its OWN test
      # classpath, so only the verifying JVM itself ever learns which ones, and that is the one fact
      # qits-ci cannot read from outside. Pact-JVM's provider verifier writes
      # `.qits-reports/pact-verification/*.json` when it sees these two properties and reads neither
      # any other way; the CLI's `contracts` report kind is what reads that directory back after the
      # step ends.
      #
      # SET WHETHER OR NOT THE COVERAGE AGENT'S FETCH ABOVE SUCCEEDED: it must not sit inside that
      # `if`/`else`, so it is composed as its own always-set part and JAVA_TOOL_OPTIONS below is
      # built from both parts rather than from one living inside the other's branch.
      pact_options="-Dpact.verification.reports=json -Dpact.verification.reportDir=$PWD/.qits-reports/pact-verification"

      env "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:+$JAVA_TOOL_OPTIONS }${jacoco_options:+$jacoco_options }$pact_options" \
        ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL"

release:

  - image: qits/build-images/maven-base:latest
    timeout-seconds: 1800
    script: |
      qits_domain=${QITS_DOMAIN:?this step was told no QITS_DOMAIN}
      export QITS_MAVEN_REPOSITORY_URL="https://registry.qits.$qits_domain/artifacts/maven/maven"
      export QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central"

      # THIS SCRIPT IS READ AT MAIN AND RUNS AGAINST THE TAG, which may predate a file it names. The
      # settings file arrived on 2026-08-11 and a bootstrap replaying an older tag measured the
      # miss. Guard on presence: a tree old enough to lack the mirror also predates the dependency
      # that needed it.
      settings=""
      if [ -f .qits-maven-settings.xml ]; then
        settings="-s .qits-maven-settings.xml"
      fi

      # BUILD EVERY MODULE, AND THE SBOM WITH IT. `package` leaves each module's `target/*.jar`,
      # which is what the platform's publish uploads and bundles from; nothing is deployed here. The
      # postlude's `qits artifacts publish maven` reads the jars after this script ends.
      # `-DskipTests`: the fold that gated this release already ran them.
      #
      # THE SBOM IS THE ARTIFACT'S RESOLVED DEPENDENCY TREE. `makeBom` runs at the reactor root with
      # no `-pl`, so every module writes its own `<module>/target/sbom.json` — which is why a
      # reactor needs no module list in this file and a single-module repository lands on plain
      # `target/sbom.json`. It runs IN THE SAME INVOCATION as `package`, and that is load-bearing
      # now that nothing is deployed first: a reactor sibling at the release version exists only in
      # this reactor, and a second maven invocation would look for it in the registry, where it is
      # not (yet, or at all — an unchanged module is never uploaded).
      #
      # Plugins are resolved through the repositories mvnw already resolves through, so the same
      # `$settings` mirror and repository property serve both goals. There is no second channel and
      # no address spelled here.
      ./mvnw -B -ntp $settings -DskipTests \
        package \
        org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom \
        -DoutputFormat=json -DoutputName=sbom -DschemaVersion=1.6 \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL"
