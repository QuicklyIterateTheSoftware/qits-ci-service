# The application config for qits-ci as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# a context ships DEFAULTS it does not own the deployment of. The `ci` module's own defaults (its
# datasource, Flyway lineage, sandbox caps, token) stay there; a deployment still overrides any of
# them by env.
#
# Everything here was previously supplied by the monorepo's app shell
# (service/src/main/resources/application.properties, monolith-only), which is why the suite carried
# a private copy in src/test/resources and the packaged app had none.

quarkus.application.name=qits-ci

# The prefix every MACHINE route of this service lives under: /<segment>/api, where the segment is
# the service name without the qits- prefix. The edge routes VERBATIM by prefix — /ci/* reaches
# qits-ci with the path untouched, on this service's own host and on every other one — so the
# service itself has to serve /ci/..., and there is no unprefixed form. This holds for
# service-to-service calls on qits-net too; they do not pass through the edge but they address the
# same paths. It is also what lets a browser page served here read /projects/api same-origin.
#
# The segment is spelled THREE times in this repository and nowhere else: here, in
# quarkus.http.non-application-root-path below, and in quarkus.quinoa.ignored-path-prefixes — plus
# `routes:` in .config/qits/deployments.yml, which is what tells the edge to path-route /ci here on
# every host. The client no longer spells it at all: it is served at `/`.
#
# The suite inherits this file rather than keeping its own copy, so a test run cannot be green about
# a prefix that never ships. Note the push path no longer depends on it at all: a push arrives as an
# SCMPublishCommit off the event log, not as a POST to an address another repository has to spell.
quarkus.rest.path=/ci/api

# Quarkus' non-application root — what the framework serves rather than application code. It sits
# OUTSIDE quarkus.rest.path, so it has to carry the segment on its own; left at / it would now sit
# under the client's ui root and be shadowed by the SPA fallback.
quarkus.http.non-application-root-path=/ci/q

# --- what goes on the wire ------------------------------------------------------------------------
# Compress responses. MEASURED before this key existed: one poll of GET /ci/api/runs/{runId} for a
# real multi-step run shipped 37 KiB with `Content-Encoding: identity`, and the run page re-reads
# that resource every three seconds for as long as the run is RUNNING. The read has no delta and no
# offset — every poll re-sends the full `output` of every completed step, each bounded at
# `qits.ci.output-max-chars=65536` — so the payload is step output, which is text, which is exactly
# what compresses. It costs one key and it is the only lever on this side; the server-side output
# offset that would make the resource small is still the named fast-follow, not a reason to ship the
# bytes uncompressed in the meantime.
#
# This is BUILD_AND_RUN_TIME_FIXED, so it has to be here rather than in a deployment's environment:
# QUARKUS_HTTP_ENABLE_COMPRESSION on a built artifact does nothing at all, quietly.
#
# quarkus.http.compress-media-types is deliberately LEFT UNSET. Quarkus 3.34.6's default list is
# text/html, text/plain, text/xml, text/css, text/javascript, application/javascript,
# application/json, application/graphql+json and application/xhtml+xml — read out of the extension's
# own config model, not remembered — which already covers both surfaces this service serves: the JSON
# API and the Angular client's html, css and javascript. Setting the key REPLACES that list rather
# than extending it, the same trap as ignored-path-prefixes above, so it is worth setting only for a
# media type genuinely outside it, and then the whole list must be spelled out again.
#
# Nothing is compressed for a client that did not ask: Vert.x negotiates on Accept-Encoding, so a
# caller sending none — every service-to-service caller here — gets the same identity bytes as
# before. Decompression of REQUEST bodies stays off; the only bodies arriving here are small intake
# POSTs, and enabling it would add an inflation path to a token-free surface for no gain.
quarkus.http.enable-compression=true

# --- the API document -------------------------------------------------------------------------
# Served at /ci/q/openapi, with the browsable UI at /ci/q/swagger-ui — both follow
# quarkus.http.non-application-root-path above (quarkus.swagger-ui.path is relative by default, so
# it moves along; do not pin it). always-include because swagger-ui is a dev-mode-only extension by
# default, and the point of packaging these as processes is that each documents its own surface in
# a real deployment.
quarkus.smallrye-openapi.info-title=qits-ci API
quarkus.swagger-ui.always-include=true

# --- the Angular client -------------------------------------------------------------------------
# Quinoa builds the `qits-spa-ci` submodule at service/src/main/webui — Quinoa's default
# `web-ui-dir` — and serves the result from the packaged artifact. A fresh clone therefore needs
# `git submodule update --init` before `./mvnw package`; without it Quinoa finds no package.json,
# quietly does nothing, and the app ships with no client.
#
# The SPA sits at the ROOT. This service has its own host — ci.<env>.<domain> — so the client is
# what that host answers with, and the /ci segment is left to the machine surface. The client's
# Angular baseHref in its angular.json is `/` to match: the browser resolves asset urls against the
# document, not against anything the server knows. Move this and move that.
quarkus.quinoa.ui-root-path=/

# Deep links (/runs/<id>, /<project>/<category>/<repo>/runs/<id>) are the client's routes, not this
# service's, so anything that is not a built file and not an ignored prefix is re-routed to
# index.html and Angular's router takes it from there. The fallback route is registered near-last,
# so it only ever sees what no earlier route took.
quarkus.quinoa.enable-spa-routing=true

# --- what the SPA fallback must NOT swallow -------------------------------------------------------
# The ui root is `/`, so the fallback sees EVERY path this service does not otherwise serve — the
# machine surface included. The key is therefore not optional here and never can be: with the client
# at the root there is no derivation that would cover it, because Quinoa derives its skip list from
# quarkus.rest.path and quarkus.http.non-application-root-path only, and both of those sit under /ci.
#
# The values are ABSOLUTE now. Quinoa strips ui-root-path before matching, and stripping `/` leaves
# the path as it is — so the entry is what the request actually spells. ONE entry does the whole job:
# a prefix match on /ci covers /ci/api (quarkus.rest.path), /ci/q
# (quarkus.http.non-application-root-path) and /ci/daemon (the @WebSocket literal in CiDaemonSocket),
# which are this service's whole machine surface. Add a root-level wire route and add its prefix
# here in the same commit; add one under /ci and there is nothing to do.
#
# What is at stake is a 404 rather than a 200 of text/html. MEASURED on the packaged fast-jar before
# this key existed: a plain GET (no Upgrade header) of /ci/daemon and /ci/daemon/nope each answered
# 200 text/html with the SPA's index.html — the socket route never claimed them and the fallback did.
# /ci/daemon is a cross-repo machine contract (the ci-daemon in every step container dials
# $QITS_CI_DAEMON_URL), and a machine client handed a web page parses it as data. The correct answer
# to a mistyped machine path is 404.
#
# Ignoring a prefix stops the SPA REROUTE; it does not unregister a route. The websocket upgrade on
# /ci/daemon still works, and CiPackagedSurfaceIT proves it on the packaged artifact.
quarkus.quinoa.ignored-path-prefixes=/ci

# Where `ng build` leaves its output, relative to the ui dir. Quinoa's Angular detection derives the
# same value from angular.json (no `outputPath` set, so `dist/<project>/browser`), but it is spelled
# out because it is a coupling to the client's PROJECT NAME rather than to its repo name — a rename
# inside angular.json would otherwise make Quinoa package an empty client with nothing to say so.
quarkus.quinoa.build-dir=dist/qits-spa-ci/browser

# --- where the git host is ------------------------------------------------------------------------
# The key defaults to qits-githost's edge host in the `ci` jar (qits-1414), so a deployment does not
# override it. It is named here because its shape is easy to get wrong:
#
#   qits.ci.git-host-url       Where the git host answers, and where ci reads pipeline config from.
#                              ci appends /git/<repoId> itself, so the value is scheme+host+port and
#                              NOTHING ELSE. qits-githost serves /git/** at the root — it is its own
#                              gateway segment now, where it used to borrow /artifacts from
#                              qits-artifacts. A value carrying the old /artifacts segment 404s every
#                              read, and a 404 on the blob reads as "this commit declares no
#                              pipeline": every push would report no pipeline rather than an error.
#
# A lease's daemon does not use it: its warm mirror is fetched from the git host's public name, which
# targethost/CiSlotAddresses composes from QITS_DOMAIN.

# --- machine identity ----------------------------------------------------------------------------
# The other identity track (qits-integrations-quarkus/README.md). Users arrive through the gateway as
# a header; MACHINES arrive as a bearer token minted by qits-idp.
#
# Which tokens are this service's own is not stated here. `qits-platform` is THE audience on this
# platform — qits-idp puts it on every token it mints, whatever the client asked for — and the guard
# (qits-integrations-quarkus' MachineAuth) reads it from its own shipped
# `qits.auth.machine.platform-audience`. It is not a deployment fact: a service that accepted tokens
# addressed elsewhere would be broken, not configured differently. What a caller may do once it is
# in is decided by its ROLES; the audience only says the token was meant for us.

# The rollout gate is ON wherever the deployer runs this service, and OFF for clone-alone tests and
# local development — the same split qits-githost ships. Off, every guard in the code returns at once
# and the endpoints behave exactly as they did before qits-idp existed — network trust, no bearer
# needed. It used to be switched on by the deployer extra QITS_AUTH_MACHINE_REQUIRED=true; that is a
# property of the image, so it ships here (qits-1391). A deployment can still turn it off by env.
qits.auth.machine.required=true
%dev.qits.auth.machine.required=false
%test.qits.auth.machine.required=false
#
# Bearer VALIDATION follows that gate rather than standing on its own, which is what lets this
# service ship its enforcement code first: with the gate off there is no OIDC tenant, so nothing
# fetches a JWKS, nothing waits on a host named qits-idp, and a clone-alone `./mvnw verify`
# needs no issuer at all. There is no third state — either the gate and the validation are both on,
# or both off. Same shape in qits-cd and qits-artifacts.
quarkus.oidc.tenant-enabled=${qits.auth.machine.required:false}

# Everything below describes the tenant when it exists. Bearer-only: this service starts no login
# flow and holds no session — a request with no Authorization header is not challenged, it falls
# through to forward-auth and stays user traffic.
#
# THE IDP IS DIALLED AT ITS EDGE HOST (qits-1414, feature qits-1406): https://idp.qits.<domain>/idp,
# the same address from every network, never the <env>-qits-idp wire alias, and no environment label
# — the platform project has none (see targethost/RunnerAddresses for the same derivation of what a
# runner is told). The discovery and key fetches are anonymous, which the edge lets through.
# QITS_DOMAIN is injected into every container by qits-deployments and carries NO default: a process
# without it refuses to start rather than verify tokens against a guessed domain. %dev and %test keep
# the old qits-net name; the suites blank the address anyway (testdb/HermeticConfigSource).
#
# MOVING THIS LINE DOES NOT MOVE THE ISSUER. This value is where the discovery document is READ;
# the issuer `iss` is checked against is the one that document publishes, and it is declared in no
# file and no variable. Point this at the same idp under another address and a token that validated
# before validates after.
#
# IT DOES NOT TAKE EFFECT WHILE THE DEPLOYMENT STILL CARRIES THE ENTRY. A live
# QUARKUS_OIDC_AUTH_SERVER_URL in qits-configuration reaches the process as an environment variable at
# ordinal 300 and this file is 250, so the entry OUTRANKS the derivation and keeps deciding the
# address. Deleting that entry is its own step of the rollout; this line does not accomplish it, and
# DerivedEnvironmentAddressTest pins both arms so that the ordering cannot be misremembered.
quarkus.oidc.auth-server-url=https://idp.qits.${QITS_DOMAIN}/idp
%dev.quarkus.oidc.auth-server-url=http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp
%test.quarkus.oidc.auth-server-url=http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp
quarkus.oidc.application-type=service

# Discovery ON (the default; ticket qits-708, the qits-1149 pattern). The tenant reads
# <auth-server-url>/.well-known/openid-configuration and takes two things from it: the JWKS address
# (its jwks_uri, whichever address qits-idp names there) and the ISSUER every token's `iss` is checked against, which the idp
# publishes as https://idp.qits.<domain>. A token signed by a published key but carrying any other
# `iss` is a 401. There is deliberately NO quarkus.oidc.token.issuer line and no issuer key of any
# kind (owner decision, qits-730): the issuer is never configuration, discovery is the pin. The pact
# pacts/qits-ci-service_qits-idp-service.json binds both reads, the issuer by value.

# What quarkus-oidc accepts in `aud`, and it is the one platform audience and nothing else. qits-idp
# puts qits-platform on every token it mints, whatever the client asked for, so this admits every
# machine caller there is while a token minted for some other platform is refused at validation
# rather than by a guard. A person's `qits` CLI token carries it too and gets in on the same line;
# its roles, not its audience, decide what it may do.
quarkus.oidc.token.audience=qits-platform

# Retry the boot-time discovery and JWKS fetch rather than falling straight back to lazy. Without
# this there is ONE attempt: it fails to a WARN ("an attempt to connect will be made during the
# first request"), and the first request carrying a bearer pays for it — a 500 if the idp is still
# unreachable.
# On a cold boot this service races idp's own start and loses; the SCMRelease trigger the bootstrap
# sends is exactly such a request, and it 500'd for that reason. 30S is fifteen tries, two seconds
# apart, which covers idp coming up beside this service in the same compose.
#
# NOT a hard dependency: when the window expires the same WARN is logged and startup continues. And
# readiness deliberately stays independent of the issuer — quarkus.oidc.health.enabled is BUILD_TIME
# and cannot follow the runtime gate above, so enabling it would report every gate-off deployment
# NOT READY for good.
quarkus.oidc.connection-delay=30S


# How fast a ROTATED idp key is picked up. The signing key lives in idp's database, so a redeploy
# keeps it — rotation is an operator retiring a key, or an idp landing on an empty database. Until
# then this service holds the OLD key set, and an unknown `kid` buys ONE JWKS refresh: the default
# 10M is the minimum before the next, so one attempt that lands mid-cutover means ten minutes of
# 401s for every caller. PT5S ends that seconds after idp answers, at one fetch per five seconds.
quarkus.oidc.token.forced-jwk-refresh-interval=PT5S

# --- the token this service PRESENTS ---------------------------------------------------------------
# ONE named client, `qits` (epic qits-540 dossier, 'Plan (as of 2026-09-13)', C4), carries every
# outbound identity this service has: the bearer sent to qits-githost, and the Basic pair
# IdpCommissioner presents to commission a per-run credential. IdpCommissioner reads its id and
# secret directly for the Basic call it makes.
#
# Its id, secret and idp address are this application's own qits-idp service client, and they come
# from the deployer and nowhere else. .config/qits/deployments.yml declares `resources: idp:client`,
# so qits-deployments provisions the client (id `<env>-qits-ci`, roles fixed in qits-idp code),
# stores its secret the way it stores a database password, and injects QITS_RESOURCE_IDP_URL,
# QITS_RESOURCE_IDP_CLIENT_ID and QITS_RESOURCE_IDP_CLIENT_SECRET into every container it starts
# (epic qits-540 dossier, 'Plan (as of 2026-09-13)', C3/C5). No configuration entry names any of
# the three. Reference the raw env names inside `${…}`, never a dotted key: QITS_RESOURCE_* has no
# dotted twin anywhere, and the env lookup is what reads the environment source directly.
#
# The defaults are what the deployer would inject: the idp's edge host, like the tenant's address
# above (qits-1414; no default for QITS_DOMAIN, so a process without it refuses to start), and the
# client id `dev-qits-ci`. They only decide anything where no deployer started the process, and
# there the secret is empty, so a token request is refused rather than presenting somebody else's
# credential. %dev and %test keep the old qits-net name.
quarkus.oidc-client.qits.auth-server-url=${QITS_RESOURCE_IDP_URL:https://idp.qits.${QITS_DOMAIN}/idp}
%dev.quarkus.oidc-client.qits.auth-server-url=${QITS_RESOURCE_IDP_URL:http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp}
%test.quarkus.oidc-client.qits.auth-server-url=${QITS_RESOURCE_IDP_URL:http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp}
quarkus.oidc-client.qits.discovery-enabled=false
quarkus.oidc-client.qits.token-path=token
quarkus.oidc-client.qits.client-id=${QITS_RESOURCE_IDP_CLIENT_ID:dev-qits-ci}
quarkus.oidc-client.qits.credentials.secret=${QITS_RESOURCE_IDP_CLIENT_SECRET:}
quarkus.oidc-client.qits.grant.type=client
# One audience for every service, the plan's ruling (epic qits-540 dossier, 'Plan (as of
# 2026-09-13)'): qits-platform. Not qits-githost — a receiver is addressed by the platform audience
# and by nothing else, the same value MachineAuth's `qits.auth.machine.platform-audience` admits for
# what arrives.
quarkus.oidc-client.qits.grant-options.client.audience=qits-platform
quarkus.oidc-client.qits.early-tokens-acquisition=false
# On wherever the deployer runs it — every deployment has the resource, so there is no switch to
# flip. Off under %dev and %test, so a suite or a local run never dials an idp; StoryRunTokens turns
# it on against a stub where a story needs a real token.
quarkus.oidc-client.qits.client-enabled=true
%dev.quarkus.oidc-client.qits.client-enabled=false
%test.quarkus.oidc-client.qits.client-enabled=false

# --- the two client names the DEPLOYMENT still sets, neutralised ----------------------------------
# These are not stubs for clients nobody configures. The running container still carries the old
# extras: `QUARKUS_OIDC_CLIENT_{CLIENT_ID,CREDENTIALS_SECRET,AUTH_SERVER_URL,CLIENT_ENABLED,
# GRANT_OPTIONS_CLIENT_AUDIENCE}` and the same five under `QUARKUS_OIDC_CLIENT_GITHOST_*` (read off
# dev-qits-ci's envKeys, 2026-10-02). Nothing here reads them any more, and the application
# declares neither — but **one such variable is enough to mint the
# map key**, so an unnamed default client and a `githost` client EXIST at runtime whatever this file
# leaves out, and both `client-enabled` and `discovery-enabled` default to TRUE when nothing says
# otherwise.
#
# An enabled client is not inert. `initOidcClients` resolves the `OidcClients` bean during RUNTIME
# INIT, and its constructor awaits `createOidcClient(...)` for the default client and every named key
# in turn, BEFORE the HTTP listener accepts. A refused connection is a WARN and a DeferredOidcClient;
# an issuer that accepts and does not answer — a proxy in front of a still-starting idp, a wedged
# idp — FAILS THE BOOT after the 10s connection timeout, once per client
# (`io.smallrye.mutiny.TimeoutException at OidcClientRecorder.createOidcClient`, reproduced twice).
# Nothing injects either client: `@NamedOidcClient("qits")` is the only injection point here.
#
# So each line below does a different job, measured against SmallRye Config 3.16 with those
# variables really set:
#   * `client-enabled=false` neutralises the client OUTRIGHT — `createOidcClientUni` answers a
#     DisabledOidcClient before it reads anything else — on every deployment that does NOT set the
#     env twin. It does not win where one is set: the environment source is ordinal 300 and this
#     file 250, so a deployed `QUARKUS_OIDC_CLIENT_CLIENT_ENABLED=true` resolves this key to true.
#   * `discovery-enabled=false` is therefore what keeps THIS deployment's enabled clients from
#     dialling: it removes the discovery GET, and no deployment entry names this key, so this file is
#     the highest source that speaks about it.
#   * `token-path` is not decoration and cannot be dropped with discovery off: with neither
#     discovery nor a token path the recorder's token endpoint URL is null and runtime init throws
#     `ConfigurationException` ("token endpoint URL is not configured and can not be discovered") —
#     a boot that always fails instead of one that fails when an idp is slow. Nothing ever asks
#     these two clients for a token, so the value only has to resolve.
#
# These lines go once no `QUARKUS_OIDC_CLIENT_*` / `QUARKUS_OIDC_CLIENT_GITHOST_*` variable reaches
# the container any more — the config GC deletes the retired entries, and the deployer's extras file
# stops stating them (qits-375: a deleted entry still reaches the container while that file names
# it) — and not one release before: with no variable there is no map key, no client and nothing left
# to neutralise.
quarkus.oidc-client.client-enabled=false
quarkus.oidc-client.discovery-enabled=false
quarkus.oidc-client.token-path=token
quarkus.oidc-client.githost.client-enabled=false
quarkus.oidc-client.githost.discovery-enabled=false
quarkus.oidc-client.githost.token-path=token

# --- announcing green runs: there is no key here any more -----------------------------------------
# A green run used to be announced TWICE: a BuildSuccessful event on the bus, and a direct POST to
# qits-deployments' HTTP intake at qits.deployments.intake-url, carrying a
# qits-idp bearer this service asked quarkus-oidc-client for. Both that key and the whole
# quarkus.oidc-client.* block went with it, along with notify/PdBuildNotifier, notify/PdBearer and
# the ci/control/PdNotifier port. The block above is a NEW one for a new caller, pointed at a
# different audience — not that arrangement coming back.
#
# What replaced them is the bus, and it is durable where the POST was fire-and-forget: qits-ci
# publishes through the eventstream outbox (so an unreachable qits-events delays an event rather
# than losing it) and a subscriber catches up from the log after a restart. The measured loss this
# closes is a whole class rather than one incident: a refusal window during an idp cutover used to
# cost a deployment silently, and the bounded retries added in answer to that only narrowed the
# window.
#
# WHICH EVENT DEPLOYS HAS SINCE CHANGED, and the retirement above is only more true for it. The
# deployer subscribed to BuildSuccessful when the POST retired; it subscribes to SoftwareRelease
# now, because a green build stopped being a reason to put anything live — a release is. So
# BuildSuccessful is a verdict about a commit, read by qits-projects' release-request gate, and this
# service's SoftwareRelease is what a deployment follows from. A repository whose pipeline publishes
# nothing deploys nothing, however green it goes.
#
# The deployer's intake still exists and still takes a POST, at /events/software-released; the
# /events/build-succeeded path this service used to call is gone at that end too and answers 404.
# The door that is left is the manual and recovery one — a bootstrap replay knocks on it by hand —
# and nothing in qits-ci calls it, so nothing here configures it. So there is no address of the
# deployer in this file at all, and a deployment without one is a deployment where nobody
# subscribes.
#
# Outbound identity went with it, and came back for a different hop: the credential this service
# presents is the `qits` client's (the block above), never the deployer's. The inbound gate
# (qits.auth.machine.required, above) is untouched and stays independent, which it always was.

# --- the packaged artifact -----------------------------------------------------------------------
# Name the build output `qits-ci` rather than qits-ci-service-<version>-runner, so `-Dnative`
# produces target/qits-ci and the process is identifiable in `ps` while debugging a container. The
# name is spelled TWICE: here, and as failsafe's
# native.image.path in service/pom.xml. They move together — if they drift, the native IT launches
# nothing and passes.
quarkus.package.output-name=qits-ci
quarkus.package.jar.add-runner-suffix=false

# --- telemetry --------------------------------------------------------------------------------
# OTLP to qits-observability, THROUGH THE EDGE (epic qits-428). The extension instruments; the
# exporters are qits-telemetry-core's CDI beans, built on OpenTelemetry's upstream OTLP/HTTP
# builders, whose header supplier attaches the `qits` oidc client's CURRENT bearer on every export.
# The edge refuses an anonymous POST to the receiver's vhost, and Quarkus' own exporter takes only
# static headers, which is why it is replaced.
#
# The receiver's address is the module's default, its edge host:
#   qits.telemetry.endpoint=https://observability.qits.${QITS_DOMAIN}/observability/api/otel
# QITS_DOMAIN has no default; the key is read only when the SDK builds the exporters, so %dev and
# %test (SDK off, below) never need it. /v1/{traces,logs,metrics} is appended by the module.
#
# qits.observability.url and quarkus.otel.exporter.otlp.endpoint/.protocol are GONE: with this jar
# on the classpath none of Quarkus' own OTLP exporters is ever built, so they reached nothing.

# The three signals through the CDI exporters. `cdi` is Quarkus' default for all three; spelled out
# so that a changed default is a diff and not a silence.
quarkus.otel.traces.exporter=cdi

# Logs ride the CDI log exporter; traces are on by default. The receiver decodes all three signals,
# and a log record correlated to a trace is most of why the receiver exists.
#
# THE THREE LOGS KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry
# logging integration PREVIEW, and the whole of what ships application logs to qits-observability is
# the handler this enables — so an upgrade that changed one of these defaults would stop the
# platform's logging with a green build and no error anywhere. Written down, a change of default is
# a diff rather than a silence. Measured against Quarkus 3.34.6's own config classes rather than
# recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` routes the records at qits-telemetry-core's LogRecordExporter bean; Quarkus builds its own
# only when bean discovery finds none. `handler.enabled` is the JBoss Log Manager handler that turns
# an ordinary org.jboss.logging.Logger call into an OTLP record — without it the other keys describe
# a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out, so that what leaves the
# process is a deliberate amount rather than whatever a debug category happens to emit. Console
# logging is untouched by all of it — the OTel handler is an ADDITIONAL copy, never the only one,
# which is what keeps a container's stdout the durable-at-host fallback when the receiver is down.
#
# That all three signals really leave a packaged process, carrying the bearer, is proven once,
# platform-wide, in qits-events (OtelLogBridgeTest decodes a real ExportLogsServiceRequest;
# PackagedLogBridgeIT repeats it against the packaged artifact). Same extension, same keys here, so
# what this repo guards is the configuration: telemetry/OtelLogConfigTest pins these values so drift
# cannot disable export quietly.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics too, and `enabled` is not optional: metrics are OFF by default in Quarkus, so without it
# the third signal never leaves and the observability UI has nothing to plot.
quarkus.otel.metrics.enabled=true
quarkus.otel.metrics.exporter=cdi

# Dark in dev and test, the platform's convention: a suite must dial nothing. With the SDK off the
# exporters are never built, so neither profile needs QITS_DOMAIN or the oidc client for telemetry.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true

# --- the platform event bus ---------------------------------------------------------------------
# This service publishes `BuildSuccessful` to qits-events when a run goes green, and listens for it
# again off the same bus (bus/BuildSuccessfulAnnouncer and bus/BuildSuccessfulListener; the machinery
# is the published qits-eventstream jar).
#
# NOTHING THE BUS NEEDS IS SPELLED HERE, deliberately. `qits.events.url`, the outbox's own datasource
# and Flyway lineage, the publish timeout, the retry budget and the redial backoff all ship as
# defaults in that jar's META-INF/microprofile-config.properties at ordinal 100 — the same way `ci`
# ships its own — and a copy in this file would be a second place to change and a silent way for the
# two to drift. A deployment overrides them by env, unchanged by anything here:
# `QITS_EVENTS_URL` and `QUARKUS_DATASOURCE_EVENTSTREAM_JDBC_URL` (the outbox must live on the data
# volume, not in the container's ~/.qits).
#
# What DOES belong here is the darkness, because the library ships enabled — a library that shipped
# dark would be one whose first deployment discovers it was never wired up — and the deployable is
# what owns where it is real. Same policy and same reasoning as the OTel keys above: a clone-alone
# `./mvnw verify` and a `quarkus:dev` have no qits-events on the far side, and enabled, every green
# run would pay the publish timeout dialling an unresolvable host, leave an outbox row behind and
# have the sweeper retry it, while the subscriber redialled a stream nobody serves. Off means
# publish() is a debug line, the sweeper does nothing and no stream is dialled — there is no
# half-enabled state.
#
# A test that wants the bus turns it back on for itself against an in-test stub server
# (`BuildSuccessfulPublishTest`), never against a real qits-events.
%dev.qits.eventstream.enabled=false
%test.qits.eventstream.enabled=false

# THERE IS NO %dev/%test qits.ci.daemon-autoadopt-enabled ANY MORE, and nothing replaces it. It
# darkened a SECOND dial to qits.events.url that the key above did not cover — the daemon pin
# ladder's startup discovery, which adopted qits-ci-daemon releases and probed them in throwaway
# containers. The ladder is retired: the daemon version is the pinned protocol dependency's now, so
# there is no discovery, no listener and nothing left for a suite to darken. A clone-alone
# `./mvnw verify` and a `quarkus:dev` dial qits-events for the bus alone.

# ------------------------------------------------------------------------------------------------
# WHERE A CI LEASE DIALS AND DOWNLOADS — every address a lease is told (targethost/CiSlotAddresses):
# the daemon's control socket (wss://ci.qits.<domain>/ci/daemon), the daemon binary under the
# registry, the git host its warm mirror is fetched from, the maven urls, the workspaces door. A lease
# runs on an execution target, which may be any node, so every one of those is a PUBLIC name,
# composed from the platform's domain the way qits-idp composes its own canonical origin
# (PlatformDomain.canonicalOrigin): `https://<host>.qits.<domain>`, where `qits` is the platform's
# own project and carries NO environment label.
#
# The domain is QITS_DOMAIN, which qits-deployments writes into every container. A domain with no dot
# in it — localhost — or none at all is a clone or a suite, not a public installation, and THERE IS
# NOTHING TO FALL BACK TO: qits-ci then asks for no lease, and a queued run waits, saying why in the
# log. The suite states its own domain, in testdb/HermeticConfigSource, above the environment — so no
# ambient QITS_DOMAIN decides its answers.
qits.ci.domain=${QITS_DOMAIN:}

# A resource read by name at run time is not bundled by a native image unless it is named here. The
# packaged release archetypes are the costly case:
# `release-archetypes/<name>.yml` comes out of the `qits-ci-domain` jar (ci/src/main/resources/
# release-archetypes/) and CiReleaseArchetypes opens it by a
# name a repository's release.yml supplied. Left out of the binary, every `archetype:` that is not
# shadowed locally is "no such archetype" — no release-request run for any such repository, settled,
# with one WARN each — while every JVM suite stays green, because on a JVM the classpath has them
# regardless. A glob's `*` does not cross a `/`, which is what is wanted: one directory, flat.
# CiReleaseArchetypes.requirePackaged is the guard for this line: at boot it reads and parses all
# eight, in every launch mode, and a binary missing any of them refuses to start — so a wrong value
# here fails the deployment's health gate and the previous container stays, rather than deploying.
# `platform-pipelines/<name>.yml` is the same case again, and CiPlatformPipelines reads every one at
# boot for the same reason, and so is `platform-pipelines/automations/<kind>.yml`, which a `*` one
# directory up does not reach.
quarkus.native.resources.includes=release-archetypes/*.yml,platform-pipelines/*.yml,platform-pipelines/automations/*.yml

# --- execution targets (epic qits-1481) ----------------------------------------------------------
# A CI run is one CI lease on an execution target, asked of qits-system (targethost/CiLeases).
# qits.system.url is where qits-system answers: scheme, host and port with NO path, the shape
# qits.ci.git-host-url has — qits-system serves its own /system/api segment. Defaulted to
# qits-system's edge host (qits-1414, feature qits-1406; QITS_DOMAIN has no default, and %dev and
# %test keep the old qits-net name), so a deployment sets nothing. The bearer is the
# `qits` oidc client's below (qits:system, audience qits-platform), which qits-system names the
# lease's owner by (dev-qits-ci → qits-ci). An unreachable qits-system leaves a queued run waiting,
# and the reconcile asks again.
qits.system.url=https://system.qits.${QITS_DOMAIN}
%dev.qits.system.url=http://${QITS_ENVIRONMENT:dev}-qits-system:8080
%test.qits.system.url=http://${QITS_ENVIRONMENT:dev}-qits-system:8080
# How often targethost/CiLeases lists this service's leases and maps each onto its run: the catch-up
# for a TargetLeaseChanged that was lost, qits-system's own advice. Also where a lease no live run
# names is ended, and where a queued run that holds no lease yet is asked one again.
qits.ci.target-leases.reconcile-interval=PT30S

# HOW LONG A RUN WAITS FOR ITS ci-daemon TO DIAL BACK AFTER ITS SOCKET DROPS (daemonhost/CiDaemonRegistry,
# qits-748). The daemon's socket goes through the platform edge, so an edge redeploy drops every
# lease's socket at the same instant while the containers keep running. Within this grace the daemon
# re-dials with the same token, says Hello again and is re-admitted to its launch: answered an Ack,
# sent its in-flight RunStep again (it ignores a step index it already ran) and any Cancel that found
# no socket, and its replayed chunks are deduplicated by the lease's one seq. Unclaimed in time, the
# step ends CONNECTION_LOST as before. It is also how long a restarted qits-ci waits for an inherited
# run's daemon (qits-1192).
# The step's own deadlines keep running through the gap — the grace never extends a step's timeout. The
# daemon's own reconnect budget (qits.ci.reconnect-budget-ms in qits-ci-daemon, 90s) is longer, so it
# is still trying when this runs out. 0 turns the grace off: a close is CONNECTION_LOST at once.
# Since qits-2163 it bounds only a launch that is NOT running a step (still dialling, making its
# worktree, between two steps, or with a Cancel owed); a running step is held instead, see below.
qits.ci.daemon.reconnect-grace-seconds=60
# WHETHER A STEP THAT IS RUNNING WHEN ITS ci-daemon's SOCKET DROPS IS HELD PAST THE GRACE ABOVE
# (daemonhost/CiDaemonRegistry, qits-2163). The edge sits on both legs, so an edge outage longer than
# the grace lost every step on every target while the containers kept running (2026-11-12: 85
# minutes, every step CONNECTION_LOST at second 60). Held, the step stays pending and its daemon's
# re-dial is re-admitted as inside the grace, until one of: its lease is known to have ended (the
# step says [the run's lease ended: …]), the step's own backstop passes (timeout +
# qits.ci.builder-wait-max-seconds + qits.ci.step-timeout-grace-seconds), or it is cancelled (the
# grace above then runs from the cancel). Each ends it CONNECTION_LOST. The daemon re-dials for as
# long as its step can still be running (qits-ci-daemon, qits-2163); an older daemon still gives up
# after its 90s budget, its lease then ends and the step with it. false restores the grace for a
# running step too.
qits.ci.daemon.hold-running-steps=true
# HOW LONG A BOUND ci-daemon CONNECTION MAY SAY NOTHING BEFORE IT IS TREATED AS DROPPED (qits-1728).
# The edge splices the daemon's leg and this host's into one tunnel, so a daemon leg that dies with no
# FIN or RST leaves this side's socket open for the edge's idle timeout (an hour), and the grace above
# never starts. Every frame counts, the daemon's Heartbeat (every 10s) included, so this is three
# missed beats; past it the connection is closed 1001 SILENT and the grace above runs as for any drop.
# 0 turns the check off.
qits.ci.daemon.silence-limit-seconds=30
